<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,follow" />
<title>Page not found — The Village Investment</title>
<script>
  // Single-page-app deep-link support on static hosting (rafgraph pattern).
  // pathSegmentsToKeep = 0 for domain-root deploys; set to 1 for /repo/ project pages.
  (function(l){
    var seg = 0;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g,'~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g,'~and~') : '') +
      l.hash
    );
  }(window.location));
</script>
<style>body{font-family:system-ui,sans-serif;background:#052e3d;color:#F3EFE6;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}a{color:#bfe3ef}</style>
</head>
<body>
  <div>
    <h1 style="font-weight:600">Page not found</h1>
    <p>Redirecting… If nothing happens, <a href="/en/">go to the homepage</a>.</p>
  </div>
</body>
</html>
