name: Publish from the CMS

# The dashboard writes to Postgres; the public site is a static file. This is
# what connects them: it regenerates the data literals from the database,
# rebuilds index.html, regenerates the sitemap, runs the full test suite, and
# only then commits to the deploy branch — where deploy.yml picks it up.
#
# Nothing here deploys a build that failed its tests. That is the point of
# putting the tests between the rebuild and the commit rather than after it.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL   https://<ref>.supabase.co
#   SUPABASE_KEY   a key permitted to read the cms schema
# Neither is ever printed: the run summary reports counts, not rows.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this publish (appears in the commit message)'
        required: false
        default: 'Dashboard publish'
  schedule:
    # Once a night, so an edit made in the dashboard reaches the site even if
    # nobody presses Publish. Nothing is committed when nothing changed.
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: cms-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the development branch
        uses: actions/checkout@v4
        with:
          ref: claude/html-file-implementation-hv72gn
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate the data literals from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 tools/db_to_src.py

      - name: Rebuild the site
        run: |
          python3 tools/build.py
          python3 tools/build_admin.py

      - name: Regenerate the sitemap
        run: python3 tools/sitemap.py

      - name: Test the site that was just built
        run: node tools/domtest.cjs

      - name: Test the dashboard that was just built
        run: node tools/admintest.cjs

      - name: Confirm the sitemap matches the routes
        run: python3 tools/sitemap.py --check

      # An edit made in the dashboard can break the head without touching the
      # body — a renamed project that collides with another page's title, a
      # blurb deleted down to nothing. This is the check that notices.
      - name: Audit the head of every published URL
        run: node tools/seoaudit.cjs

      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Database and site already agree — nothing to publish."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Commit the rebuild
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name  'The Village CMS'
          git config user.email 'cms@thevillageinvestment.com'
          git add -A
          git commit -m "Publish: rebuild the site from the database

          ${{ github.event.inputs.reason || 'Scheduled publish' }}

          Regenerated by tools/db_to_src.py, built, and verified by the full
          test suite before this commit was made."
          git push origin HEAD:claude/html-file-implementation-hv72gn

      - name: Hand the build to the deploy branch
        if: steps.diff.outputs.changed == '1'
        run: git push --force-with-lease origin HEAD:claude/deploy-github-connect-oaq96l

      - name: Summary
        run: |
          {
            echo "### Publish"
            echo
            if [ "${{ steps.diff.outputs.changed }}" = "1" ]; then
              echo "Rebuilt from the database and deployed."
            else
              echo "No change — the site already matched the database."
            fi
            echo
            echo "- site tests: passed"
            echo "- dashboard tests: passed"
            echo "- sitemap: in sync with the routes"
          } >> "$GITHUB_STEP_SUMMARY"
