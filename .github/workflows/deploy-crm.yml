name: CRM console — validate & deploy

# Cloudflare already auto-deploys this repo: its Git integration runs
# `npx wrangler deploy` from the repository root on every push, using the root
# wrangler.toml (Worker "black-shape-dfbe").
#
# So this workflow does NOT deploy on push — that would race Cloudflare's own
# build and deploy the same Worker twice. Instead:
#   * on push  -> validate the console so a broken build never reaches Cloudflare
#   * manually -> deploy on demand from the Actions tab (needs CLOUDFLARE_API_TOKEN)
on:
  push:
    paths:
      - 'web/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-crm.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also deploy to Cloudflare (requires CLOUDFLARE_API_TOKEN)'
        type: boolean
        default: false

concurrency:
  group: crm-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The console is a single self-contained file: a syntax error in its
      # inline script would ship a blank page. Parse it before Cloudflare does.
      - name: Validate inline JavaScript
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let failed = false;
          for (const file of ['web/public/index.html', 'web/public/app.html']) {
            if (!fs.existsSync(file)) { console.log(`skip (absent): ${file}`); continue; }
            const html = fs.readFileSync(file, 'utf8');
            const blocks = html.match(/<script>([\s\S]*?)<\/script>/g) || [];
            const src = blocks.map(s => s.replace(/<\/?script>/g, '')).join('\n');
            if (!src.trim()) { console.log(`skip (no inline script): ${file}`); continue; }
            try {
              new Function(src);
              console.log(`OK  ${file} — ${blocks.length} script block(s), ${src.length} chars`);
            } catch (e) {
              console.log(`::error file=${file}::Inline JS syntax error: ${e.message}`);
              failed = true;
            }
          }
          process.exit(failed ? 1 : 0);
          EOF

      # Catch config drift that would break Cloudflare's root build.
      - name: Check the deploy config Cloudflare actually uses
        run: |
          test -f wrangler.toml || { echo "::error::wrangler.toml is missing from the repository root — Cloudflare's build runs 'npx wrangler deploy' there and will fail without it."; exit 1; }
          main=$(grep -oP '^main\s*=\s*"\K[^"]+' wrangler.toml || true)
          dir=$(grep -oP '^directory\s*=\s*"\K[^"]+' wrangler.toml || true)
          [ -n "$main" ] && { test -f "$main" || { echo "::error::wrangler.toml main = '$main' does not exist."; exit 1; }; }
          [ -n "$dir" ]  && { test -d "$dir"  || { echo "::error::wrangler.toml assets directory = '$dir' does not exist."; exit 1; }; }
          echo "Root wrangler.toml OK — worker: $(grep -oP "^name\s*=\s*['\"]\K[^'\"]+" wrangler.toml), assets: $dir, main: $main"

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."
            echo "Add it under Settings → Secrets and variables → Actions → New repository secret."
            echo "Create the token at https://dash.cloudflare.com/profile/api-tokens (\"Edit Cloudflare Workers\" template)."
            exit 1
          fi

      # Deploy from the repository ROOT, exactly as Cloudflare's own build does,
      # so both paths publish the same Worker from the same config.
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deployed console responds
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::No deployment URL returned; skipping live verification."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              if grep -qi 'Village CRM' /tmp/page.html; then
                echo "Verified: HTTP 200 and the page identifies as Village CRM."
                {
                  echo "### Deployed :rocket:"
                  echo "Console: $URL"
                  echo "Mobile app: $URL/app"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error::HTTP 200 but the response is not the Village CRM console."
              head -c 400 /tmp/page.html
              exit 1
            fi
            echo "attempt $attempt: HTTP $code — retrying in 10s (edge propagation)"
            sleep 10
          done
          echo "::error::$URL did not return HTTP 200 after 5 attempts."
          exit 1
