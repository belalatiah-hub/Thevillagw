name: Deploy static site to GitHub Pages

# Publishes the site whenever the deploy branch changes, and lets you
# trigger a deploy manually from the Actions tab.
on:
  push:
    branches:
      - claude/deploy-github-connect-oaq96l
  workflow_dispatch:

# Grant the token permission to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (build via GitHub Actions) if it isn't enabled yet,
          # so the first deploy doesn't require a manual Settings step.
          enablement: true

      - name: Exclude internal-only folders from the published site
        # These must never be served. data-import-kit/ holds internal staff
        # templates; src/ and tools/ are the build inputs and the build itself,
        # and publishing them hands over the commented source and the tooling.
        # index.html already contains every byte the page needs, so nothing at
        # runtime misses them. Removing them from the runner checkout keeps them
        # out of the Pages artifact; Cloudflare is handled by .assetsignore.
        run: rm -rf data-import-kit src tools unrar-0.4-py3-none-any.whl

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The entire repo root is the site (single-file static app).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
