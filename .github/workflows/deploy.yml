name: Deploy static site to GitHub Pages

# Publishes the site whenever the deploy branch changes, and lets you
# trigger a deploy manually from the Actions tab.
on:
  push:
    branches:
      - claude/deploy-github-connect-oaq96l
  workflow_dispatch:

# Grant the token permission to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (build via GitHub Actions) if it isn't enabled yet,
          # so the first deploy doesn't require a manual Settings step.
          enablement: true

      - name: Exclude internal-only folders from the published site
        # data-import-kit/ holds internal staff data-entry templates; it must
        # never be served publicly. Removing it from the runner checkout keeps
        # it out of the Pages artifact (Cloudflare is handled by .assetsignore).
        run: rm -rf data-import-kit

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The entire repo root is the site (single-file static app).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
