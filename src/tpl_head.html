  <!-- PERF · Fonts are self-hosted. They used to come from fonts.googleapis.com,
       which put a third-party DNS + TLS + CSS round-trip on the critical path
       before a single glyph could paint, and sent every visitor's IP to a third
       party. Only the subsets this site renders are shipped (Latin, Latin-ext,
       Arabic) — 250 KB for ten files, versus the full family set.
       Fraunces and Plus Jakarta Sans are variable: ONE file each covers 400-700,
       so an English page pulls 94 KB of type rather than re-downloading the same
       bytes once per weight. The two above-the-fold faces are preloaded; the rest
       arrive with the stylesheet. font-display:swap keeps text visible throughout.

       The preload is language-aware. One index.html serves both /en/ and /ar/,
       so a static preload of the Latin faces made every Arabic visitor download
       94 KB of type their headline never renders in — ahead of the Tajawal it
       does. This runs before the parser reaches the stylesheet, so the injected
       hints are still discovered early. -->
  <script>
  (function () {
    var ar = /^\/ar(\/|$)/.test(location.pathname);
    var faces = ar
      ? ['tajawal-400-arabic', 'tajawal-500-arabic']
      : ['fraunces-latin', 'plus-jakarta-sans-latin'];
    for (var i = 0; i < faces.length; i++) {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2';
      l.href = '/fonts/' + faces[i] + '.woff2'; l.crossOrigin = 'anonymous';
      document.head.appendChild(l);
    }

    // The home hero's first slide is the LCP element, and it is a CSS
    // background applied by the app script — a URL no preload scanner can
    // see. Without this hint the fetch could not even begin until the bundle
    // had parsed and laid the element out. 'beach' and the 700px breakpoint
    // must match HERO_SLIDES[0] and heroSrc(); domtest asserts that they do.
    if (/^\/(en|ar)\/?$/.test(location.pathname)) {
      var hero = document.createElement('link');
      hero.rel = 'preload'; hero.as = 'image'; hero.type = 'image/webp';
      hero.href = '/project-media/hero/beach' +
        ((window.innerWidth || 1200) <= 700 ? '-800' : '') + '.webp';
      hero.setAttribute('fetchpriority', 'high');
      document.head.appendChild(hero);
    }
  })();
  </script>
