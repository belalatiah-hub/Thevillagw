  <style>
  /* ===================================================================
     DESIGN TOKENS — derived from the approved master logo (teal/ink/bone)
     =================================================================== */
  :root{
    --teal-900:#052e3d; --teal-800:#073D52; --teal-700:#0b4a63;
    --teal-600:#115F7D; --teal-500:#1a7ba0; --teal-400:#3fa3c4; --teal-050:#e7f0f3;
    --ink:#0e1a1f; --ink-2:#3c525b; --ink-3:#526a71;
    --bone:#F3EFE6; --bone-2:#faf7f0; --paper:#ffffff;
    --line:#e5ddcf; --line-2:#efe9dd; --line-cool:#dfe6e8;
    --ok:#1f7a54; --ok-bg:#e6f3ec; --warn-ink:#8a5a12; --warn-bg:#f6edda;
    --danger:#b23a2e;
    --focus:#0b4a63;
    --shadow-sm:0 1px 2px rgba(7,61,82,.06),0 1px 3px rgba(7,61,82,.05);
    --shadow-md:0 6px 18px -6px rgba(7,61,82,.18),0 2px 6px rgba(7,61,82,.06);
    --shadow-lg:0 24px 48px -18px rgba(7,61,82,.30);
    --r-sm:8px; --r:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
    --pad:clamp(16px,4vw,28px);
    --maxw:1200px;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Fraunces",Georgia,"Iowan Old Style","Times New Roman",serif;
    --arab:"Tajawal","Segoe UI",Tahoma,Arial,system-ui,sans-serif;
    --t:200ms cubic-bezier(.2,.6,.2,1);
    --header-h:68px;
  }
  html[dir="rtl"]{ --sans:var(--arab); --serif:var(--arab); }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bone-2);
    line-height:1.6;font-size:16.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:hidden;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
  img{max-width:100%;display:block;height:auto}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;color:inherit}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.12;margin:0;color:var(--ink);letter-spacing:-.01em}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{letter-spacing:0;font-weight:700}
  p{margin:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
  ::selection{background:var(--teal-600);color:#fff}

  /* ---- Skip link ---- */
  .skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--teal-800);color:var(--bone);
    padding:10px 16px;border-radius:var(--r-sm);transition:top var(--t);font-weight:600}
  .skip:focus{top:12px}
  html[dir="rtl"] .skip{left:auto;right:12px}

  /* ---- Layout ---- */
  .wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
  .section{padding-block:clamp(44px,7vw,86px)}
  /* No-JS / pre-hydration fallback content (replaced by the SPA on boot) */
  .prerender{max-width:var(--maxw);margin:0 auto;padding:clamp(48px,9vw,110px) var(--pad)}
  .prerender h1{font-size:clamp(2rem,5vw,3rem);margin:14px 0 18px;max-width:20ch}
  .prerender p{max-width:64ch;color:var(--ink-2);margin-bottom:18px}
  .prerender nav{display:flex;flex-wrap:wrap;gap:10px 18px;margin:22px 0}
  .prerender nav a{color:var(--teal-700);font-weight:600;text-decoration:underline}
  .section--tight{padding-block:clamp(30px,5vw,56px)}
  .section--flush-t{padding-block-start:clamp(14px,2.4vw,26px)}
  .section--flush-b{padding-block-end:clamp(14px,2.4vw,26px)}
  main{flex:1 0 auto;display:block}
  .eyebrow{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-600)}
  html[dir="rtl"] .eyebrow{letter-spacing:.06em}
  .sec-head{max-width:62ch;margin-bottom:clamp(22px,4vw,40px)}
  .sec-head h1,.sec-head h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin-top:10px;font-weight:800;line-height:1.15}
  .sec-head p{color:var(--ink-2);margin-top:12px;font-size:1.02rem}
  .lead{font-size:clamp(1.02rem,1.8vw,1.18rem);color:var(--ink-2)}

  /* ---- Buttons ---- */
  .btn{display:inline-flex;align-items:center;gap:.5em;justify-content:center;
    padding:.72em 1.25em;border-radius:var(--r-pill);border:1.5px solid transparent;
    font-weight:600;font-size:.95rem;transition:var(--t);min-height:44px;white-space:nowrap;line-height:1}
  .btn svg{width:1.05em;height:1.05em;flex:none}
  .btn--primary{background:var(--teal-800);color:var(--bone)}
  .btn--primary:hover{background:var(--teal-700);transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .btn--ghost{background:transparent;border-color:var(--line-cool);color:var(--ink)}
  .btn--ghost:hover{border-color:var(--teal-600);color:var(--teal-700);background:var(--teal-050)}
  .btn--light{background:var(--bone);color:var(--teal-800)}
  .btn--light:hover{background:#fff;transform:translateY(-1px)}
  .btn--sm{padding:.5em .9em;min-height:38px;font-size:.85rem}
  .btn--icon{padding-inline:.7em;min-width:40px;justify-content:center}
  .btn--block{width:100%}
  .btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
    border-radius:var(--r-pill);border:1.5px solid var(--line-cool);background:var(--paper);transition:var(--t)}
  .icon-btn:hover{border-color:var(--teal-600);color:var(--teal-700)}
  .icon-btn svg{width:20px;height:20px}

  /* ---- Chips / badges ---- */
  .chip{display:inline-flex;align-items:center;gap:.4em;padding:.32em .7em;border-radius:var(--r-pill);
    font-size:.76rem;font-weight:600;background:var(--teal-050);color:var(--teal-700);line-height:1}
  .chip--muted{background:var(--bone);color:var(--ink-2)}
  .chip--status{background:#eaf5ef;color:var(--ok)}
  .chip--launch{background:#fbeede;color:var(--warn-ink)}
  .badge-src{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;color:var(--ink-3);font-weight:500}
  .badge-src svg{width:13px;height:13px;color:var(--teal-500)}
  .prov{margin-top:6px;font-size:.72rem;color:var(--ink-3);display:flex;align-items:center;gap:.4em}
  .prov svg{width:13px;height:13px;color:var(--warn-ink);flex:none}

  /* ===================================================================
     HEADER
     =================================================================== */
  header.site{position:sticky;top:0;z-index:100;background:rgba(250,247,240,.86);
    backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line-2)}
  .nav{display:flex;align-items:center;gap:14px;height:var(--header-h)}
  .brand{display:flex;align-items:center;gap:10px;flex:none;margin-inline-end:auto}
  .brand img{height:30px;width:auto}
  .brand .sub{font-family:var(--serif);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--teal-600);font-weight:600;padding-inline-start:2px;border-inline-start:1px solid var(--line);margin-inline-start:2px;padding-block:2px}
  @media(max-width:520px){.brand .sub{display:none}}
  .nav-links{display:flex;align-items:center;gap:2px}
  .nav-links a{padding:9px 12px;border-radius:var(--r-sm);font-weight:600;font-size:.92rem;color:var(--ink-2);transition:var(--t);white-space:nowrap}
  .nav-links a:hover{color:var(--teal-800);background:var(--teal-050)}
  .nav-links a[aria-current="page"]{color:var(--teal-800)}
  .nav-links a[aria-current="page"]::after{content:"";display:block;height:2px;background:var(--teal-600);border-radius:2px;margin-top:3px}
  .nav-actions{display:flex;align-items:center;gap:8px;flex:none}
  .lang-btn{font-weight:700;font-size:.85rem;letter-spacing:.02em}
  .burger{display:none}
  @media(max-width:940px){
    .nav-links{display:none}
    .burger{display:inline-flex}
  }

  /* Mobile drawer */
  .drawer-back{position:fixed;inset:0;background:rgba(14,26,31,.5);opacity:0;visibility:hidden;transition:var(--t);z-index:150}
  .drawer-back.open{opacity:1;visibility:visible}
  .drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(88vw,340px);background:var(--bone-2);
    z-index:151;transform:translateX(100%);visibility:hidden;transition:transform var(--t),visibility 0s linear var(--t);display:flex;flex-direction:column;
    padding:20px;box-shadow:var(--shadow-lg);overflow-y:auto}
  html[dir="rtl"] .drawer{transform:translateX(-100%)}
  .drawer.open{transform:translateX(0);visibility:visible;transition:transform var(--t),visibility 0s}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .drawer nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .drawer nav a{padding:13px 12px;border-radius:var(--r-sm);font-weight:600;font-size:1.05rem;border-bottom:1px solid var(--line-2)}
  .drawer nav a:hover,.drawer nav a[aria-current="page"]{background:var(--teal-050);color:var(--teal-800)}

  /* ===================================================================
     HERO
     =================================================================== */
  .hero{position:relative;background:
      radial-gradient(120% 90% at 85% -10%,rgba(26,123,160,.18),transparent 55%),
      linear-gradient(160deg,var(--teal-900),var(--teal-800) 55%,var(--teal-700));
    color:var(--bone);overflow:hidden;isolation:isolate}
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
    background-image:linear-gradient(rgba(243,239,230,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(243,239,230,.04) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(90% 70% at 70% 0,#000,transparent 75%)}
  .hero .wrap{position:relative;z-index:2;padding-block:clamp(48px,8vw,104px)}
  /* Animated render backdrop (Ramla masterplan renders) behind the hero. */
  .hero__bg{position:absolute;inset:0;z-index:0;overflow:hidden}
  .hero__slide{position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;will-change:opacity,transform;transform:scale(1.02);
    animation:heroSlides 30s linear infinite}
  @keyframes heroSlides{
    0%{opacity:0;transform:scale(1.02)} 5%{opacity:1} 20%{opacity:1;transform:scale(1.09)}
    25%{opacity:0;transform:scale(1.10)} 100%{opacity:0;transform:scale(1.02)}
  }
  .hero__scrim{position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(6,44,58,.94) 0%,rgba(7,61,82,.84) 42%,rgba(9,74,97,.60) 100%),
      linear-gradient(0deg,rgba(6,44,58,.55),transparent 42%)}
  @media (prefers-reduced-motion:reduce){
    .hero__slide{animation:none;opacity:0;transform:none}
    .hero__slide:first-child{opacity:1}
  }
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,60px);align-items:center}
  @media(max-width:880px){.hero-grid{grid-template-columns:1fr;gap:32px}}
  .hero h1{color:var(--bone);font-size:clamp(2.2rem,5.6vw,3.9rem);font-weight:600;letter-spacing:-.02em}
  html[dir="rtl"] .hero h1{letter-spacing:0}
  .hero h1 em{font-style:italic;color:#bfe3ef;font-weight:500}
  .hero-sig{display:flex;align-items:center;gap:13px;margin-top:15px}
  .hero-sig::before{content:"";inline-size:38px;block-size:2px;border-radius:2px;flex:none;background:linear-gradient(90deg,#cfeaf3,rgba(207,234,243,.12))}
  html[dir="rtl"] .hero-sig::before{background:linear-gradient(270deg,#cfeaf3,rgba(207,234,243,.12))}
  .hero-sig span{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.06rem,2.3vw,1.42rem);line-height:1.2;color:#dcedf3;letter-spacing:.005em}
  html[dir="rtl"] .hero-sig span{font-style:normal;font-weight:700;letter-spacing:0}
  .hero p.lead{color:#d9e6ea;margin-top:18px;max-width:52ch}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .hero-trust{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:22px 34px;margin-top:34px;padding-top:26px;border-top:1px solid rgba(243,239,230,.16)}
  @media(max-width:640px){.hero-trust{grid-template-columns:repeat(2,1fr);gap:20px 16px}}
  .hero-trust .stat b{font-family:var(--serif);font-size:clamp(2.3rem,4.6vw,3.1rem);display:block;color:#fff;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .hero-trust .stat span{font-size:.85rem;color:#bcd0d6;margin-top:4px;display:block}
  .hero-trust .stat--count .stat__n{display:inline-block;min-width:1.4ch}

  /* Search panel */
  .search-card{background:var(--paper);color:var(--ink);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-lg)}
  .search-card h2{font-size:1.1rem;margin-bottom:4px}
  .search-card .muted{color:var(--ink-3);font-size:.82rem;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
  .field label{font-size:.78rem;font-weight:700;color:var(--ink-2)}
  .field select,.field input,.field textarea{width:100%;min-width:0;max-width:100%;padding:12px 14px;border:1.5px solid var(--line-cool);
    border-radius:var(--r-sm);background:var(--bone-2);font:inherit;color:var(--ink);transition:var(--t);min-height:46px;text-overflow:ellipsis}
  .field textarea{min-height:110px;resize:vertical}
  .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--teal-600);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(26,123,160,.15)}
  .field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .search-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
  @media (max-width:520px){ .search-grid{grid-template-columns:1fr} }
  .search-adv{margin:0 0 8px}
  .search-adv>summary{cursor:pointer;list-style:none;font-weight:700;font-size:.82rem;color:var(--teal-700);display:inline-flex;align-items:center;gap:6px;padding:6px 2px;user-select:none}
  .search-adv>summary::-webkit-details-marker{display:none}
  .search-adv>summary::after{content:"\25BE";font-size:.75rem;transition:transform .2s}
  .search-adv[open]>summary::after{transform:rotate(180deg)}
  .search-adv>summary:focus-visible{outline:2px solid var(--teal-600);outline-offset:3px;border-radius:6px}

  /* ===================================================================
     CARDS / GRIDS
     =================================================================== */
  .grid{display:grid;gap:22px}
  .grid--3{grid-template-columns:repeat(3,1fr)}
  .grid--4{grid-template-columns:repeat(4,1fr)}
  .grid--2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:980px){.grid--3,.grid--4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid--2,.grid--3,.grid--4{grid-template-columns:1fr}}

  .card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;
    display:flex;flex-direction:column;transition:var(--t)}
  .card:hover{box-shadow:var(--shadow-md);border-color:var(--line-cool);transform:translateY(-2px)}
  .card__media{aspect-ratio:16/10;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--teal-700),var(--teal-900))}
  .card__media .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);
    font-size:2.4rem;color:rgba(243,239,230,.9);font-weight:600}
  .card__media .pat{position:absolute;inset:0;opacity:.28;
    background:repeating-linear-gradient(135deg,rgba(243,239,230,.14) 0 2px,transparent 2px 16px)}
  .card__media .tags{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
  .card__media .tags .chip{background:rgba(7,61,82,.82);color:var(--bone);backdrop-filter:blur(4px)}
  .card__save{position:absolute;inset-block-start:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.9);display:grid;place-items:center;border:none;transition:var(--t)}
  .card__save:hover{background:#fff;transform:scale(1.08)}
  .card__save svg{width:19px;height:19px;color:var(--teal-700);transition:transform .18s cubic-bezier(.2,.8,.2,1.4)}
  /* Saved = solid red heart (clear "favourited" signal). */
  .card__save[aria-pressed="true"] svg{fill:#e5484d;color:#e5484d}
  .card__save[aria-pressed="true"]{background:#fff}
  .card__save[aria-pressed="true"] svg{transform:scale(1.12)}
  .card__body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card__body h3{font-size:1.16rem}
  .card__dev{font-size:.82rem;color:var(--ink-3);font-weight:600}
  .card__facts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:2px;font-size:.83rem;color:var(--ink-2)}
  .card__facts b{color:var(--ink);font-weight:700}
  .card__facts svg{width:15px;height:15px;flex:none;color:var(--teal-600);vertical-align:-2px}
  .card__facts span{display:inline-flex;align-items:center;gap:5px}
  .card__price{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--teal-800);margin-top:4px}
  .card__price small{font-family:var(--sans);font-size:.72rem;color:var(--ink-3);font-weight:600;display:block}
  .card__foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px}

  /* Area / developer tiles */
  .tile{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:180px;display:flex;
    align-items:flex-end;padding:18px;color:var(--bone);border:1px solid var(--line-2);transition:var(--t);
    background:linear-gradient(160deg,var(--teal-700),var(--teal-900))}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .tile--photo{background:var(--teal-900)}
  .tile .proj-cover{position:absolute;inset:0;transition:transform .5s ease}
  .tile:hover .proj-cover{transform:scale(1.05)}
  .tile__scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,46,61,.9),rgba(5,46,61,.28) 52%,rgba(5,46,61,.06))}
  .tile__body{position:relative;z-index:2;width:100%}
  @media (prefers-reduced-motion:reduce){ .tile .proj-cover,.tile:hover .proj-cover{transition:none;transform:none} }
  .tile .pat{position:absolute;inset:0;opacity:.2;background:repeating-linear-gradient(135deg,rgba(243,239,230,.16) 0 2px,transparent 2px 18px)}
  .tile h3{position:relative;color:var(--bone);font-size:1.25rem}
  .tile p{position:relative;font-size:.82rem;color:#cfe0e5;margin-top:4px}
  .tile .cnt{position:relative;margin-top:8px;font-size:.76rem;color:#bcd0d6}
  .tile-note{position:relative;margin-top:3px;font-size:.66rem;letter-spacing:.01em;color:#cfe0e5;opacity:.85}
  .area-banner{position:relative;aspect-ratio:16/6;min-height:180px;border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;background:var(--teal-900)}
  .area-banner .proj-cover{position:absolute;inset:0}
  .area-banner__pin{position:absolute;inset-block-end:14px;inset-inline-start:16px;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-pill);background:rgba(5,46,61,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--bone);font-weight:600;font-size:.9rem}
  .area-banner__pin svg{width:17px;height:17px}
  @media (max-width:640px){ .area-banner{aspect-ratio:16/9} }
  /* New Launches — image-only "Coming Soon" teaser (no price/details) */
  /* New-release: badge, teaser title, hero and the per-project spec table. */
  .chip--rel,.card__media .tags .chip--rel{background:var(--warn-bg);color:var(--warn-ink);
    border:1px solid rgba(138,90,18,.22);font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;font-size:.72rem;-webkit-backdrop-filter:none;backdrop-filter:none}
  .cs-title{position:absolute;inset-block-end:16px;inset-inline-start:16px;z-index:2;
    color:var(--bone);font-family:var(--serif);font-size:1.5rem;font-weight:700;letter-spacing:.02em;
    text-shadow:0 2px 14px rgba(5,46,61,.55)}
  .cs-card .cs-scrim{background:linear-gradient(180deg,rgba(5,46,61,.5),rgba(5,46,61,0) 34%,rgba(5,46,61,0) 60%,rgba(5,46,61,.62))}
  .rel-hero{max-width:64ch}
  /* align-self keeps the pill at its own width inside the flex-column card body,
     which would otherwise stretch it edge to edge. */
  .eoi{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;margin-top:2px;padding:6px 12px;
    border-radius:var(--r-pill);background:var(--warn-bg);color:var(--warn-ink);
    border:1px solid rgba(0,0,0,.06)}
  .eoi__k{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
  .eoi__v{font-size:.92rem;font-weight:700;white-space:nowrap}
  .rel-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.85rem}
  .rel-table th{text-align:start;font-weight:700;color:var(--ink-3);font-size:.72rem;
    letter-spacing:.08em;text-transform:uppercase;padding:0 0 6px}
  .rel-table td{padding:6px 0;border-top:1px solid var(--line-2);color:var(--ink-2)}
  .rel-table__p{font-weight:700;color:var(--ink);white-space:nowrap;text-align:end}
  .cs-wrap{display:flex;justify-content:center;gap:clamp(14px,2.4vw,26px);flex-wrap:wrap;margin-top:6px}
  .cs-card{position:relative;margin:0;width:100%;max-width:400px;border-radius:var(--r-lg);overflow:hidden;background:var(--teal-900);box-shadow:var(--shadow-lg)}
  .cs-img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
  .cs-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,46,61,.5),rgba(5,46,61,0) 34%)}
  .cs-badge{position:absolute;inset-block-start:14px;inset-inline-start:14px;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-pill);background:rgba(5,46,61,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);color:var(--bone);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
  a.cs-card--link{cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
  a.cs-card--link:hover{transform:translateY(-3px);box-shadow:0 28px 62px -20px rgba(5,46,61,.5)}
  a.cs-card--link .cs-img{transition:transform .5s ease}
  a.cs-card--link:hover .cs-img{transform:scale(1.03)}

  .dev-card{display:flex;gap:14px;align-items:center;padding:16px;background:var(--paper);
    border:1px solid var(--line-2);border-radius:var(--r);transition:var(--t)}
  .dev-card:hover{border-color:var(--teal-600);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .dev-logo{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none;
    font-family:var(--serif);font-weight:700;font-size:1.1rem;color:var(--bone);background:linear-gradient(150deg,var(--teal-600),var(--teal-900))}
  /* Official logo variant: white plate, contain (never distort), inset padding,
     hairline ring so a light logo still reads on a white surface. */
  .dev-logo--img{background:#fff;object-fit:contain;padding:7%;
    box-shadow:inset 0 0 0 1px rgba(7,61,82,.10)}
  /* Developer-page hero lockup — natural aspect ratio inside a card. */
  .dev-lockup-wrap{display:inline-flex;align-items:center;justify-content:center;
    padding:14px 20px;background:#fff;border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-sm)}
  .dev-lockup{max-width:230px;max-height:92px;width:auto;height:auto;object-fit:contain}
  /* Developer feature blocks: masterplan + themed cards. */
  .dev-feat__title{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .dev-feat__ico{width:22px;height:22px;color:var(--teal-600);flex:none}
  /* The plan itself opens in the fullscreen viewer, so this only holds its button. */
  .dev-mp{margin-top:-8px}
  .dev-feat{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);
    padding:18px;box-shadow:var(--shadow-sm)}
  .dev-feat img{width:100%;height:auto;display:block;border-radius:12px;
    background:var(--line-2);cursor:zoom-in}
  /* Card copy with a chevron that reveals the rest. */
  .feat-copy{margin-top:14px}
  .feat-copy__p{color:var(--ink-2);font-size:.92rem;line-height:1.65;margin:0}
  .feat-copy__list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  .feat-copy__li{display:flex;align-items:flex-start;gap:8px;font-size:.9rem;
    color:var(--ink);line-height:1.45}
  .feat-copy__li svg{width:16px;height:16px;color:var(--teal-600);flex:none;margin-top:3px}
  .feat-copy__more{margin-top:6px}
  .feat-copy__sum{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;
    color:var(--teal-600);font-weight:700;font-size:.86rem;padding:6px 0}
  .feat-copy__sum::-webkit-details-marker{display:none}
  .feat-copy__sum:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
  .feat-copy__p--lead{display:-webkit-box;-webkit-box-orient:vertical;
    -webkit-line-clamp:4;overflow:hidden}
  .feat-copy.is-open .feat-copy__p--lead{display:block;overflow:visible;-webkit-line-clamp:unset}
  .feat-copy__sum .accordion__chev{width:18px;height:18px}
  .feat-copy__more[open] .accordion__chev{transform:rotate(180deg)}
  .feat-copy__body{padding-top:2px}
  .feat-copy__body .feat-copy__p + .feat-copy__grp{margin-top:14px}
  .feat-copy__grp{margin-top:12px}
  .feat-copy__glabel{margin:0 0 4px;font-size:.7rem;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3)}
  .feat-copy__row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    font-size:.86rem;padding:5px 0;border-bottom:1px dotted var(--line-2)}
  .feat-copy__row:last-child{border-bottom:0}
  .feat-copy__row b{font-weight:700;color:var(--ink)}
  .feat-copy__row span{color:var(--ink-2);white-space:nowrap}
  .dev-feat__flip{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;
    background:var(--line-2);cursor:zoom-in}
  .dev-feat__flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0}
  .dev-feat__flip .gal-nav{width:34px;height:34px}
  .dev-feat__flip .gal-nav svg{width:19px;height:19px}
  .dev-feat__flip .gal-nav--prev{left:8px} .dev-feat__flip .gal-nav--next{right:8px}
  /* Destination photo above the developer lockup — one image, arrows flip the rest. */
  .dev-gal{position:relative;aspect-ratio:21/9;border-radius:var(--r-lg);overflow:hidden;
    margin:6px 0 22px;background:var(--line-2);box-shadow:var(--shadow-sm);cursor:zoom-in}
  .dev-gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  @media(max-width:760px){ .dev-gal{aspect-ratio:16/10} }
  /* Project-page wordmark lockup. */
  .proj-logo-wrap{display:inline-flex;margin-top:16px;padding:10px 16px;background:#fff;
    border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-sm)}
  .proj-logo{max-width:min(260px,68vw);max-height:60px;width:auto;height:auto;object-fit:contain;display:block}
  /* Logo + text developer line. */
  .card__dev--logo{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  /* Inline horizontal logo (natural aspect ratio, consistent height). */
  .dev-logo-inline{width:auto;max-width:150px;object-fit:contain;display:block;flex:none}
  /* Card-image corner — round white developer avatar (matches the rail). */
  .card__devcircle{position:absolute;inset-block-start:10px;inset-inline-start:10px;z-index:2;
    width:60px;height:60px;border-radius:50%;background:#fff;border:1px solid var(--line-2);
    box-shadow:0 2px 9px rgba(5,36,48,.30);display:grid;place-items:center;overflow:hidden}
  .card__devcircle .dev-logo--img{width:100%!important;height:100%!important;border-radius:50%;
    padding:13%;box-shadow:none;background:#fff}
  .card__devcircle .dev-logo{width:100%!important;height:100%!important;border-radius:50%!important}
  /* Developer-card white logo plate (consistent with the hero lockup). */
  .dev-card__logo{width:104px;height:60px;flex:none;display:grid;place-items:center;padding:9px;
    background:#fff;border:1px solid var(--line-2);border-radius:12px}
  .dev-card__logo img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
  .dev-card .meta h3{font-size:1.02rem}
  .dev-card .meta p{font-size:.8rem;color:var(--ink-3);margin-top:2px}

  /* ===================================================================
     FILTER BAR / TOOLBAR
     =================================================================== */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);
    border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-sm)}
  .toolbar .field{flex:1 1 160px;margin:0;min-width:0}
  .toolbar .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
  .toolbar select,.toolbar input{min-height:44px;padding:9px 12px}
  .result-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-block:20px 22px}
  .result-bar .count{font-weight:700}
  .active-filters{display:flex;flex-wrap:wrap;gap:6px}
  .filter-tag{display:inline-flex;align-items:center;gap:6px;background:var(--teal-050);color:var(--teal-700);
    border-radius:var(--r-pill);padding:5px 6px 5px 12px;font-size:.8rem;font-weight:600}
  .filter-tag button{border:none;background:rgba(7,61,82,.12);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;line-height:1;font-size:1rem;color:var(--teal-800);cursor:pointer}
  html[dir="rtl"] .filter-tag{padding:5px 12px 5px 6px}

  /* ---- Empty / states ---- */
  .state{text-align:center;padding:48px 20px;border:1px dashed var(--line-cool);border-radius:var(--r-lg);background:var(--paper)}
  .state svg{width:40px;height:40px;color:var(--teal-500);margin-bottom:12px}
  .state h3{font-size:1.2rem;margin-bottom:6px}
  .state p{color:var(--ink-2);max-width:44ch;margin-inline:auto}
  .skeleton{background:linear-gradient(90deg,var(--line-2) 25%,#f4efe4 37%,var(--line-2) 63%);
    background-size:400% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:var(--r-sm)}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

  /* ===================================================================
     DETAIL PAGES
     =================================================================== */
  .breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-3);margin-bottom:18px}
  .breadcrumb a:hover{color:var(--teal-700)}
  .breadcrumb .sep{opacity:.5}
  .detail-hero{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:start}
  @media(max-width:820px){.detail-hero{grid-template-columns:1fr}}
  .detail-media{aspect-ratio:16/10;border-radius:var(--r-lg);position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--teal-700),var(--teal-900))}
  .detail-media .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:3rem;color:rgba(243,239,230,.9)}
  .fact-table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
  .fact-table th,.fact-table td{text-align:start;padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:.92rem}
  .fact-table th{color:var(--ink-3);font-weight:600;width:42%}
  .fact-table td{font-weight:600}
  .fact-table tr:last-child th,.fact-table tr:last-child td{border-bottom:none}
  .aside-card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px;position:sticky;top:calc(var(--header-h) + 16px)}
  .price-lg{font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--teal-800)}

  /* Compact enquiry card. Two homes, one component: standing in the aside
     beside the price, and inverted inside the teal band at the foot of a page.
     Fields carry their label as a placeholder because the card has to stay
     short enough to sit in the column without pushing the price out of view. */
  /* Plans & maps grid. A floor plan is mostly white paper with thin lines, so
     the tile keeps a light backing in both themes and contains the whole sheet
     rather than cropping it — a cropped plan loses the very corner that carries
     the type name and the area. */
  .plan-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .plan-card{display:flex;flex-direction:column;gap:0;padding:0;text-align:start;
    background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);
    overflow:hidden;cursor:zoom-in;transition:border-color .18s,transform .18s}
  .plan-card:hover{border-color:var(--brand);transform:translateY(-2px)}
  .plan-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .plan-card__img{width:100%;aspect-ratio:3/2;object-fit:contain;background:#f6f4ef;display:block}
  .plan-card__cap{padding:10px 12px 12px;font-size:.78rem;line-height:1.45;color:var(--ink-2)}
  .ask-card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);
    padding:20px;margin-top:16px;position:relative}
  .ask-card__head{text-align:center;margin-bottom:14px}
  .ask-card__ic{display:inline-flex;align-items:center;justify-content:center;
    width:42px;height:42px;border-radius:50%;background:var(--teal-50,rgba(13,84,84,.08));
    color:var(--teal-700);margin-bottom:8px}
  .ask-card__ic svg{width:22px;height:22px}
  .ask-card__h{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:0 0 4px;color:var(--teal-900)}
  .ask-card__p{font-size:.85rem;color:var(--ink-2);margin:0;line-height:1.45}
  .ask-card .field{margin-bottom:10px}
  .ask-card input,.ask-card select,.ask-card textarea{width:100%}
  .ask-card textarea{resize:vertical;min-height:56px}
  .ask-card .field-err{color:var(--danger);font-size:.78rem;margin-top:4px}
  .ask-card__note{font-size:.85rem;margin-top:10px;line-height:1.45;text-align:center}
  .ask-card__note--ok{color:var(--teal-700);font-weight:600}
  .ask-card__note--warn{color:var(--danger)}

  /* Inside the teal band the card sits on dark ground: keep the panel light so
     the inputs stay legible, and cap the width so it reads as a form, not a
     wall. */
  .band-teal .ask-card{max-width:520px;margin-inline:auto;text-align:start}
  .band-teal .ask-card__h,.band-teal .ask-card__p{color:inherit}
  .band-teal .ask-card__h{color:var(--teal-900)}
  .band-teal .ask-card__p{color:var(--ink-2)}


  /* Compare table */
  .cmp-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--paper)}
  .cmp{border-collapse:collapse;width:100%;min-width:640px}
  .cmp th,.cmp td{padding:14px 16px;border-bottom:1px solid var(--line-2);text-align:start;font-size:.9rem;vertical-align:top}
  .cmp thead th{background:var(--teal-050);position:sticky;top:0}
  .cmp th[scope=row]{color:var(--ink-3);font-weight:600;background:var(--bone-2)}
  .cmp .diff{box-shadow:inset 3px 0 0 var(--teal-500)}
  html[dir="rtl"] .cmp .diff{box-shadow:inset -3px 0 0 var(--teal-500)}

  /* Accordion (FAQ) */
  .acc{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--paper);margin-bottom:10px}
  .acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:16px 18px;text-align:start;font-weight:600;font-size:1.02rem;background:none;border:none}
  .acc button:hover{background:var(--bone-2)}
  .acc .ico{flex:none;transition:transform var(--t);color:var(--teal-600)}
  .acc button[aria-expanded="true"] .ico{transform:rotate(45deg)}
  .acc .panel{padding:0 18px;max-height:0;overflow:hidden;transition:max-height var(--t);color:var(--ink-2)}
  .acc .panel > div{padding-bottom:18px}

  /* Notice / callout */
  .notice{display:flex;gap:12px;padding:16px 18px;border-radius:var(--r);border:1px solid;font-size:.9rem;align-items:flex-start}
  .notice svg{width:20px;height:20px;flex:none;margin-top:1px}
  .notice--info{background:var(--teal-050);border-color:#bfdae3;color:var(--teal-800)}
  .notice--warn{background:var(--warn-bg);border-color:#e6d4ab;color:var(--warn-ink)}
  .notice--ok{background:var(--ok-bg);border-color:#bfe0cd;color:var(--ok)}

  /* ---- Prose (about/legal/research) ---- */
  .prose{max-width:72ch}
  .prose h2{font-size:clamp(1.4rem,3vw,1.9rem);margin-top:36px;margin-bottom:12px}
  .prose h3{font-size:1.2rem;margin-top:26px;margin-bottom:8px}
  .prose p{margin-bottom:14px;color:var(--ink-2)}
  .prose ul{margin:0 0 16px;padding-inline-start:22px;color:var(--ink-2)}
  .prose li{margin-bottom:7px}
  .prose strong{color:var(--ink)}

  /* ===================================================================
     FOOTER
     =================================================================== */
  footer.site{background:var(--teal-900);color:#cfe0e5;margin-top:auto;padding-block:clamp(18px,2vw,24px) 16px}
  footer.site .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  @media(max-width:820px){footer.site .cols{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){footer.site .cols{grid-template-columns:1fr;gap:14px}}
  footer.site img.flogo{height:30px;width:auto}
  footer.site h4,footer.site .facc__head h2,footer.site .fbrand__social h3{color:var(--bone);font-family:var(--sans);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  /* The Village's own details: one full-width band under the link columns. */
  footer.site .fbrand{display:flex;align-items:center;flex-wrap:wrap;gap:14px clamp(20px,4vw,44px);
    margin-top:22px;padding-top:18px;border-top:1px solid rgba(243,239,230,.14)}
  footer.site .fbrand__contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;flex:1 1 auto}
  footer.site .fbrand__contact a{display:inline-flex;align-items:center;gap:8px;padding:0;font-size:.92rem;color:#cfe0e5}
  footer.site .fbrand__contact a:hover{color:#fff}
  footer.site .fbrand__contact a svg{width:16px;height:16px;flex:none;opacity:.72}
  footer.site .fbrand__contact a span{white-space:nowrap}
  footer.site .fbrand__social{display:flex;align-items:center;gap:14px;margin-inline-start:auto}
  footer.site .fbrand__social h4,footer.site .fbrand__social h3{margin-bottom:0;white-space:nowrap}
  footer.site .fbrand__social .social{margin-top:0}
  @media(max-width:560px){ footer.site .fbrand__social{margin-inline-start:0} }
  /* Footer accordions (mobile-first collapse; desktop opens by default; chevron toggles) */
  .facc__head{display:flex;align-items:center;justify-content:flex-start;gap:7px;width:100%;background:none;border:none;padding:0 0 4px;cursor:pointer;color:inherit;text-align:start;font:inherit}
  .facc__head h2{margin-bottom:0}
  .facc__chev{width:17px;height:17px;flex:none;color:rgba(243,239,230,.68);transition:transform .28s ease}
  .facc.is-open .facc__chev{transform:rotate(90deg)}
  html[dir="rtl"] .facc:not(.is-open) .facc__chev{transform:scaleX(-1)}
  .facc__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .facc.is-open .facc__body{grid-template-rows:1fr;margin-top:6px}
  .facc__inner{overflow:hidden}
  @media (prefers-reduced-motion:reduce){ .facc__chev,.facc__body{transition:none} }
  footer.site a{display:block;padding:3px 0;color:#b6ccd2;font-size:.88rem;transition:var(--t)}
  footer.site a:hover{color:#fff}
  footer.site .fbtm{margin-top:14px;padding-top:14px;border-top:1px solid rgba(243,239,230,.14);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:.8rem;color:#8fabb3}
  footer.site .disc{font-size:.74rem;line-height:1.5;color:#7e9aa2;max-width:none;margin-top:12px}
  footer.site .disc + .disc{margin-top:4px}

  /* ---- Mobile action bar (single fixed bottom layer) ---- */
  .mobile-bar{position:fixed;inset-block-end:0;inset-inline:0;z-index:90;display:none;gap:10px;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(250,247,240,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line-2)}
  @media(max-width:640px){.mobile-bar{display:flex}main{padding-bottom:76px}}

  /* ---- Dialog ---- */
  dialog.modal{border:none;border-radius:var(--r-lg);padding:0;max-width:min(94vw,520px);width:100%;
    box-shadow:var(--shadow-lg);color:var(--ink)}
  dialog.modal::backdrop{background:rgba(14,26,31,.55)}
  .modal-in{padding:24px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

  /* ---- Toast (honest, non-deceptive status) ---- */
  .toast-host{position:fixed;inset-block-end:20px;inset-inline:0;display:flex;justify-content:center;z-index:220;pointer-events:none;padding:0 14px}
  .toast{pointer-events:auto;background:var(--ink);color:var(--bone);padding:13px 18px;border-radius:var(--r);
    box-shadow:var(--shadow-lg);font-size:.9rem;max-width:440px;display:flex;gap:10px;align-items:flex-start;
    transform:translateY(20px);opacity:0;transition:var(--t)}
  .toast.show{transform:none;opacity:1}
  .toast svg{width:18px;height:18px;flex:none;margin-top:1px}
  @media(max-width:640px){.toast-host{inset-block-end:86px}}

  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .divider{height:1px;background:var(--line-2);border:none;margin-block:clamp(30px,5vw,52px)}
  .center{text-align:center}
  .mt-24{margin-top:24px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}
  .muted{color:var(--ink-3)}
  .band{background:var(--bone)}
  /* The CTA band runs straight into the footer, so the two read as one navy

  .ufeat__ic svg{width:18px;height:18px}

  /* Unit meta with icons — Location / Developer / Type */
  .umeta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  .umeta__item{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:.95rem;font-weight:600;text-decoration:none}
  a.umeta__item:hover{color:var(--teal-700)}
  a.umeta__item:hover span{text-decoration:underline}
  .umeta__ic{width:17px;height:17px;flex:none;color:var(--teal-600)}
  .umeta__ic svg{width:17px;height:17px}

  /* Amenities section */
  .amen-sec{padding:clamp(28px,5vw,52px) 0;background:var(--bone)}
  /* The amenities accordion sits on the section's own band, so it drops the
     rules the in-page Overview accordion needs to separate itself from body
     copy, and keeps the star + heading as one clickable row. */
  .amen-acc{margin:0;border-block:none}
  /* The shared accordion pushes its chevron to the far edge with
     space-between, which on a full-width band left the arrow marooned a metre
     from the words it belongs to. Here it sits right after the heading; the
     summary still spans the row, so the whole line stays clickable. */
  .accordion__sum.amen-sum{padding:0;justify-content:flex-start;gap:12px}
  .amen-acc .amen-head{margin-bottom:0}
  .amen-acc[open] .amen-head{margin-bottom:20px}
  .amen-acc .accordion__body{padding:0}
  .amen-head{display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .amen-head h2{font-size:clamp(1.3rem,2.6vw,1.7rem)}
  .amen-head__ic{width:26px;height:26px;color:var(--teal-600)}
  .amen-head__ic svg{width:26px;height:26px;fill:rgba(26,123,160,.14)}
  .amen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .amen{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);
    background:var(--paper);border:1px solid var(--line-2);box-shadow:var(--shadow-sm)}
  .amen__ic{display:inline-flex;width:40px;height:40px;flex:none;align-items:center;justify-content:center;
    border-radius:11px;background:var(--teal-050);color:var(--teal-600)}
  .amen__ic svg{width:22px;height:22px}
  .amen__lb{font-weight:600;font-size:.92rem;color:var(--ink)}
  /* Stacked variant — icon above its label, as a developer's own brochure sets
     out its services. Scoped to a modifier so unit pages keep the inline row. */
  /* auto-fit, not auto-fill: a brochure that names six categories should spread
     them across the row instead of leaving the empty tracks a fill would keep.
     Grids that already fill every column are unaffected. */
  .amen-grid.amen-grid--stack{grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
  .amen--stack{flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 12px;min-width:0}
  .amen--stack .amen__lb{overflow-wrap:break-word;hyphens:auto}
  .amen--stack .amen__ic{width:46px;height:46px;border-radius:50%}
  .amen--stack .amen__ic svg{width:24px;height:24px}
  .amen--stack .amen__lb{font-size:.82rem;line-height:1.3}
  @media(max-width:520px){
    .amen-grid.amen-grid--stack{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
    .amen--stack{padding:14px 8px}
    .amen--stack .amen__lb{font-size:.75rem}
  }
  .amen-note{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:.8rem;color:var(--ink-3)}
  .amen-note svg{width:16px;height:16px;flex:none}
  /* the finishing note runs to two lines — keep the icon on the first */
  .amen-note{align-items:flex-start}
  .amen-note svg{margin-top:2px}

  /* Fullscreen plan / media viewer (lightbox) */
  body.viewer-open{overflow:hidden}
  .viewer{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;
    background:rgba(4,26,34,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    animation:viewerIn .22s ease}
  @keyframes viewerIn{from{opacity:0}to{opacity:1}}
  .viewer__top{display:flex;align-items:center;gap:14px;padding:14px 18px;color:var(--bone);z-index:2}
  .viewer__title{font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer__count{margin-inline-start:auto;font-size:.85rem;color:#bcd0d6;font-variant-numeric:tabular-nums}
  .viewer__btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;
    border-radius:var(--r-pill);border:1px solid rgba(243,239,230,.24);background:rgba(243,239,230,.10);
    color:var(--bone);cursor:pointer;transition:var(--t)}
  .viewer__btn:hover{background:rgba(243,239,230,.22)}
  .viewer__btn:focus-visible{outline:2px solid #bfe3ef;outline-offset:2px}
  .viewer__btn svg{width:20px;height:20px}
  .viewer__stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  .viewer__img{max-width:94vw;max-height:100%;object-fit:contain;transition:transform .12s ease-out;will-change:transform;user-select:none;-webkit-user-drag:none}
  .viewer__nav{position:absolute;inset-block-start:50%;inset-inline:14px;transform:translateY(-50%);
    display:flex;justify-content:space-between;width:calc(100% - 28px);pointer-events:none;z-index:2}
  .viewer__nav .viewer__btn{pointer-events:auto}
  .viewer__foot{display:flex;align-items:center;gap:14px;padding:14px 18px;color:var(--bone);z-index:2}
  .viewer__cap{font-size:.86rem;color:#cfe0e5}
  .viewer__bar{margin-inline-start:auto;display:flex;gap:9px}
  @media (prefers-reduced-motion:reduce){ .viewer{animation:none} .viewer__img{transition:none} }
  @media (max-width:640px){ .viewer__img{max-width:100vw} .amen-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} }

  /* 3 · Home nav icon */
  .nav-home{display:inline-flex;align-items:center;gap:6px}
  .nav-home svg{width:18px;height:18px;transition:transform .2s ease}
  .nav-home:hover svg{transform:translateY(-2px) scale(1.06)}
  .nav-home.is-active{color:var(--teal-700)}
  .nav-home.is-active svg{color:var(--teal-600)}
  .nav-home--drawer svg{width:20px;height:20px}
  /* Icon'd nav items (Search / New launches / About / Favorites / Compare) — like Home */
  .nav-links a.nav-item{display:inline-flex;align-items:center;gap:6px}
  .nav-item__ic{width:17px;height:17px;flex:none}
  .nav-item__ic svg{width:17px;height:17px;transition:transform .2s ease}
  .nav-links a.nav-item:hover .nav-item__ic svg{transform:translateY(-2px) scale(1.06)}
  .drawer nav a.nav-item{display:flex;align-items:center;gap:11px}
  .drawer nav a.nav-item .nav-item__ic{width:20px;height:20px}
  .drawer nav a.nav-item .nav-item__ic svg{width:20px;height:20px}
  /* At medium widths the desktop nav gets crowded → show icons only (labels via title) */
  @media(max-width:1180px){
    .nav-links .nav-item__lbl,.nav-links .nav-home__lbl{display:none}
    .nav-links a{padding:9px 10px}
  }
  /* 6 · Overview accordion (native <details>, collapsed by default) */
  .accordion{margin:24px 0 4px;border-block:1px solid var(--line-2)}
  .accordion__sum{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:14px 2px;user-select:none}
  .accordion__sum::-webkit-details-marker{display:none}
  .accordion__sum:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
  .accordion__title{font-size:1.3rem;margin:0;line-height:1.2}
  .accordion__chev{width:22px;height:22px;flex:none;color:var(--teal-600);transition:transform .25s ease}
  .accordion[open] .accordion__chev{transform:rotate(180deg)}
  .accordion__body{padding:0 2px 16px;overflow:hidden}
  .accordion[open] .accordion__body{animation:accOpen .28s ease}
  @keyframes accOpen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  /* 2 · animated search palette (smooth open, clean box) */
  .pal-back{display:flex!important;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .22s ease,visibility .22s ease}
  .pal-back.open{opacity:1;visibility:visible;pointer-events:auto}
  .pal{transform:translateY(-14px) scale(.975);opacity:0;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .22s ease}
  .pal-back.open .pal{transform:none;opacity:1}
  /* The rail is driven frame by frame from JS, so smooth-scroll must stay off —
     it would animate every 0.45px step and the drift would never advance. */
  .dev-rail{scroll-behavior:auto}
  @media (prefers-reduced-motion:reduce){
    .pal,.pal-back,.accordion__chev,.accordion[open] .accordion__body,.nav-home svg{transition:none;animation:none}
  }
  </style>
</head>
