  <style>
__FONTFACE__
  /* ===================================================================
     The dashboard wears the same clothes as the site: the teal/ink/bone
     tokens come from the master logo, so an editor never feels like they
     have left the product. Layout is different because the job is — a
     working surface, not a showroom.
     =================================================================== */
  :root{
    --teal-900:#052e3d; --teal-800:#073D52; --teal-700:#0b4a63;
    --teal-600:#115F7D; --teal-500:#1a7ba0; --teal-400:#3fa3c4; --teal-050:#e7f0f3;
    --ink:#0e1a1f; --ink-2:#3c525b; --ink-3:#526a71;
    --bone:#F3EFE6; --bone-2:#faf7f0; --paper:#ffffff;
    --line:#e5ddcf; --line-2:#efe9dd; --line-cool:#dfe6e8;
    --ok:#1f7a54; --ok-bg:#e6f3ec; --warn-ink:#8a5a12; --warn-bg:#f6edda;
    --danger:#b23a2e; --danger-bg:#fbecea;
    --focus:#0b4a63;
    --shadow-sm:0 1px 2px rgba(7,61,82,.06),0 1px 3px rgba(7,61,82,.05);
    --shadow-md:0 6px 18px -6px rgba(7,61,82,.18),0 2px 6px rgba(7,61,82,.06);
    --shadow-lg:0 24px 48px -18px rgba(7,61,82,.30);
    --r-sm:8px; --r:14px; --r-lg:20px; --r-pill:999px;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Fraunces",Georgia,"Iowan Old Style","Times New Roman",serif;
    --arab:"Tajawal","Segoe UI",Tahoma,Arial,system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --t:180ms cubic-bezier(.2,.6,.2,1);
    --rail:248px; --topbar:60px;
  }
  html[dir="rtl"]{ --sans:var(--arab); --serif:var(--arab); }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bone-2);
    line-height:1.55;font-size:15.5px;-webkit-font-smoothing:antialiased;min-height:100vh}
  img{max-width:100%;display:block;height:auto}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{letter-spacing:0}
  p{margin:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
  [hidden]{display:none!important}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---- Sign in ------------------------------------------------------ */
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1200px 600px at 50% -10%,var(--teal-050),var(--bone-2))}
  .gate__card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line-2);
    border-radius:var(--r-lg);padding:clamp(24px,5vw,36px);box-shadow:var(--shadow-lg)}
  .gate__mark{width:52px;height:52px;border-radius:14px;background:var(--teal-800);
    display:grid;place-items:center;margin-bottom:18px}
  .gate__mark svg{width:26px;height:26px;color:var(--bone)}
  .gate h1{font-size:1.5rem;margin-bottom:6px}
  .gate__sub{color:var(--ink-2);font-size:.92rem;margin-bottom:22px}
  .gate form{display:grid;gap:14px}
  .gate__alt{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .gate__alt button{background:none;border:0;color:var(--teal-700);font-weight:600;
    font-size:.86rem;padding:4px;text-decoration:underline;text-underline-offset:3px}

  /* ---- Fields ------------------------------------------------------- */
  .f{display:grid;gap:6px}
  .f>label{font-weight:600;font-size:.82rem;color:var(--ink-2)}
  .f__hint{font-size:.78rem;color:var(--ink-3)}
  .f__err{font-size:.78rem;color:var(--danger);font-weight:600}
  input[type=text],input[type=email],input[type=password],input[type=number],
  input[type=search],input[type=url],select,textarea{
    width:100%;padding:.62em .8em;border:1.5px solid var(--line-cool);border-radius:var(--r-sm);
    background:var(--paper);transition:var(--t);min-height:42px}
  textarea{min-height:96px;resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus{border-color:var(--teal-600);outline:0;
    box-shadow:0 0 0 3px rgba(17,95,125,.14)}
  input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger)}
  input:disabled,select:disabled,textarea:disabled{background:var(--bone-2);color:var(--ink-3)}
  .f--ar input,.f--ar textarea{direction:rtl;text-align:right;font-family:var(--arab)}
  .row{display:grid;gap:14px}
  @media (min-width:720px){ .row--2{grid-template-columns:1fr 1fr} .row--3{grid-template-columns:repeat(3,1fr)} }

  /* ---- Buttons ------------------------------------------------------ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    padding:.6em 1.1em;border-radius:var(--r-pill);border:1.5px solid transparent;
    font-weight:600;font-size:.9rem;transition:var(--t);min-height:42px;white-space:nowrap;line-height:1}
  .btn svg{width:1.05em;height:1.05em;flex:none}
  .btn--primary{background:var(--teal-800);color:var(--bone)}
  .btn--primary:hover:not(:disabled){background:var(--teal-700);box-shadow:var(--shadow-md)}
  .btn--ghost{background:transparent;border-color:var(--line-cool)}
  .btn--ghost:hover:not(:disabled){border-color:var(--teal-600);color:var(--teal-700);background:var(--teal-050)}
  .btn--danger{background:var(--danger-bg);color:var(--danger);border-color:#f0cfca}
  .btn--danger:hover:not(:disabled){background:var(--danger);color:#fff}
  .btn--sm{padding:.42em .8em;min-height:34px;font-size:.82rem}
  .btn--full{width:100%}
  .btn:disabled{opacity:.55;cursor:not-allowed}

  /* ---- App frame ---------------------------------------------------- */
  .app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
  .rail{background:var(--teal-900);color:var(--bone);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto}
  .rail__brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;
    border-bottom:1px solid rgba(243,239,230,.12)}
  .rail__brand img{width:34px;height:34px;border-radius:9px}
  .rail__brand b{font-family:var(--serif);font-size:.98rem;font-weight:700;line-height:1.2}
  .rail__brand span{display:block;font-family:var(--sans);font-size:.7rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--teal-400);margin-top:2px}
  html[dir="rtl"] .rail__brand span{letter-spacing:.04em}
  .rail nav{padding:12px 10px;display:grid;gap:2px;flex:1}
  .rail__group{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(243,239,230,.42);padding:14px 10px 6px}
  html[dir="rtl"] .rail__group{letter-spacing:.04em}
  .rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
    font-size:.9rem;font-weight:500;color:rgba(243,239,230,.82);transition:var(--t)}
  .rail a svg{width:17px;height:17px;flex:none;opacity:.75}
  .rail a:hover{background:rgba(243,239,230,.08);color:var(--bone)}
  .rail a[aria-current="page"]{background:var(--teal-700);color:#fff;font-weight:600}
  .rail a[aria-current="page"] svg{opacity:1}
  .rail__foot{padding:12px;border-top:1px solid rgba(243,239,230,.12);font-size:.8rem}
  .rail__who{color:rgba(243,239,230,.7);margin-bottom:8px;word-break:break-all}
  .rail__who b{display:block;color:var(--bone);font-weight:600}
  .rail__acts{display:flex;gap:6px}
  .rail__acts button{flex:1;background:rgba(243,239,230,.1);border:0;color:var(--bone);
    padding:7px;border-radius:var(--r-sm);font-size:.78rem;font-weight:600;transition:var(--t)}
  .rail__acts button:hover{background:rgba(243,239,230,.2)}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{height:var(--topbar);display:flex;align-items:center;gap:12px;padding:0 clamp(14px,3vw,26px);
    background:var(--paper);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:20}
  .topbar h1{font-size:1.12rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .burger{display:none;background:none;border:0;padding:6px;border-radius:var(--r-sm)}
  .burger svg{width:22px;height:22px}
  .content{padding:clamp(16px,3vw,28px);flex:1;min-width:0}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;inset-inline-start:0;top:0;width:min(84vw,var(--rail));z-index:60;
      transform:translateX(-100%);transition:transform var(--t)}
    html[dir="rtl"] .rail{transform:translateX(100%)}
    .rail[data-open="1"]{transform:none;box-shadow:var(--shadow-lg)}
    .burger{display:grid;place-items:center}
    .scrim{position:fixed;inset:0;background:rgba(5,46,61,.45);z-index:50}
  }

  /* ---- Cards, tables, chips ----------------------------------------- */
  .card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);
    box-shadow:var(--shadow-sm)}
  .card__head{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;
    align-items:center;gap:10px;flex-wrap:wrap}
  .card__head h2{font-size:1rem;flex:1;min-width:0}
  .card__body{padding:16px}
  .stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));margin-bottom:20px}
  .stat{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px}
  .stat b{display:block;font-family:var(--serif);font-size:1.75rem;font-weight:700;line-height:1.1}
  .stat span{font-size:.78rem;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  html[dir="rtl"] .stat span{letter-spacing:0;text-transform:none}

  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line-2);vertical-align:middle}
  th{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
    background:var(--bone-2);position:sticky;top:0;white-space:nowrap}
  html[dir="rtl"] th{letter-spacing:0;text-transform:none;font-size:.8rem}
  tbody tr:hover{background:var(--teal-050)}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  td.act{text-align:end;white-space:nowrap}
  .thumb{width:44px;height:32px;object-fit:cover;border-radius:5px;background:var(--bone);flex:none}

  .chip{display:inline-flex;align-items:center;gap:.35em;padding:.2em .6em;border-radius:var(--r-pill);
    font-size:.74rem;font-weight:700;letter-spacing:.02em;background:var(--bone);color:var(--ink-2)}
  .chip--ok{background:var(--ok-bg);color:var(--ok)}
  .chip--warn{background:var(--warn-bg);color:var(--warn-ink)}
  .chip--danger{background:var(--danger-bg);color:var(--danger)}
  .chip--teal{background:var(--teal-050);color:var(--teal-700)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{flex:1;min-width:180px;max-width:340px}
  .toolbar select{width:auto;min-width:130px}
  .spacer{flex:1}

  .empty{padding:44px 16px;text-align:center;color:var(--ink-3)}
  .empty svg{width:34px;height:34px;margin:0 auto 10px;opacity:.4}

  .pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px}
  .pager span{font-size:.82rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* ---- Drawer (edit) ------------------------------------------------ */
  .drawer{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end}
  html[dir="rtl"] .drawer{justify-content:flex-start}
  .drawer__scrim{position:absolute;inset:0;background:rgba(5,46,61,.42)}
  .drawer__panel{position:relative;background:var(--paper);width:min(560px,100%);height:100%;
    display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .drawer__head{padding:16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
  .drawer__head h2{font-size:1.05rem;flex:1}
  .drawer__body{padding:16px;overflow-y:auto;flex:1;display:grid;gap:16px;align-content:start}
  .drawer__foot{padding:14px 16px;border-top:1px solid var(--line-2);display:flex;gap:10px;
    align-items:center;background:var(--bone-2)}
  .iconbtn{background:none;border:0;padding:7px;border-radius:var(--r-sm);display:grid;place-items:center}
  .iconbtn:hover{background:var(--bone)}
  .iconbtn svg{width:18px;height:18px}

  fieldset{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:14px;margin:0;display:grid;gap:14px}
  legend{font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--teal-600);padding:0 6px}
  html[dir="rtl"] legend{letter-spacing:0;text-transform:none;font-size:.84rem}

  /* ---- Toast -------------------------------------------------------- */
  .toasts{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:100;display:grid;gap:8px;
    max-width:min(400px,90vw)}
  .toast{background:var(--teal-900);color:var(--bone);padding:11px 15px;border-radius:var(--r-sm);
    box-shadow:var(--shadow-lg);font-size:.88rem;display:flex;gap:9px;align-items:flex-start}
  .toast svg{width:17px;height:17px;flex:none;margin-top:1px}
  .toast--ok{background:var(--ok)}
  .toast--err{background:var(--danger)}

  /* ---- Import preview ----------------------------------------------- */
  .diff{font-variant-numeric:tabular-nums}
  .diff del{color:var(--ink-3);text-decoration:line-through;margin-inline-end:.4em}
  .diff ins{color:var(--ok);text-decoration:none;font-weight:700}
  .drop{border:2px dashed var(--line-cool);border-radius:var(--r);padding:32px 18px;text-align:center;
    transition:var(--t);background:var(--bone-2)}
  .drop[data-over="1"]{border-color:var(--teal-600);background:var(--teal-050)}
  .drop svg{width:32px;height:32px;margin:0 auto 10px;opacity:.5}

  .note{padding:11px 14px;border-radius:var(--r-sm);font-size:.85rem;display:flex;gap:9px;align-items:flex-start}
  .note svg{width:17px;height:17px;flex:none;margin-top:1px}
  .note--warn{background:var(--warn-bg);color:var(--warn-ink)}
  .note--err{background:var(--danger-bg);color:var(--danger)}
  .note--ok{background:var(--ok-bg);color:var(--ok)}
  .note--info{background:var(--teal-050);color:var(--teal-700)}

  .skel{background:linear-gradient(90deg,var(--line-2),var(--bone-2),var(--line-2));
    background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-sm);height:14px}
  @keyframes sk{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
  </style>
