  function safeUrl(u) {
    if (u == null) return false;
    var s = String(u).trim();
    if (!s) return false;
    if (/^(https?:|mailto:|tel:|\/|#|\.\/|\.\.\/)/i.test(s)) return true;
    return !/:/.test(s.split(/[?#]/)[0]);

  function h(tag, props) {
    var e = document.createElement(tag), i, k;
    if (props) for (k in props) {
      if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
      var v = props[k];
      if (k === 'class') { if (v) e.className = v; }
      else if (k === 'text') e.textContent = v == null ? '' : String(v);
      else if (k === 'html') { /* deliberately unsupported: no raw HTML sink */ }
      else if (k === 'dataset') { for (var d in v) e.dataset[d] = v[d]; }
      else if (k === 'value') e.value = v == null ? '' : String(v);
      else if (k.slice(0, 2) === 'on') { if (typeof v === 'function') e.addEventListener(k.slice(2), v); }
      else if ((k === 'href' || k === 'src') && !safeUrl(v)) { /* dropped */ }
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }

  function append(parent, child) {
    if (child == null || child === false || child === '') return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(parent, c); }); return; }
    if (child.nodeType) { parent.appendChild(child); return; }
    parent.appendChild(document.createTextNode(String(child)));
  }

  function setLang(l) {
    lang = l === 'ar' ? 'ar' : 'en';
    try { localStorage.setItem('tvi_admin_lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.setAttribute('data-lang', lang);
  }
  function isAr() { return lang === 'ar'; }

  /* ------------------------------------------------------- formatting */
  var AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  function num(v) {
    if (v == null || v === '') return '—';
    var s = String(Math.round(Number(v) * 100) / 100).replace(/\B(?=(\d{3})+(?!\d))/, '');
    s = Number(v).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US');
    return s;
  }
  function money(v) {
    if (v == null || v === '') return '—';
    var n = Number(v);
    return lang === 'ar' ? num(n) + ' ج.م' : 'EGP ' + num(n);
  }
  function dateFmt(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-GB',
      { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function slugify(s) {
    return String(s || '').toLowerCase().trim()
      .replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  /* ------------------------------------------------------------ toast */
  function toast(msg, kind) {
    var host = document.getElementById('toasts');
    if (!host) return;
    var el = h('div', { class: 'toast' + (kind ? ' toast--' + kind : '') },
      ic(kind === 'err' ? 'alert' : kind === 'ok' ? 'check' : 'info'),
      h('span', { text: msg }));
    host.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
  }
