# Cloudflare Workers deployment for The Village — a single-file static site.
# The dashboard build runs `npx wrangler deploy`, which needs this config.
# `name` MUST match the existing Worker that serves village.belalatiah.workers.dev.
name = "village"
compatibility_date = "2025-06-01"

# Serve the repo as static assets (no Worker script needed). Unknown paths fall
# back to index.html so the client-side /en/ and /ar/ History-API routes resolve.
[assets]
directory = "."
not_found_handling = "single-page-application"
