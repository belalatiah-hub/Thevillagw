  /* ── stylized map (self-drawn, no external tiles) ── */
  function mapSVG(h){
    // Deterministic (stable across re-renders) stylized masterplan that fills
    // the full height. Real satellite tiles need a network request the artifact
    // CSP blocks, so we evoke the look with compound blocks + a road grid.
    var seed = 7; function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
    var greens=['#8fae74','#94b079','#9bb47f','#7fa068'], tans=['#c9bd93','#c3b78c','#b9ad84','#cabf98'];
    var s='<svg viewBox="0 0 100 '+h+'" preserveAspectRatio="xMidYMid slice"><rect width="100" height="'+h+'" fill="#cdbf9a"/>';
    for(var y=4; y<h-6; y+=22){
      for(var x=4; x<95; x+=30){
        var w=20+Math.floor(rnd()*8), hh=13+Math.floor(rnd()*8);
        var col = rnd()>0.48 ? greens[Math.floor(rnd()*greens.length)] : tans[Math.floor(rnd()*tans.length)];
        s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="2" fill="'+col+'" opacity=".92"/>';
        for(var d=0; d<5; d++){ s+='<rect x="'+(x+2+rnd()*(w-3)).toFixed(1)+'" y="'+(y+2+rnd()*(hh-3)).toFixed(1)+'" width="2.1" height="2.1" fill="#5f7d4e" opacity=".45"/>'; }
      }
    }
    s+='<g stroke="#efe9d6" stroke-width="1.4" fill="none" opacity=".85">';
    for(var gy=26; gy<h; gy+=26){ s+='<path d="M0 '+gy+'h100"/>'; }
    s+='<path d="M32 0v'+h+'M66 0v'+h+'"/></g>';
    s+='<g stroke="#e2c98f" stroke-width="2.4" fill="none" opacity=".6"><path d="M0 '+(h*0.4).toFixed(0)+'c30 6 60-6 100 2"/></g></svg>';
    return s;
  }

    if(r.cond.temperature) bits.push(r.cond.temperature.join(" / "));

    return bits.join(" · ")||t("every_lead");
  }

    if(!list.length){
      var empty=el("div","card"); empty.style.cssText="padding:34px 18px;text-align:center;margin-top:14px";
      empty.innerHTML='<div style="width:54px;height:54px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)">'+I.check+'</div><div style="font-weight:800;font-size:16px">'+t("all_read")+'</div>';
      c.appendChild(empty);
    }
    list.forEach(function(n){ c.appendChild(notifCard(n)); });

    setTimeout(function(){
      var bk=$("#nBack"); if(bk) bk.onclick=function(){ go("dashboard"); };
      var all=$("#nAll"); if(all) all.onclick=function(){ notifs.forEach(function(n){n.read=true;}); toast(S.lang==="ar"?"تم تعليم الكل كمقروء":"All marked read"); render(); };
    },0);
    return c;
  }
  function notifCard(n){
    var col=NT_COLOR[n.type]||"var(--purple)", ic=I[NT_ICON[n.type]||"bolt"];
    var urgent=n.pri==="URGENT";
    var card=el("div","card"); card.style.cssText="padding:14px 15px;margin-bottom:10px;position:relative;cursor:pointer"+(n.read?"":";box-shadow:inset 0 0 0 1.5px var(--purple-soft),var(--shadow-s,0 1px 3px rgba(0,0,0,.05))");
    card.innerHTML=
      '<div class="row" style="gap:12px;align-items:flex-start">'+
        '<div class="av" style="width:42px;height:42px;border-radius:12px;flex:none;background:'+col+'1f;color:'+col+'">'+ic+'</div>'+
        '<div class="grow" style="min-width:0">'+
          '<div class="row between" style="gap:8px"><span class="muted" style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:'+col+'">'+t("nt_"+n.type)+(urgent?' · !':'')+'</span>'+
            '<span class="muted" style="font-size:11.5px;flex:none">'+whenLabel(n.when)+'</span></div>'+
          '<div style="font-weight:'+(n.read?"600":"800")+';font-size:14.5px;margin-top:3px;line-height:1.35">'+n.title+'</div>'+
          (n.body? '<div class="muted" style="font-size:12.5px;margin-top:3px;line-height:1.4">'+n.body+'</div>':'')+
        '</div>'+
        (n.read?'':'<span style="flex:none;width:9px;height:9px;border-radius:50%;background:var(--coral);margin-top:5px"></span>')+
      '</div>';
    card.onclick=function(){ if(!n.read){ n.read=true; render(); } };
    return card;
  }

  /* ── overlays ── */
  function openLead(l){
    var sc=SRC[l.src]||{t:l.src}, prob=l.score;
    var tl=[["Lead captured from "+sc.t,"3 days ago"],["Assigned to "+l.agent,"Apr 8"],["Call attempt — no answer","2 days ago"],["WhatsApp sent — payment plan","Yesterday"]];
    sheet(
      '<div class="row" style="gap:13px;margin-top:4px"><div class="av" style="background:'+(agents[l.first]||'#7c6fd6')+'">'+l.first+'</div>'+
        '<div class="grow"><div class="nm" style="font-size:19px;font-weight:800">'+l.n+'</div><div class="role muted">'+l.role+'</div></div>'+
        '<span class="status '+(STATUS[l.status]||"st-dark")+'">'+t(l.status)+'</span></div>'+
      '<div class="row" style="gap:10px;margin:16px 0"><button class="act grow call" style="background:var(--purple);color:#fff;box-shadow:none">'+I.phone+t("call")+'</button>'+
        '<button class="act grow" style="background:var(--green-soft);color:var(--green);box-shadow:none">'+I.wa+'WhatsApp</button></div>'+
      '<div class="card" style="padding:14px 16px;background:var(--purple-soft);box-shadow:none;margin-bottom:8px"><div class="row" style="gap:8px"><span style="color:var(--purple)">'+I.brain+'</span><b style="font-size:14px">'+t("next_action")+'</b></div>'+
        '<div style="font-size:14px;margin-top:6px;line-height:1.5">'+(prob>=75?'High intent — call within the hour and offer a site visit at '+l.project+' this week.':'Send a tailored WhatsApp with 2–3 units in '+l.area+', then follow up by call in 24h.')+'</div>'+
        '<div class="row between" style="margin-top:10px"><span class="muted" style="font-size:12.5px;font-weight:700">'+t("win_prob")+'</span><b class="tnum">'+prob+'%</b></div></div>'+
      '<div class="field"><div class="k">'+t("assigned")+'</div><div class="val">'+l.agent+' · '+l.assigned+'</div></div>'+
      '<div class="field"><div class="k">Project · Budget · Beds</div><div class="val">'+l.project+' · EGP '+l.budget+'M · '+l.beds+'</div></div>'+
      '<div style="font-weight:800;font-size:15px;margin:16px 0 8px">'+t("timeline")+'</div><div class="tl">'+
        tl.map(function(x){return '<div class="tl-i"><div class="t">'+x[0]+'</div><div class="d">'+x[1]+'</div></div>';}).join("")+'</div>'
    );
  }
  function openProject(p){
    sheet(
      '<div class="row between" style="margin-top:4px"><div><div style="font-size:20px;font-weight:800">'+p.name+'</div><div class="muted">'+p.dev+' · '+p.area+'</div></div>'+
        '<span class="pill" style="background:var(--green-soft);color:var(--green)"><span class="dot" style="background:var(--green)"></span>'+p.avail+' '+t("available")+'</span></div>'+
      '<div class="mapwrap" style="height:150px;margin:16px 0">'+mapSVG(56)+'</div>'+
      '<div class="row" style="gap:14px"><div class="card kpi grow"><div class="l">'+t("from")+'</div><div class="v tnum">EGP '+p.from+'M</div></div>'+
        '<div class="card kpi grow"><div class="l">'+t("beds")+'</div><div class="v">'+p.beds+'</div></div></div>'+
      '<button class="btn-coral" style="width:100%;justify-content:center;margin-top:16px">'+t("find_leads")+' · '+p.name+'</button>'
    );
  }
  function sheet(html){ $("#sheetBody").innerHTML=html; $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); }
  function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); $("#menu").classList.remove("open"); }

  function openAI(){
    var b=roleBrief(S.role);
    var msgs=[{b:1,t:t("ai_hi")+"<br><br><b>"+b.head+"</b>"}];
    var SUGG={
      "Sales Manager":["Team forecast this month","Which agents are behind target?","Who has stale deals?"],
      "Finance":["Commission pending approval","Collections due this month","Won deals this month"],
      "Marketing":["Best lead source by quality","What's my CPL and ROAS?","Which campaign should I scale?"],
      "CEO":["Give me the executive brief","Revenue forecast","Top project and agent"],
      "Sales Agent":["Recommend a 3-bed under EGP 8M in New Cairo","Summarize Ashraf Hussein","Draft a WhatsApp follow-up"]
    };
    var sugg=SUGG[S.role]||SUGG["Sales Agent"];
    render();
    function render(){
      var html=msgs.map(function(m){return '<div class="ai-msg '+(m.b?'ai-bot':'ai-me')+'">'+m.t+'</div>';}).join("")+
        '<div class="ai-suggest">'+sugg.map(function(s){return '<button class="ai-s" data-q="'+s+'">'+s+'</button>';}).join("")+'</div>';
      $("#sheetBody").innerHTML='<div class="row between" style="margin:2px 0 12px"><div class="row" style="gap:10px">'+villageLogo(26)+'<b style="font-size:17px">'+t("ai_title")+'</b></div></div>'+
        '<div id="aiScroll">'+html+'</div>';
      [].forEach.call(document.querySelectorAll(".ai-s"),function(b){ b.onclick=function(){ ask(b.getAttribute("data-q")); }; });
      var as=$("#aiScroll"); if(as) as.scrollTop=as.scrollHeight;
    }
    function ask(q){
      msgs.push({b:0,t:q});
      var a;
      if(/summar/i.test(q)) a="<b>Ashraf Hussein</b> — hot lead (score 88) from Facebook, interested in IL Bosco City, budget ~EGP 12M, 4 beds. Assigned to Fatma Sayed. Last touch: WhatsApp payment plan. <b>Next:</b> call today and book a site visit.";
      else if(/whatsapp|follow/i.test(q)) a="Draft: “Hi Ashraf 👋 following up on IL Bosco City — I’ve reserved a 4-bed with a 10% down / 8-yr plan that fits your budget. Free for a quick visit this week? — Fatma, Village CRM.”";
      else if(/recommend|3-bed|new cairo|8m/i.test(q)) a="Top matches under EGP 8M · New Cairo area:<br>• <b>IL Bosco City</b> BOSCO-A12 — 3BR, 165 m² — EGP 7.4M<br>• <b>Scenes</b> SCENES-A9 — 2BR, 118 m² — EGP 5.9M<br>• <b>Bloomfields</b> — from EGP 5.4M. Want me to draft an offer?";
      else if(/forecast/i.test(q)) a="Weighted forecast is <b>EGP 2.8M</b> from <b>EGP 6.0M</b> open pipeline (7 deals). Reservation-stage deals carry 75% probability — 2 are stalled >3 days and are dragging the number down.";
      else if(/behind target|agents are behind/i.test(q)) a="Behind target this month: <b>Omar Khaled</b> (62%) and <b>Nour Hany</b> (58%). Both have healthy lead volume but low call activity — coach on speed-to-lead.";
      else if(/stale/i.test(q)) a="Stale deals (no activity 3+ days): <b>Khaled Nabil — HAPTOWN</b> and <b>Sara Kamal — Aliva</b>. I can nudge their owners now.";
      else if(/commission pending|pending approval/i.test(q)) a="Pending commission awaiting approval: <b>EGP 184K</b> (Khaled Nabil — HAPTOWN). Approve in the Commission screen; Finance then releases payout.";
      else if(/collection/i.test(q)) a="Collections due this month: <b>EGP 1.2M</b> across 3 contracts. One installment (BOSCO-A12) is 4 days overdue — flag the customer.";
      else if(/won deals/i.test(q)) a="Won this month: <b>EGP 0.9M</b> (2 contracts). Both fully collected; commission accrued.";
      else if(/cpl|roas/i.test(q)) a="This month: <b>CPL EGP 180</b>, blended <b>ROAS 4.2×</b>. Facebook has the best cost-per-qualified-lead; TikTok CPL is low but lead→meeting is weak.";
      else if(/lead source|source by quality/i.test(q)) a="By quality (lead→meeting): <b>Referral</b> 34%, <b>Property Finder</b> 21%, <b>Facebook</b> 14%. Facebook wins on volume; Referral wins on quality — grow referrals.";
      else if(/campaign|scale/i.test(q)) a="Scale the <b>Facebook — New Cairo 3BR</b> campaign: lowest cost-per-qualified-lead and 3 hot leads this week. Pause the TikTok awareness set (high CPL, weak conversion).";
      else if(/executive brief|exec/i.test(q)) a="<b>Executive brief:</b> EGP 0.9M won MTD, EGP 2.8M weighted forecast, 6 new leads today. Facebook is the top source, IL Bosco City the top project, Fatma the top agent. Risk: 2 stalled reservation-stage deals.";
      else if(/revenue/i.test(q)) a="Revenue MTD <b>EGP 0.9M</b>; weighted forecast <b>EGP 2.8M</b>. On current velocity you'll land ~EGP 1.6M by month-end — 89% of target.";
      else if(/top project|top agent/i.test(q)) a="Top project: <b>IL Bosco City</b> (14 units, best conversion). Top agent: <b>Fatma Sayed</b> (EGP 6.8M). Best source: <b>Facebook</b>.";
      else a="I checked your CRM — 6 new leads today, 2 follow-ups overdue, and IL Bosco City has 14 available units matching your hot leads. Want the follow-up list?";
      setTimeout(function(){ msgs.push({b:1,t:a}); render(); },260);
      render();
    }
    $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
  }

  function openMenu(){
    var mods=[["notifications",I.bell],["commission",I.money],["reports",I.chart],["automation",I.flow],["integrations",I.bolt],["hr",I.users2],["marketing",I.mega],["settings",I.gear]];
    var roleName = S.lang==="ar" ? (ROLES_AR[S.role]||S.role) : S.role;
    $("#menu").innerHTML=
      '<button class="hd" id="mRole" style="text-align:start;width:100%;cursor:pointer"><div class="row" style="gap:12px"><div class="av" style="background:linear-gradient(135deg,var(--coral),var(--coral-2))">A</div>'+
        '<div><div style="font-weight:800;font-size:17px">Ahmed Mostafa</div><div style="opacity:.85;font-size:13px">'+roleName+' · '+t("switch_role")+'</div></div></div></button>'+
      mods.map(function(m){return '<button class="mi" data-m="'+m[0]+'">'+m[1]+'<span>'+t(m[0])+'</span></button>';}).join("")+
      '<div style="flex:1"></div>'+
      '<button class="mi" id="mLang">'+I.globe+'<span data-en>العربية</span><span data-ar>English</span></button>'+
      '<button class="mi" id="mTheme">'+I.moon+'<span>Theme</span></button>'+
      '<button class="mi danger" style="margin-bottom:16px">'+I.out+'<span>'+t("logout")+'</span></button>';
    $("#scrim").classList.add("open"); $("#menu").classList.add("open");
    var routable={ commission:1, reports:1, integrations:1, automation:1, notifications:1 };
    [].forEach.call(document.querySelectorAll("#menu .mi[data-m]"),function(b){ b.onclick=function(){ var m=b.getAttribute("data-m"); closeSheet(); if(routable[m]){ go(m); } else { toast(t(m)+" — "+(S.lang==="ar"?"قريباً":"coming soon")); } }; });
    $("#mRole").onclick=function(){ var i=ROLES.indexOf(S.role); S.role=ROLES[(i+1)%ROLES.length]; openMenu(); if(S.view==="commission") render(); };
    $("#mLang").onclick=function(){ S.lang=S.lang==="en"?"ar":"en"; applyDir(); closeSheet(); render(); };
    $("#mTheme").onclick=toggleTheme;
  }

  function toggleTheme(){ var r=document.documentElement, cur=r.getAttribute("data-theme"); if(!cur) cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; r.setAttribute("data-theme",cur==="dark"?"light":"dark"); }
  function applyDir(){ document.documentElement.dir=S.lang==="ar"?"rtl":"ltr"; document.body.className=S.lang==="ar"?"lang-ar":"lang-en"; }

  function toast(m){ var e=$("#toast")||el("div"); if(!e.id){ e.id="toast"; e.style.cssText="position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-m);z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:80%;text-align:center"; $("#phone").appendChild(e); }
    e.textContent=m; requestAnimationFrame(function(){ e.style.opacity="1"; }); clearTimeout(e._t); e._t=setTimeout(function(){ e.style.opacity="0"; },1900); }

  /* ── chrome + tabs + router ── */
  var NAV=[["dashboard",I.grid],["leads",I.people],["efficiency",I.target],["inventory",I.box],["map",I.mapt]];
  function renderChrome(){
    if(S.view==="map" || S.view==="commission" || S.view==="reports" || S.view==="integrations" || S.view==="automation" || S.view==="notifications"){ $("#chrome").innerHTML=""; return; }
    $("#chrome").innerHTML=
      '<div class="appbar"><button class="hmb" id="hmb">'+I.menu+'</button>'+
      '<div class="logo"><img src="'+LOGO+'" alt="Village" style="height:25px;display:block"/><span class="name" style="font-size:15px;color:var(--ink-2);margin-inline-start:3px">CRM</span></div>'+
      '<div class="weather">☀︎ 29°</div>'+
      '<button class="bell" id="bell">'+I.bell+(unreadN()? '<span class="dot">'+unreadN()+'</span>':'')+'</button></div>';
    $("#hmb").onclick=openMenu;
    $("#bell").onclick=function(){ go("notifications"); };
  }
  function renderTabs(){
    $("#tabs").innerHTML=NAV.map(function(n){return '<button class="tab'+(S.view===n[0]?" on":"")+'" data-v="'+n[0]+'">'+n[1]+'<span>'+t(n[0])+'</span></button>';}).join("");
    [].forEach.call(document.querySelectorAll(".tab"),function(b){ b.onclick=function(){ go(b.getAttribute("data-v")); }; });
  }
  function go(v){ S.view=v; closeSheet(); render(); var s=$("#view"); if(s) s.scrollTop=0; }
  function render(){
    renderChrome(); renderTabs();
    var fn={dashboard:vDashboard,leads:vLeads,efficiency:vEfficiency,inventory:vInventory,map:vMap,commission:vCommission,reports:vReports,integrations:vIntegrations,automation:vAutomation,notifications:vNotifs}[S.view]||vDashboard;
    var v=$("#view"); v.innerHTML=""; v.style.padding=S.view==="map"?"0 0 118px":"6px 18px 118px"; v.appendChild(fn());
    $("#fab").style.display=S.view==="map"?"none":"grid";
  }
  $("#scrim").onclick=closeSheet;
  $("#fab").onclick=openAI;
  applyDir(); render();
})();
</script>
