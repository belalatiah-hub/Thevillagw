  .side-foot { margin-top: auto; padding: 10px; color: #9FC2CF; font-size: 11.5px; border-top: 1px solid rgba(255,255,255,.08); }

  .topbar {

  .page-sub { color: var(--muted); font-size: 12px; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--surface-2);

  .icon-btn {

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

  .t-warm  { color: var(--warm); background: color-mix(in srgb, var(--warm) 15%, transparent); }

  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }

  .score-wrap { display: flex; align-items: center; gap: 8px; min-width: 92px; }
  .score-bar { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .score-fill { height: 100%; border-radius: 999px; }

  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }

  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* Pipeline */
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; width: 264px; flex: 0 0 auto; display: flex; flex-direction: column; max-height: 100%; }
  .col.drag-over { outline: 2px dashed var(--accent); outline-offset: -3px; }
  .col-head { padding: 12px 13px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .col-head b { font-size: 13px; } .col-head .pb { font-size: 11px; color: var(--muted); }
  .col-body { padding: 11px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .deal { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px; box-shadow: var(--shadow); cursor: grab; }

  .deal.dragging { opacity: .5; }
  .deal .dt { font-weight: 700; font-size: 13px; margin-bottom: 5px; }
  .deal .dv { font-size: 13px; font-weight: 800; color: var(--brand-500); }

  @media (prefers-color-scheme: dark) { .deal .dv { color: var(--accent); } }
  .deal .dm { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  /* Inventory */
  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px,1fr)); gap: 15px; }
  .unit { overflow: hidden; }
  .unit .hd { height: 96px; background: linear-gradient(135deg, var(--brand-700), var(--brand-500)); position: relative; display: grid; place-items: center; }

  /* Permission matrix */
  .matrix { overflow-x: auto; }

  .tl::before { content: ""; position: absolute; inset-block: 4px 4px; inset-inline-start: 5px; width: 2px; background: var(--line); }
  .tl-item { position: relative; padding-bottom: 15px; }
  .tl-item::before { content: ""; position: absolute; inset-inline-start: -21px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .tl-item .tt { font-weight: 600; font-size: 13px; }
  .tl-item .td { color: var(--muted); font-size: 11.5px; }

  /* Login */
  .login { position: fixed; inset: 0; display: grid; grid-template-columns: 1.05fr .95fr; z-index: 60; }
  .login-art { background: linear-gradient(150deg, var(--brand-900), var(--brand-700) 55%, var(--brand-500)); color: #fff; padding: 46px; position: relative; overflow: hidden; display: flex; flex-direction: column; }

  .login-art p { color: #B9D4DE; max-width: 42ch; position: relative; margin: 0 0 8px; }
  .login-art .stats { display: flex; gap: 26px; margin-top: 24px; position: relative; }
  .login-art .stats b { font-size: 24px; } .login-art .stats span { color: #9FC2CF; font-size: 12px; }
  .login-form { background: var(--surface); display: grid; place-items: center; padding: 30px; }
  .login-form .inner { width: 100%; max-width: 340px; }
  .login-form h2 { font-size: 22px; margin: 0 0 5px; letter-spacing: -.01em; }
  .login-form .lead { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
  .inp { width: 100%; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 14px; margin-bottom: 12px; }
  .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .demo-creds { margin-top: 16px; padding: 12px 14px; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 10px; font-size: 12px; color: var(--muted); }
  .demo-creds code { color: var(--ink); font-weight: 600; }

  .toast { position: fixed; inset-block-end: 22px; inset-inline: 0; display: flex; justify-content: center; z-index: 80; pointer-events: none; }
  .toast .t { background: var(--brand-800); color: #fff; padding: 11px 18px; border-radius: 11px; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 600;
    transform: translateY(20px); opacity: 0; transition: .25s; }
  .toast .t.show { transform: translateY(0); opacity: 1; }

  .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
  .lang-en [data-ar], .lang-ar [data-en] { display: none; }

  @media (max-width: 1080px) {
    .shell { grid-template-columns: 1fr; }
    .side { display: none; }
    .kpis { grid-template-columns: repeat(2,1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .login { grid-template-columns: 1fr; }
    .login-art { display: none; }
  }
</style>

  /* ── charts (inline SVG) ──────────────────────────────────────────────── */
  function sparkline(vals, color) {
    var w=96,h=42,max=Math.max.apply(null,vals),min=Math.min.apply(null,vals),rng=(max-min)||1;
    var pts=vals.map(function(v,i){ return [ (i/(vals.length-1))*w, h-4-((v-min)/rng)*(h-10) ]; });
    var d=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
    var area=d+" L"+w+" "+h+" L0 "+h+" Z";
    var last=pts[pts.length-1];
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="sg'+color.replace(/\W/g,"")+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#sg'+color.replace(/\W/g,"")+')"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="'+color+'"/></svg>';
  }
  function barChart(data) { // [{label,value,color}]
    var max=Math.max.apply(null,data.map(function(d){return d.value;}))||1;
    var rows=data.map(function(d){
      var pct=Math.round((d.value/max)*100);
      return '<div class="row" style="gap:10px"><div style="width:104px;color:var(--muted);font-size:12px;text-align:start">'+d.label+'</div>'+
        '<div style="flex:1;height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden"><div style="width:'+pct+'%;height:100%;border-radius:999px;background:'+d.color+'"></div></div>'+
        '<div class="tnum" style="width:26px;text-align:end;font-weight:700;font-size:12.5px">'+d.value+'</div></div>';
    }).join("");
    return '<div style="display:flex;flex-direction:column;gap:11px">'+rows+'</div>';
  }
  function funnelChart(data) { // [{label,count,color}]
    var max=Math.max.apply(null,data.map(function(d){return d.count;}))||1;
    return '<div style="display:flex;flex-direction:column;gap:8px">'+data.map(function(d){
      var pct=Math.max(16,Math.round((d.count/max)*100));
      return '<div class="row between" style="gap:12px"><span style="font-size:12.5px;color:var(--ink-soft);min-width:96px">'+d.label+'</span>'+
        '<div style="flex:1;display:flex;justify-content:center"><div style="width:'+pct+'%;height:30px;border-radius:8px;background:'+d.color+';display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px" class="tnum">'+d.count+'</div></div></div>';
    }).join("")+'</div>';
  }
  function donut(data) { // [{label,value,color}]
    var total=data.reduce(function(a,d){return a+d.value;},0)||1, r=52, c=2*Math.PI*r, off=0, R=64;
    var segs=data.map(function(d){
      var frac=d.value/total, len=frac*c;
      var s='<circle cx="'+R+'" cy="'+R+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="16" stroke-dasharray="'+len.toFixed(1)+' '+(c-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 '+R+' '+R+')"/>';
      off+=len; return s;
    }).join("");
    var legend=data.map(function(d){ return '<div class="row" style="gap:7px"><span class="dot" style="background:'+d.color+'"></span><span style="font-size:12.5px;flex:1">'+d.label+'</span><b class="tnum" style="font-size:12.5px">'+d.value+'</b></div>'; }).join("");
    return '<div class="row" style="gap:18px"><svg width="128" height="128" viewBox="0 0 128 128" style="flex:0 0 auto">'+segs+
      '<text x="64" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)" class="tnum">'+total+'</text>'+
      '<text x="64" y="78" text-anchor="middle" font-size="10" fill="var(--muted)">'+t("leads")+'</text></svg>'+
      '<div style="flex:1;display:flex;flex-direction:column;gap:9px">'+legend+'</div></div>';
  }

  function viewPipeline() {
    var c = el("div");
    var openVal = deals.filter(function(d){return d.stage!=="s5";}).reduce(function(a,d){return a+d.value;},0);
    var weighted = deals.filter(function(d){return d.stage!=="s5";}).reduce(function(a,d){var st=stages.filter(function(s){return s.id===d.stage;})[0];return a+d.value*(st.prob/100);},0);

      head.innerHTML='<div class="row" style="gap:8px"><span class="dot" style="background:'+s.color+'"></span><b>'+t(s.name)+'</b><span class="pill st" style="padding:1px 7px">'+colDeals.length+'</span></div><span class="pb tnum">'+money(sum)+'</span>';
      col.appendChild(head);

      colDeals.forEach(function(d){

        card.addEventListener("dragstart",function(e){ card.classList.add("dragging"); e.dataTransfer.setData("text/plain",d.id); });
        card.addEventListener("dragend",function(){ card.classList.remove("dragging"); });
        body.appendChild(card);

      col.addEventListener("dragover",function(e){ e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave",function(){ col.classList.remove("drag-over"); });

        if(d && d.stage!==s.id){ d.stage=s.id; toast(t("moved")+" → "+t(s.name)); render(); }
      });
      board.appendChild(col);
    });
    c.appendChild(board);
    return c;

    var who = el("div","who");
    who.innerHTML = '<div class="avatar">'+member("u1").init+'</div><div><b>'+mName(member("u1"))+'</b><span>'+(state.lang==="ar"?member("u1").roleAr:member("u1").role)+'</span></div>';
    var out = el("button","icon-btn"); out.innerHTML = ic.logout; out.title=t("logout"); out.style.marginInlineStart="4px";
    out.onclick=function(){ state.authed=false; render(); };
    who.appendChild(out);
    top.appendChild(who);
    main.appendChild(top);

    var content = el("div","content");
    var viewFn = { dashboard:viewDashboard, leads:viewLeads, pipeline:viewPipeline, inventory:viewInventory, customers:viewCustomers, developers:viewDevelopers, team:viewTeam, settings:viewSettings }[state.view] || viewDashboard;
    content.appendChild(viewFn());
    main.appendChild(content);
    shell.appendChild(main);
    return shell;
  }
  function navGroup(label, items) {
    var g = el("div");
    g.appendChild(el("div","nav-label",label));
    items.forEach(function(n){
      var b = el("button","nav-item"+(state.view===n.id?" active":""));
      var badge = n.badge ? '<span class="badge tnum">'+n.badge()+'</span>' : "";
      b.innerHTML = ic[n.icon] + '<span>'+t(n.id)+'</span>' + badge;
      b.onclick = function(){ go(n.id); };
      g.appendChild(b);
    });
    return g;
  }
  function go(v){ state.view=v; closeDrawer(); render(); var c=$(".content"); if(c) c.scrollTop=0; }

  /* ── login ────────────────────────────────────────────────────────────── */
  function loginView() {
    var net='<svg class="bgnet" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><g stroke="#fff" stroke-width="1" fill="none">'+
      '<path d="M0 480 L80 430 L150 470 L240 400 L320 450 L400 380"/><path d="M0 520 L90 470 L170 510 L250 445 L340 490 L400 430"/>'+
      '</g><g fill="#fff">'+[[80,430],[240,400],[320,450],[170,510],[340,490]].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3"/>';}).join("")+'</g></svg>';
    var wrap = el("div","login");
    var art = el("div","login-art");
    art.innerHTML = net +
      '<div class="lg-brand"><div class="mark" style="width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-size:19px">V</div>'+
      '<div><b style="display:block">'+t("company")+'</b><span style="color:#9FC2CF;font-size:11px;letter-spacing:.08em;text-transform:uppercase">'+t("tagline")+'</span></div></div>'+
      '<h1>'+t("hero_h")+'</h1><p>'+t("hero_p")+'</p>'+
      '<div class="stats"><div><b class="tnum">1,240+</b><br><span>'+t("s_leads")+'</span></div><div><b>3×</b><br><span>'+t("s_conv")+'</span></div><div><b>AR / EN</b><br><span>'+t("s_lang")+'</span></div></div>';
    var form = el("div","login-form");
    form.innerHTML =
      '<div class="inner"><div class="row between" style="margin-bottom:20px"><div></div>'+
      '<div class="row" style="gap:6px"><button class="icon-btn" id="lgLang" title="عرب/EN">'+ic.globe+'</button><button class="icon-btn" id="lgTheme" title="Theme">'+ic.moon+'</button></div></div>'+
      '<h2>'+t("login_h")+'</h2><p class="lead">'+t("login_p")+'</p>'+
      '<input class="inp" id="lgEmail" value="admin@thevillageinvestment.com" placeholder="'+t("email")+'"/>'+
      '<input class="inp" id="lgPass" type="password" value="Admin!2345" placeholder="'+t("password")+'"/>'+
      '<button class="btn primary" id="lgGo" style="width:100%;justify-content:center;padding:12px">'+t("signin")+'</button>'+
      '<div class="demo-creds"><b style="color:var(--ink)">'+t("demo_note")+':</b><br>'+
        '<code>admin@thevillageinvestment.com</code> · <code>Admin!2345</code><br>'+
        '<code>sales@thevillageinvestment.com</code> · <code>Sales!2345</code></div></div>';
    wrap.appendChild(art); wrap.appendChild(form);
    setTimeout(function(){
      $("#lgGo").onclick = function(){ state.authed=true; state.view="dashboard"; render(); toast(t("welcome")+" 👋"); };
      $("#lgLang").onclick = function(){ state.lang=state.lang==="en"?"ar":"en"; applyDir(); render(); };
      $("#lgTheme").onclick = toggleTheme;
      $("#lgPass").addEventListener("keydown",function(e){ if(e.key==="Enter") $("#lgGo").click(); });
    },0);
    return wrap;
  }

  /* ── theme + dir ──────────────────────────────────────────────────────── */
  function toggleTheme(){
    var root=document.documentElement;
    var cur=root.getAttribute("data-theme");
    if(!cur){ cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light"; }
    root.setAttribute("data-theme", cur==="dark"?"light":"dark");
  }
  function applyDir(){
    document.documentElement.dir = state.lang==="ar"?"rtl":"ltr";
    document.documentElement.lang = state.lang;
    document.body.className = state.lang==="ar"?"lang-ar":"lang-en";
  }

  /* ── render ───────────────────────────────────────────────────────────── */
  function render(){
    var app = $("#app"); app.innerHTML="";
    if(!state.authed){ app.appendChild(loginView()); return; }
    app.appendChild(chrome());
    if(!$("#scrim")){
      var s=el("div","drawer-scrim"); s.id="scrim"; s.onclick=closeDrawer; document.body.appendChild(s);
      var d=el("aside","drawer"); d.id="drawer"; document.body.appendChild(d);
    }
  }
  applyDir();
  render();
})();
</script>
