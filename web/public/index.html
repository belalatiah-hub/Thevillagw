<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Village CRM — The Village Investment</title>
<meta name="description" content="Village CRM — enterprise real-estate CRM web console for The Village Investment."/>
<style>
  :root{
    --bg:#f4f2f9; --bg-2:#eceaf5; --card:#ffffff; --card-2:#f6f4fb; --line:#e7e3f0; --line-2:#dcd6ea;
    --ink:#1f2138; --ink-2:#4a4d68; --ink-3:#8b8ba6;
    --coral:#e0603a; --coral-2:#f0895f; --coral-soft:#fce9e2;
    --purple:#7c6fd6; --purple-soft:#efecfb; --green:#22b06b; --green-soft:#e2f6ec;
    --amber:#e0a12e; --amber-soft:#fbf1dc; --red:#e5533c; --red-soft:#fce7e3; --cool:#4d84c0; --fb:#1877F2;
    --shadow-s:0 1px 3px rgba(30,20,60,.06); --shadow-m:0 8px 30px rgba(30,20,60,.10);
    --sb:248px;
  }
  :root[data-theme="dark"]{
    --bg:#0f1226; --bg-2:#0b0e20; --card:#191d33; --card-2:#141830; --line:#262b47; --line-2:#313655;
    --ink:#eef0fb; --ink-2:#b9bee0; --ink-3:#7b80a6; --purple-soft:#242850; --green-soft:#122e26;
    --coral-soft:#3a241d; --amber-soft:#332a15; --red-soft:#37201d; --shadow-m:0 10px 34px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f1226; --bg-2:#0b0e20; --card:#191d33; --card-2:#141830; --line:#262b47; --line-2:#313655;
    --ink:#eef0fb; --ink-2:#b9bee0; --ink-3:#7b80a6; --purple-soft:#242850; --green-soft:#122e26;
    --coral-soft:#3a241d; --amber-soft:#332a15; --red-soft:#37201d; --shadow-m:0 10px 34px rgba(0,0,0,.5);
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  body.lang-ar{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
  a{color:inherit;text-decoration:none}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}

  /* App shell */
  .app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
  .sidebar{background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px}
  .brand img{height:26px;display:block}
  .brand .nm{font-size:15px;font-weight:800;color:var(--ink-2)}
  .nav{flex:1;overflow-y:auto;padding:6px 12px}
  .nav-group{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:16px 12px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--ink-2);font-weight:600;font-size:13.5px;cursor:pointer;position:relative}
  .nav a svg{width:18px;height:18px;flex:none}
  .nav a:hover{background:var(--card-2)}
  .nav a.on{background:var(--coral-soft);color:var(--coral)}
  .nav a .badge{margin-inline-start:auto;background:var(--coral);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px}
  .side-foot{padding:12px;border-top:1px solid var(--line)}
  .side-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer}
  .side-user:hover{background:var(--card-2)}
  .av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 24px}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 38px;color:var(--ink);font-size:13.5px;outline:none}
  body.lang-ar .search input{padding:10px 38px 10px 14px}
  .search svg{position:absolute;inset-inline-start:12px;top:11px;width:17px;height:17px;color:var(--ink-3)}
  .ic-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative}
  .ic-btn:hover{background:var(--card-2)}
  .ic-btn svg{width:19px;height:19px}
  .ic-btn .dot{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
  .content{padding:24px;max-width:1280px;width:100%;margin:0 auto}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-head h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .page-head .sub{color:var(--ink-3);font-size:13.5px;margin-top:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-s)}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{padding:18px}
  .kpi .l{color:var(--ink-3);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .kpi .l svg{width:15px;height:15px}
  .kpi .v{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
  .kpi .d{font-size:12px;font-weight:700;margin-top:4px}
  .up{color:var(--green)} .down{color:var(--red)}
  .row{display:flex;align-items:center} .between{justify-content:space-between} .gap{gap:12px} .wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;font-weight:700;font-size:13.5px;padding:10px 16px;cursor:pointer}
  .btn svg{width:17px;height:17px}
  .btn-coral{background:var(--coral);color:#fff} .btn-coral:hover{background:var(--coral-2)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)} .btn-ghost:hover{background:var(--card-2)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .dot-s{width:7px;height:7px;border-radius:50%}
  .sec-title{font-size:16px;font-weight:800;margin-bottom:12px}
  .muted{color:var(--ink-3)}

  table{width:100%;border-collapse:collapse}
  th{text-align:start;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
  tbody tr:hover{background:var(--card-2)}
  tbody tr:last-child td{border-bottom:none}
  .tag{padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:800}
  .bar{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px}

  /* Pipeline kanban */
  .kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:14px;overflow-x:auto}
  .kcol{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:180px}
  .kcol h4{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;padding:4px 6px 10px;color:var(--ink-2)}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:var(--shadow-s);cursor:grab}
  .kcard .t{font-weight:700;font-size:13px} .kcard .m{color:var(--ink-3);font-size:11.5px;margin-top:3px}

  /* Permission matrix */
  .permchip{min-width:26px;text-align:center;font-size:11px;font-weight:800;padding:4px 7px;border-radius:8px;background:var(--card-2);color:var(--ink-3);border:1px solid var(--line)}
  .permchip.on{background:var(--green-soft);color:var(--green);border-color:transparent}

  /* Login */
  .login{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg)}
  @media(max-width:820px){.login{grid-template-columns:1fr}.login .brandside{display:none}}
  .brandside{background:linear-gradient(150deg,#20233e,#2b2650 60%,#3a2c52);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:8%;position:relative;overflow:hidden}
  .brandside .logo{height:40px;filter:brightness(0) invert(1);align-self:flex-start;margin-bottom:40px}
  .brandside h2{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.15}
  .brandside p{color:#c7c9e6;margin-top:14px;font-size:15px;max-width:420px}
  .brandside .feat{margin-top:34px;display:flex;flex-direction:column;gap:12px}
  .brandside .feat div{display:flex;align-items:center;gap:10px;color:#dfe0f2;font-size:14px;font-weight:600}
  .brandside .feat svg{width:18px;height:18px;color:#8fe3b4}
  .loginbox{display:flex;align-items:center;justify-content:center;padding:24px}
  .loginform{width:100%;max-width:380px}
  .loginform h3{font-size:24px;font-weight:800} .loginform .s{color:var(--ink-3);margin:6px 0 24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
  .field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:14px;outline:none}
  .field input:focus{border-color:var(--coral)}
  .demo-note{background:var(--purple-soft);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
  .err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-m);z-index:200;opacity:0;transition:.22s;pointer-events:none}
  .hide{display:none!important}
  .flex-c{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body class="lang-en">

<!-- Login gate -->
<div class="login" id="login">
  <div class="brandside">
    <img class="logo" id="loginLogo" alt="Village"/>
    <h2 id="lHero">The complete real-estate CRM for your team.</h2>
    <p id="lSub">Leads, pipeline, inventory, finance, automation and AI — one secure console for The Village Investment.</p>
    <div class="feat" id="lFeat"></div>
  </div>
  <div class="loginbox">
    <form class="loginform" id="loginForm">
      <h3 id="lWelcome">Welcome back</h3>
      <div class="s" id="lSignin">Sign in to Village CRM</div>
      <div class="demo-note" id="lDemo"></div>
      <div class="err" id="lErr"></div>
      <div class="field"><label id="lEmail">Email</label><input type="email" id="email" autocomplete="username" required/></div>
      <div class="field"><label id="lPass">Password</label><input type="password" id="password" autocomplete="current-password" required/></div>
      <button class="btn btn-coral" id="lBtn" type="submit" style="width:100%;justify-content:center;padding:13px;margin-top:6px">Sign in</button>
      <div class="row between" style="margin-top:16px">
        <button type="button" class="btn btn-ghost" id="lLang" style="padding:8px 12px;font-size:12.5px">العربية</button>
        <button type="button" class="btn btn-ghost" id="lTheme" style="padding:8px 12px;font-size:12.5px">🌙 / ☀︎</button>
      </div>
    </form>
  </div>
</div>

<!-- App shell -->
<div class="app hide" id="app">
  <aside class="sidebar">
    <div class="brand"><img id="sbLogo" alt="Village"/><span class="nm">CRM</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-user" id="sideUser"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="globalSearch" placeholder="Search leads, customers, units…"/></div>
      <div class="grow"></div>
      <div style="position:relative"><button class="btn btn-ghost" id="personaBtn" title="View as role" style="padding:9px 12px;font-size:12.5px;gap:8px"><span id="personaLabel">Super Admin</span> <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button><div id="personaMenu" class="hide" style="position:absolute;top:46px;inset-inline-end:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-m);padding:6px;width:250px;max-height:60vh;overflow-y:auto;z-index:40"></div></div>
      <button class="ic-btn" id="tLang" title="Language">🌐</button>
      <button class="ic-btn" id="tTheme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
      <button class="ic-btn" id="tBell" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot" id="bellDot"></span></button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  // AI Sales Coach — score every inventory unit against a lead's requirements
  // (budget fit + preferred area + availability). Returns matches sorted desc.
  function matchUnits(lead){
    return demo.units.map(function(u){
      var s=8, r=u.price/lead.budget;
      // Budget fit — peaks as the unit approaches (but stays within) budget.
      if(r<=1) s+=28+Math.round(16*r);                       // ~28→44
      else if(r<=1.12) s+=Math.round(24-(r-1)*120);          // ~24→10
      else s+=Math.max(0,8-Math.round((r-1.12)*30));         // fades out
      if(u.city===lead.area) s+=30;                          // preferred area
      if(u.status==="available") s+=15; else if(u.status==="reserved") s+=4;
      return { u:u, score:Math.max(4,Math.min(98,Math.round(s))) };
    }).filter(function(m){ return m.u.status!=="sold"; })
      .sort(function(a,b){ return b.score-a.score; });
  }

  // Finance-only: record a sale + its commission (by %, by value, or fixed amount).

    var projects=[]; (demo.units||[]).forEach(function(u){ if(projects.indexOf(u.project)<0) projects.push(u.project); }); if(!projects.length) projects=["—"];
    var sources=(demo.lookups&&demo.lookups.CHANNEL)||["Facebook","Instagram","TikTok","Google","Referral","Website"];
    var people=state.live?Object.keys(SB._names||{}).map(function(id){return SB._names[id];}):["Fatma Sayed","Nour Hany","Kareem Fathy","Omar Khaled"];
    if(!people.length) people=["—"];
    var types=[["percent",t("by_percent")],["value",t("by_value")],["fixed",t("fixed_amount")]];
    var typeSel='<div class="field"><label>'+t("commission_type")+'</label><select id="csType" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:14px">'+types.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join("")+'</select></div>';
    openModal(t("add_sale"),
      field("csClient",t("client_name"),"")+field("csProject","",projects[0],projects)+field("csSource",t("lead_source"),sources[0],sources)+field("csValue",t("deal_value"),"6")+field("csWho",t("sold_by"),people[0],people)+typeSel+field("csRate",t("comm_rate"),"2"),
      function(ov){
        var client=ov.querySelector("#csClient").value.trim(); if(!client){ ov.querySelector("#csClient").focus(); return false; }
        var project=ov.querySelector("#csProject").value, source=ov.querySelector("#csSource").value, valueM=parseFloat(ov.querySelector("#csValue").value)||0;
        var who=ov.querySelector("#csWho").value, type=ov.querySelector("#csType").value, rate=parseFloat(ov.querySelector("#csRate").value)||0;
        var amount=commAmount(type,rate,valueM);
        if(state.live){
          var recId=null; for(var id in (SB._names||{})){ if(SB._names[id]===who){ recId=id; break; } }
          SB.insert("deals",{company_id:SB.companyId,title:client+" — "+project,client_name:client,project:project,source:source,value_egp:valueM*1e6,sold_by:recId})
            .then(function(deal){ return SB.insert("commissions",{company_id:SB.companyId,deal_id:deal.id,profile_id:recId,calc_type:type,rate:rate,amount_egp:amount,status:"pending"}); })
            .then(function(c){ demo.commissions.unshift({id:c.id,client:client,project:project,date:"now",source:source,value:valueM,recipient:who,type:type,rate:rate,amount:amount,status:"pending"}); toast(t("sale_recorded")); render(); })
            .catch(saveFailed());
          return true;
        }
        demo.commissions.unshift({client:client,project:project,date:"now",source:source,value:valueM,recipient:who,type:type,rate:rate,amount:amount,status:"pending"});
        toast(t("sale_recorded")); render();
      });
  }
  // AI Sales Coach block for the lead drawer — top inventory matches + one-click offer.
  function coachBlock(lead){
    var matches=matchUnits(lead).slice(0,3);
    var rows=matches.length?matches.map(function(m,i){ var col=m.score>=75?"var(--green)":m.score>=55?"var(--amber)":"var(--ink-3)";
      return '<div class="card matchunit" data-u="'+demo.units.indexOf(m.u)+'" style="padding:11px 13px;margin-bottom:8px;box-shadow:none;cursor:pointer;background:var(--card)">'+
        '<div class="row between"><b style="font-size:13px">'+esc(m.u.project)+' · '+m.u.type+(i===0?' <span class="pill" style="background:var(--green-soft);color:var(--green);font-size:9.5px;padding:1px 7px">'+t("best_match")+'</span>':'')+'</b><b class="tnum" style="color:var(--coral);font-size:12.5px">EGP '+m.u.price+'M</b></div>'+
        '<div class="muted" style="font-size:11px;margin-top:2px">'+esc(m.u.city)+' · '+m.u.beds+'BR · '+m.u.area+' m² · '+esc(m.u.code)+'</div>'+
        '<div class="row between" style="margin-top:8px;align-items:center;gap:8px"><div class="row gap" style="gap:7px;flex:1"><div class="bar" style="flex:1;max-width:130px"><i style="width:'+m.score+'%;background:'+col+'"></i></div><b class="tnum" style="font-size:11px;color:'+col+'">'+m.score+'% '+t("match")+'</b></div>'+
        (can("lead:update")?'<button class="btn btn-coral offerbtn" data-u="'+demo.units.indexOf(m.u)+'" style="padding:6px 12px;font-size:11.5px">'+I.dl+t("send_offer")+'</button>':'')+'</div></div>';
    }).join(""):'<div class="muted" style="font-size:12.5px">'+t("no_matches")+'</div>';
    return '<div class="card" style="padding:16px;margin-bottom:18px;background:linear-gradient(135deg,var(--purple-soft),var(--card));box-shadow:none">'+
      '<div class="row gap" style="gap:8px;margin-bottom:3px"><span style="color:var(--purple)">'+I.brain+'</span><b style="font-size:14px">'+t("ai_sales_coach")+'</b></div>'+
      '<div class="muted" style="font-size:11.5px;margin-bottom:12px">'+t("requirements")+': '+esc(lead.area)+' · EGP '+lead.budget+'M</div>'+rows+'</div>';
  }
  // Lead detail drawer with the Next-Action loop + action history (mirrors the API).
  function openLeadDrawer(lead){
    var due="after_1h", stage=(demo.leadStages[1]||["Potential"])[0], rating=0;
    var hist=(demo.actionHistory[lead.n]||[]).slice();
    var fbk=(demo.feedback&&demo.feedback[lead.n]||[]).slice();
    var ov=document.createElement("div"); ov.style.cssText="position:fixed;inset:0;z-index:150;background:rgba(20,15,40,.45);display:flex;justify-content:flex-end";
    function draw(){
      var canAct=can("lead:update");
      ov.innerHTML='<div class="card" style="width:100%;max-width:460px;height:100%;border-radius:0;display:flex;flex-direction:column;box-shadow:var(--shadow-m)">'+
        '<div style="padding:18px 20px;border-bottom:1px solid var(--line)"><div class="row between"><div><h3 style="font-size:18px;font-weight:800">'+esc(lead.n)+'</h3><div class="muted" style="font-size:12.5px">'+esc(lead.area)+' · '+(lead.owner||lead.agent||"")+' · EGP '+lead.budget+'M</div></div><button class="ic-btn" id="dX" style="width:30px;height:30px;border:none">✕</button></div>'+
          '<div class="row gap" style="gap:8px;margin-top:12px">'+(can("call:create")?'<button class="btn btn-ghost" data-d="call" style="padding:8px 12px;font-size:12.5px">'+I.phone+'Call</button>':'')+(can("whatsapp:create")?'<button class="btn btn-ghost" data-d="wa" style="padding:8px 12px;font-size:12.5px">'+I.chat+'WhatsApp</button>':'')+'</div></div>'+
        '<div style="flex:1;overflow-y:auto;padding:18px 20px">'+
          coachBlock(lead)+
          (canAct?'<div class="card" style="padding:16px;background:var(--card-2);box-shadow:none;margin-bottom:18px"><div class="sec-title" style="font-size:14px">'+t("log_action")+'</div>'+
            '<div class="field"><label>'+t("next_action")+'</label><select id="dAct" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink)">'+demo.nextActions.map(function(a){return '<option>'+a+'</option>';}).join("")+'</select></div>'+
            '<div class="field"><label>'+t("stage")+'</label><select id="dStage" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink)">'+demo.leadStages.map(function(s){return '<option'+(s[0]===stage?" selected":"")+'>'+s[0]+'</option>';}).join("")+'</select></div>'+
            '<div class="field"><label>'+t("stage_date")+'</label><div class="row wrap gap" style="gap:7px">'+[["after_1h","after_1h"],["after_2h","after_2h"],["tomorrow","tomorrow"],["next_week","next_week"]].map(function(d){return '<button class="btn ddue '+(due===d[0]?"btn-coral":"btn-ghost")+'" data-due="'+d[0]+'" style="padding:7px 12px;font-size:12px">'+t(d[1])+'</button>';}).join("")+'</div></div>'+
            '<div class="field"><label>'+t("rating")+'</label><div class="row" id="dStars" style="gap:4px">'+[1,2,3,4,5].map(function(n){return '<span class="dstar" data-n="'+n+'" style="cursor:pointer;font-size:22px;color:'+(n<=rating?"var(--amber)":"var(--line-2)")+'">★</span>';}).join("")+'</div></div>'+
            '<div class="field"><label>'+t("comment")+'</label><textarea id="dComment" rows="2" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);resize:vertical" placeholder="…"></textarea></div>'+
            '<button class="btn btn-coral" id="dSave" style="width:100%;justify-content:center;margin-top:4px">'+t("save_action")+'</button></div>':'')+
          '<div class="sec-title" style="font-size:14px">'+t("action_history")+'</div>'+
          (hist.length?hist.map(function(h){ var col=h.status==="PLANNED"?"var(--amber)":"var(--green)";
            return '<div class="card" style="padding:12px 14px;margin-bottom:9px;box-shadow:none;border-inline-start:3px solid '+col+'"><div class="row between"><b style="font-size:13.5px">'+h.act+(h.stage?' → '+h.stage:'')+'</b><span class="muted" style="font-size:11.5px">'+esc(h.when)+'</span></div>'+
              (h.comment?'<div class="muted" style="font-size:12.5px;margin-top:3px">'+esc(h.comment)+'</div>':'')+
              '<div class="row gap" style="gap:8px;margin-top:5px"><span class="muted" style="font-size:11px">'+esc(h.by)+'</span>'+(h.rating?'<span style="color:var(--amber);font-size:11px">'+"★".repeat(h.rating)+'</span>':'')+'<span class="pill" style="background:'+col+'1f;color:'+col+';padding:1px 8px;font-size:10px">'+t(h.status==="PLANNED"?"planned":"done")+'</span></div></div>';
          }).join(""):'<div class="muted" style="font-size:13px">—</div>')+
          '<div class="sec-title" style="font-size:14px;margin-top:22px">'+t("feedback_history")+'</div>'+
          (canAct?'<div class="row gap" style="gap:8px;margin-bottom:12px"><input id="dFbk" placeholder="'+t("add_feedback")+'…" style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);font-size:13px"/><button class="btn btn-coral" id="dFbkAdd" style="padding:11px 14px">'+I.plus+'</button></div>':'')+
          (fbk.length?fbk.map(function(f){ return '<div class="card" style="padding:11px 14px;margin-bottom:8px;box-shadow:none;border-inline-start:3px solid var(--purple)"><div style="font-size:13px">'+esc(f.text)+'</div><div class="row gap" style="gap:8px;margin-top:4px"><span class="muted" style="font-size:11px">'+esc(f.by)+'</span><span class="muted" style="font-size:11px">'+esc(f.when)+'</span></div></div>'; }).join(""):'<div class="muted" style="font-size:13px">—</div>')+
        '</div></div>';
      ov.querySelector("#dX").onclick=close;
      // AI Sales Coach: open a matched unit, or send its PDF offer (logged to history+audit).
      [].forEach.call(ov.querySelectorAll(".matchunit"),function(b){ b.onclick=function(){ var u=demo.units[+b.getAttribute("data-u")]; if(u) openUnit(u); }; });
      [].forEach.call(ov.querySelectorAll(".offerbtn"),function(b){ b.onclick=function(ev){ ev.stopPropagation(); var u=demo.units[+b.getAttribute("data-u")];
        hist.unshift({act:"Send offer",stage:(demo.leadStages[2]||["Hot Case"])[0],by:currentPersona().name,when:"now",comment:"PDF offer — "+u.project+" "+u.type+" · EGP "+u.price+"M",status:"PLANNED"});
        demo.actionHistory[lead.n]=hist;
        if(state.live&&lead.id){ SB.insert("lead_actions",{company_id:SB.companyId,lead_id:lead.id,next_action:"Send offer",stage_name:"Hot Case",comment:"PDF offer — "+u.project+" "+u.type+" · EGP "+u.price+"M",status:"PLANNED"}).catch(saveFailed(function(){ hist.shift(); })); }
        else demo.audit.unshift(["lead.offer","create",currentPersona().name,"lead/"+lead.n.split(" ")[0].toLowerCase(),"127.0.0.1","now"]);
        toast(t("offer_sent")); draw(); }; });
      [].forEach.call(ov.querySelectorAll("[data-d]"),function(b){ b.onclick=function(){ toast(b.getAttribute("data-d")==="call"?"Calling "+lead.n+"…":"WhatsApp "+lead.n); }; });
      [].forEach.call(ov.querySelectorAll(".ddue"),function(b){ b.onclick=function(){ due=b.getAttribute("data-due"); draw(); }; });
      [].forEach.call(ov.querySelectorAll(".dstar"),function(s){ s.onclick=function(){ rating=+s.getAttribute("data-n"); draw(); }; });
      var sv=ov.querySelector("#dSave"); if(sv) sv.onclick=function(){
        var act=ov.querySelector("#dAct").value, stg=ov.querySelector("#dStage").value, cm=ov.querySelector("#dComment").value;
        hist.unshift({act:act,stage:stg,by:currentPersona().name,when:"now",comment:cm,rating:rating||undefined,status:"PLANNED"});
        demo.actionHistory[lead.n]=hist;
        lead.stage=stg;                       // keep the stage the agent chose
        lead.status=STAGE_STATUS[stg]||lead.status;
        if(state.live&&lead.id){              // persist it, don't just show it
          SB.rest("leads?id=eq."+lead.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:{stage:stg,status:lead.status}})
            .catch(saveFailed());
        }
        if(state.live&&lead.id){ SB.insert("lead_actions",{company_id:SB.companyId,lead_id:lead.id,next_action:act,stage_name:stg,comment:cm||null,rating:rating||null,status:"PLANNED"}).catch(saveFailed(function(){ hist.shift(); })); }
        else demo.audit.unshift(["lead.action","update",currentPersona().name,"lead/"+lead.n.split(" ")[0].toLowerCase(),"127.0.0.1","now"]);
        toast(state.lang==="ar"?"تم حفظ الإجراء ✓":"Action saved ✓"); rating=0; draw();
      };
      var fa=ov.querySelector("#dFbkAdd"); if(fa) fa.onclick=function(){ var inp=ov.querySelector("#dFbk"); var v=inp&&inp.value.trim(); if(!v) return;
        fbk.unshift({text:v,by:currentPersona().name,when:"now"}); (demo.feedback=demo.feedback||{})[lead.n]=fbk;
        if(state.live&&lead.id){ SB.insert("feedback",{company_id:SB.companyId,lead_id:lead.id,body:v}).catch(saveFailed(function(){ fbk.shift(); })); }
        else demo.audit.unshift(["lead.feedback","create",currentPersona().name,"lead/"+lead.n.split(" ")[0].toLowerCase(),"127.0.0.1","now"]);
        toast(state.lang==="ar"?"تمت إضافة الملاحظة ✓":"Feedback added ✓"); draw(); };
    }
    var close=function(){ document.body.removeChild(ov); };
    ov.addEventListener("click",function(e){ if(e.target===ov) close(); });
    document.body.appendChild(ov); draw();
    // Live mode: pull this lead's real action history + feedback, then re-draw.
    if(state.live&&lead.id){
      Promise.all([
        SB.rest("lead_actions?select=*&lead_id=eq."+lead.id+"&order=created_at.desc"),
        SB.rest("feedback?select=*&lead_id=eq."+lead.id+"&order=created_at.desc")
      ]).then(function(r){
        hist=(r[0]||[]).map(function(a){ return { act:a.next_action, stage:a.stage_name, by:(SB._names[a.created_by]||""), when:new Date(a.created_at).toLocaleDateString(), comment:a.comment, rating:a.rating||undefined, status:a.status }; });
        fbk=(r[1]||[]).map(function(f){ return { text:f.body, by:(SB._names[f.created_by]||""), when:new Date(f.created_at).toLocaleDateString() }; });
        draw();
      }).catch(function(){});
    }
  }

  function go(v){ if(!allowedView(v)) return; if(v!=="roles") state.roleSel=null; state.view=v; render(); document.querySelector(".content").scrollTop=0; }

  /* ── auth ── */
  function showApp(){ $("#login").classList.add("hide"); $("#app").classList.remove("hide"); render(); }
  function logout(){ state.token=null; state.me=null; state.live=false; SB.token=null; SB.userId=null; SB.refreshToken=null; SB.expiresAt=null; try{localStorage.removeItem("village_token");localStorage.removeItem("village_sb");}catch(e){} $("#app").classList.add("hide"); $("#login").classList.remove("hide"); $("#lBtn").textContent=t("signin_btn"); }

  function doLogin(e){ e.preventDefault();
    var email=$("#email").value, pass=$("#password").value, err=$("#lErr");
    err.style.display="none";
    if(SUPA()){
      $("#lBtn").textContent="…";
      SB.login(email.trim(),pass).then(function(r){
        if(!r||!r.access_token){ throw new Error((r&&(r.error_description||r.msg))||"invalid"); }
        SB.userId=r.user.id; SB.remember(r);
        return loadLive().catch(function(e){ e.kind="profile"; throw e; });
      }).then(function(){ showApp(); })
      .catch(function(e){
        // A correct password with a missing/mis-scoped profile row is a
        // provisioning problem — telling the user "invalid credentials" sends
        // them to reset a password that was never wrong.
        err.textContent = (e&&e.kind==="profile")
          ? (state.lang==="ar"?"تم تسجيل الدخول، لكن لا يوجد ملف مستخدم مرتبط بهذا الحساب. تواصل مع مسؤول النظام."
                              :"Signed in, but this account has no user profile yet. Contact your administrator.")
          : (state.lang==="ar"?"بيانات الدخول غير صحيحة.":"Invalid credentials.");
        err.style.display="block"; $("#lBtn").textContent=t("signin_btn"); });
      return;
    }
    if(!LIVE()){ state.persona=PERSONAS[0]; state.me={firstName:"Village",lastName:"Admin",email:email,role:"Super Admin",permissions:["*"]}; showApp(); return; }
    $("#lBtn").textContent="…";
    api("/auth/login",{method:"POST",body:{email:email,password:pass}}).then(function(r){
      state.token=r.accessToken; try{localStorage.setItem("village_token",r.accessToken);}catch(e){}
      return api("/users/me");
    }).then(function(me){
      state.me={ firstName:me.firstName, lastName:me.lastName, email:me.email,
        role:(me.roles&&me.roles[0]&&me.roles[0].role.name)||"—",
        permissions:(me.roles||[]).reduce(function(acc,ur){return acc.concat(ur.role.permissions||[]);},[]) };
      showApp();
    }).catch(function(){ err.textContent=state.lang==="ar"?"بيانات الدخول غير صحيحة أو الخادم غير متاح.":"Invalid credentials or backend unavailable."; err.style.display="block"; $("#lBtn").textContent=t("signin_btn"); });
  }

  /* ── chrome (lang/theme) ── */
  function applyLang(){ document.documentElement.lang=state.lang; document.documentElement.dir=state.lang==="ar"?"rtl":"ltr"; document.body.className=state.lang==="ar"?"lang-ar":"lang-en";
    // login texts
    $("#lHero").textContent=t("hero"); $("#lSub").textContent=t("hero_sub"); $("#lWelcome").textContent=t("welcome");
    $("#lSignin").textContent=t("signin"); $("#lEmail").textContent=t("email"); $("#lPass").textContent=t("password");
    $("#lBtn").textContent=t("signin_btn"); $("#lDemo").textContent=t("demo_note"); $("#lLang").textContent=state.lang==="ar"?"English":"العربية";
    $("#lFeat").innerHTML=[["f1"],["f2"],["f3"]].map(function(f){return '<div>'+I.check+t(f[0])+'</div>';}).join("");
    $("#lDemo").style.display=(LIVE()||SUPA())?"none":"block";
    if(!$("#app").classList.contains("hide")) render();
  }
  function toggleLang(){ state.lang=state.lang==="en"?"ar":"en"; applyLang(); }
  function toggleTheme(){ var r=document.documentElement,cur=r.getAttribute("data-theme"); if(!cur) cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; r.setAttribute("data-theme",cur==="dark"?"light":"dark"); }
  var toastT; function toast(m){ var e=$("#toast"); e.textContent=m; e.style.opacity="1"; clearTimeout(toastT); toastT=setTimeout(function(){e.style.opacity="0";},1900); }

  /* ── boot ── */
  $("#loginLogo").src=LOGO; $("#sbLogo").src=LOGO;
  $("#loginForm").addEventListener("submit",doLogin);
  $("#lLang").onclick=toggleLang; $("#lTheme").onclick=toggleTheme;
  $("#tLang").onclick=toggleLang; $("#tTheme").onclick=toggleTheme;
  $("#tBell").onclick=function(){ go("notifications"); };
  $("#personaBtn").onclick=function(e){ e.stopPropagation(); if(state.live) return; var m=$("#personaMenu"); if(m.classList.contains("hide")){ renderPersonaMenu(); m.classList.remove("hide"); } else m.classList.add("hide"); };
  document.addEventListener("click",function(){ var m=$("#personaMenu"); if(m&&!m.classList.contains("hide")) m.classList.add("hide"); });
  function renderPersonaMenu(){
    var cur=currentPersona();
    $("#personaMenu").innerHTML='<div style="font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px">'+(state.lang==="ar"?"جرّب كأي وظيفة":"View as any role")+'</div>'+
      PERSONAS.map(function(p,i){ var on=p.role===cur.role;
        var sc={all:state.lang==="ar"?"الكل":"all",team:state.lang==="ar"?"الفريق":"team",own:state.lang==="ar"?"الخاص":"own"}[p.scope];
        return '<div class="prow" data-i="'+i+'" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;'+(on?"background:var(--coral-soft)":"")+'"><span class="av" style="width:28px;height:28px;font-size:11px;background:'+p.c+'">'+p.name.split(" ").map(function(x){return x[0];}).join("").slice(0,2)+'</span><div class="grow" style="min-width:0"><div style="font-weight:700;font-size:12.5px;white-space:nowrap">'+esc(p.role)+'</div><div class="muted" style="font-size:11px">'+esc(p.name)+'</div></div><span class="permchip'+(p.scope==="all"?" on":"")+'" style="font-size:9.5px">'+sc+'</span></div>';
      }).join("");
    [].forEach.call(document.querySelectorAll("#personaMenu .prow"),function(r){ r.onclick=function(ev){ ev.stopPropagation(); $("#personaMenu").classList.add("hide"); setPersona(PERSONAS[+r.getAttribute("data-i")]); }; });
  }
  applyLang();
  // Auto-resume live session if a token is stored.
  try{
    if(SUPA()){ var raw=localStorage.getItem("village_sb"); if(raw){ var s=JSON.parse(raw); SB.token=s.t; SB.userId=s.u; SB.refreshToken=s.r; SB.expiresAt=s.e; loadLive().then(function(){ showApp(); }).catch(function(){ try{localStorage.removeItem("village_sb");}catch(e){} }); } }
    else { var tok=localStorage.getItem("village_token"); if(tok&&LIVE()){ state.token=tok; api("/users/me").then(function(me){ state.me={firstName:me.firstName,lastName:me.lastName,email:me.email,role:(me.roles&&me.roles[0]&&me.roles[0].role.name)||"—",permissions:(me.roles||[]).reduce(function(a,ur){return a.concat(ur.role.permissions||[]);},[])}; showApp(); }).catch(function(){}); } }
  }catch(e){}
})();
</script>
