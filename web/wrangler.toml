# Cloudflare Workers — Village CRM web console (static assets)
# Deploy:  npx wrangler deploy
# Docs:    https://developers.cloudflare.com/workers/static-assets/
#
# This serves the single-file console (index.html) as a static asset on a
# Worker. The custom worker (worker.js) adds SPA fallback + security headers.

name = "village-crm"
main = "worker.js"
compatibility_date = "2024-11-01"

# Static assets: everything in ./public is served directly.
[assets]
directory = "./public"
binding = "ASSETS"
# Any unmatched route falls back to index.html (single-page app behaviour).
not_found_handling = "single-page-application"

# Optional: bind your production API base so the console can read it at runtime.
# The console also works with the API_BASE constant set directly in index.html.
[vars]
API_BASE = ""

# --- Custom domain / route (uncomment and set once your zone is on Cloudflare) ---
# routes = [
#   { pattern = "crm.thevillageinvestment.com", custom_domain = true }
# ]
#
# Or deploy under the workers.dev subdomain you already use:
#   https://village-crm.<your-subdomain>.workers.dev
