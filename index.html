<!DOCTYPE html>
<!--
  ============================================================================
  THE VILLAGE INVESTMENT  ·  Primary-sale real estate, Egypt
  Production-grade bilingual (EN/AR · LTR/RTL) static application.
  ----------------------------------------------------------------------------
  Engineering notes (per V2.1 implementation contract):
   · Brand: derived from the approved master logo (teal #073D52 / #115F7D +
     warm bone #F3EFE6 + ink). Legacy royal-blue/yellow/olive residue removed.
   · Routing: History API, clean locale-prefixed paths (/en/… /ar/…), real
     Back/Forward, deep links, and a genuine branded 404 view. No hash routes.
   · Security: no inline event handlers, no innerHTML sinks for dynamic/user
     content (DOM built via safe helpers), CSP meta, no eval.
   · Honesty: every commercial figure carries a provenance badge and is clearly
     labelled illustrative pending advisor confirmation. No fake success states.
     Phone/WhatsApp CTAs stay hidden until verified numbers are configured.
   · Counts shown are computed from the on-page dataset (curated selection),
     never presented as "all live inventory".
   · a11y: semantic landmarks, skip link, focus management on route change,
     keyboard operable, visible focus, AA contrast, reduced-motion, RTL parity.
  Public facts (developer names, area names) are used as-is; all descriptive
  copy is original to The Village. No competitor code/text/imagery is used.
  ============================================================================
-->

  <style>
  /* ===================================================================
     DESIGN TOKENS — derived from the approved master logo (teal/ink/bone)
     =================================================================== */
  :root{
    --teal-900:#052e3d; --teal-800:#073D52; --teal-700:#0b4a63;
    --teal-600:#115F7D; --teal-500:#1a7ba0; --teal-400:#3fa3c4; --teal-050:#e7f0f3;
    --ink:#0e1a1f; --ink-2:#3c525b; --ink-3:#526a71;
    --bone:#F3EFE6; --bone-2:#faf7f0; --paper:#ffffff;
    --line:#e5ddcf; --line-2:#efe9dd; --line-cool:#dfe6e8;
    --ok:#1f7a54; --ok-bg:#e6f3ec; --warn-ink:#8a5a12; --warn-bg:#f6edda;
    --danger:#b23a2e;
    --focus:#1a7ba0;
    --shadow-sm:0 1px 2px rgba(7,61,82,.06),0 1px 3px rgba(7,61,82,.05);
    --shadow-md:0 6px 18px -6px rgba(7,61,82,.18),0 2px 6px rgba(7,61,82,.06);
    --shadow-lg:0 24px 48px -18px rgba(7,61,82,.30);
    --r-sm:8px; --r:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
    --pad:clamp(16px,4vw,28px);
    --maxw:1200px;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --arab:"Tajawal",system-ui,sans-serif;
    --t:200ms cubic-bezier(.2,.6,.2,1);
    --header-h:68px;
  }
  html[dir="rtl"]{ --sans:var(--arab); --serif:var(--arab); }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bone-2);
    line-height:1.6;font-size:16.5px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:hidden;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
  img{max-width:100%;display:block;height:auto}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;color:inherit}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.12;margin:0;color:var(--ink);letter-spacing:-.01em}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{letter-spacing:0;font-weight:700}
  p{margin:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
  ::selection{background:var(--teal-600);color:#fff}

  /* ---- Skip link ---- */
  .skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--teal-800);color:var(--bone);
    padding:10px 16px;border-radius:var(--r-sm);transition:top var(--t);font-weight:600}
  .skip:focus{top:12px}
  html[dir="rtl"] .skip{left:auto;right:12px}

  /* ---- Layout ---- */
  .wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
  .section{padding-block:clamp(44px,7vw,86px)}
  .section--tight{padding-block:clamp(30px,5vw,56px)}
  main{flex:1 0 auto;display:block}
  .eyebrow{font-family:var(--sans);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-600)}
  html[dir="rtl"] .eyebrow{letter-spacing:.06em}
  .sec-head{max-width:62ch;margin-bottom:clamp(22px,4vw,40px)}
  .sec-head h1,.sec-head h2{font-size:clamp(1.7rem,3.6vw,2.5rem);margin-top:10px;font-weight:800;line-height:1.15}
  .sec-head p{color:var(--ink-2);margin-top:12px;font-size:1.02rem}
  .lead{font-size:clamp(1.02rem,1.8vw,1.18rem);color:var(--ink-2)}

  /* ---- Buttons ---- */
  .btn{display:inline-flex;align-items:center;gap:.5em;justify-content:center;
    padding:.72em 1.25em;border-radius:var(--r-pill);border:1.5px solid transparent;
    font-weight:600;font-size:.95rem;transition:var(--t);min-height:44px;white-space:nowrap;line-height:1}
  .btn svg{width:1.05em;height:1.05em;flex:none}
  .btn--primary{background:var(--teal-800);color:var(--bone)}
  .btn--primary:hover{background:var(--teal-700);transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .btn--ghost{background:transparent;border-color:var(--line-cool);color:var(--ink)}
  .btn--ghost:hover{border-color:var(--teal-600);color:var(--teal-700);background:var(--teal-050)}
  .btn--light{background:var(--bone);color:var(--teal-800)}
  .btn--light:hover{background:#fff;transform:translateY(-1px)}
  .btn--sm{padding:.5em .9em;min-height:38px;font-size:.85rem}
  .btn--icon{padding-inline:.7em;min-width:40px;justify-content:center}
  .btn--block{width:100%}
  .btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
    border-radius:var(--r-pill);border:1.5px solid var(--line-cool);background:var(--paper);transition:var(--t)}
  .icon-btn:hover{border-color:var(--teal-600);color:var(--teal-700)}
  .icon-btn svg{width:20px;height:20px}

  /* ---- Chips / badges ---- */
  .chip{display:inline-flex;align-items:center;gap:.4em;padding:.32em .7em;border-radius:var(--r-pill);
    font-size:.76rem;font-weight:600;background:var(--teal-050);color:var(--teal-700);line-height:1}
  .chip--muted{background:var(--bone);color:var(--ink-2)}
  .chip--status{background:#eaf5ef;color:var(--ok)}
  .chip--launch{background:#fbeede;color:var(--warn-ink)}
  .badge-src{display:inline-flex;align-items:center;gap:.4em;font-size:.72rem;color:var(--ink-3);font-weight:500}
  .badge-src svg{width:13px;height:13px;color:var(--teal-500)}
  .prov{margin-top:6px;font-size:.72rem;color:var(--ink-3);display:flex;align-items:center;gap:.4em}
  .prov svg{width:13px;height:13px;color:var(--warn-ink);flex:none}

  /* ===================================================================
     HEADER
     =================================================================== */
  header.site{position:sticky;top:0;z-index:100;background:rgba(250,247,240,.86);
    backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line-2)}
  .nav{display:flex;align-items:center;gap:14px;height:var(--header-h)}
  .brand{display:flex;align-items:center;gap:10px;flex:none;margin-inline-end:auto}
  .brand img{height:30px;width:auto}
  .brand .sub{font-family:var(--serif);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--teal-600);font-weight:600;padding-inline-start:2px;border-inline-start:1px solid var(--line);margin-inline-start:2px;padding-block:2px}
  @media(max-width:520px){.brand .sub{display:none}}
  .nav-links{display:flex;align-items:center;gap:2px}
  .nav-links a{padding:9px 13px;border-radius:var(--r-sm);font-weight:600;font-size:.92rem;color:var(--ink-2);transition:var(--t)}
  .nav-links a:hover{color:var(--teal-800);background:var(--teal-050)}
  .nav-links a[aria-current="page"]{color:var(--teal-800)}
  .nav-links a[aria-current="page"]::after{content:"";display:block;height:2px;background:var(--teal-600);border-radius:2px;margin-top:3px}
  .nav-actions{display:flex;align-items:center;gap:8px;flex:none}
  .lang-btn{font-weight:700;font-size:.85rem;letter-spacing:.02em}
  .burger{display:none}
  @media(max-width:940px){
    .nav-links{display:none}
    .burger{display:inline-flex}
  }

  /* Mobile drawer */
  .drawer-back{position:fixed;inset:0;background:rgba(14,26,31,.5);opacity:0;visibility:hidden;transition:var(--t);z-index:150}
  .drawer-back.open{opacity:1;visibility:visible}
  .drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(88vw,340px);background:var(--bone-2);
    z-index:151;transform:translateX(100%);visibility:hidden;transition:transform var(--t),visibility 0s linear var(--t);display:flex;flex-direction:column;
    padding:20px;box-shadow:var(--shadow-lg);overflow-y:auto}
  html[dir="rtl"] .drawer{transform:translateX(-100%)}
  .drawer.open{transform:translateX(0);visibility:visible;transition:transform var(--t),visibility 0s}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .drawer nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .drawer nav a{padding:13px 12px;border-radius:var(--r-sm);font-weight:600;font-size:1.05rem;border-bottom:1px solid var(--line-2)}
  .drawer nav a:hover,.drawer nav a[aria-current="page"]{background:var(--teal-050);color:var(--teal-800)}

  /* ===================================================================
     HERO
     =================================================================== */
  .hero{position:relative;background:
      radial-gradient(120% 90% at 85% -10%,rgba(26,123,160,.18),transparent 55%),
      linear-gradient(160deg,var(--teal-900),var(--teal-800) 55%,var(--teal-700));
    color:var(--bone);overflow:hidden;isolation:isolate}
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
    background-image:linear-gradient(rgba(243,239,230,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(243,239,230,.04) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(90% 70% at 70% 0,#000,transparent 75%)}
  .hero .wrap{position:relative;padding-block:clamp(48px,8vw,104px)}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,60px);align-items:center}
  @media(max-width:880px){.hero-grid{grid-template-columns:1fr;gap:32px}}
  .hero h1{color:var(--bone);font-size:clamp(2.2rem,5.6vw,3.9rem);font-weight:600;letter-spacing:-.02em}
  html[dir="rtl"] .hero h1{letter-spacing:0}
  .hero h1 em{font-style:italic;color:#bfe3ef;font-weight:500}
  .hero p.lead{color:#d9e6ea;margin-top:20px;max-width:52ch}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .hero-trust{display:flex;flex-wrap:wrap;gap:22px;margin-top:34px;padding-top:26px;border-top:1px solid rgba(243,239,230,.16)}
  .hero-trust .stat b{font-family:var(--serif);font-size:1.7rem;display:block;color:#fff;font-weight:600;line-height:1}
  .hero-trust .stat span{font-size:.8rem;color:#bcd0d6}

  /* Search panel */
  .search-card{background:var(--paper);color:var(--ink);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-lg)}
  .search-card h2{font-size:1.1rem;margin-bottom:4px}
  .search-card .muted{color:var(--ink-3);font-size:.82rem;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
  .field label{font-size:.78rem;font-weight:700;color:var(--ink-2)}
  .field select,.field input,.field textarea{width:100%;min-width:0;max-width:100%;padding:12px 14px;border:1.5px solid var(--line-cool);
    border-radius:var(--r-sm);background:var(--bone-2);font:inherit;color:var(--ink);transition:var(--t);min-height:46px;text-overflow:ellipsis}
  .field textarea{min-height:110px;resize:vertical}
  .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--teal-600);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(26,123,160,.15)}
  .field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

  /* ===================================================================
     CARDS / GRIDS
     =================================================================== */
  .grid{display:grid;gap:22px}
  .grid--3{grid-template-columns:repeat(3,1fr)}
  .grid--4{grid-template-columns:repeat(4,1fr)}
  .grid--2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:980px){.grid--3,.grid--4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid--2,.grid--3,.grid--4{grid-template-columns:1fr}}

  .card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;
    display:flex;flex-direction:column;transition:var(--t)}
  .card:hover{box-shadow:var(--shadow-md);border-color:var(--line-cool);transform:translateY(-2px)}
  .card__media{aspect-ratio:16/10;position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--teal-700),var(--teal-900))}
  .card__media .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);
    font-size:2.4rem;color:rgba(243,239,230,.9);font-weight:600}
  .card__media .pat{position:absolute;inset:0;opacity:.28;
    background:repeating-linear-gradient(135deg,rgba(243,239,230,.14) 0 2px,transparent 2px 16px)}
  .card__media .tags{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
  .card__media .tags .chip{background:rgba(7,61,82,.82);color:var(--bone);backdrop-filter:blur(4px)}
  .card__save{position:absolute;inset-block-start:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.9);display:grid;place-items:center;border:none;transition:var(--t)}
  .card__save:hover{background:#fff;transform:scale(1.08)}
  .card__save svg{width:19px;height:19px;color:var(--teal-700)}
  .card__save[aria-pressed="true"] svg{fill:var(--teal-700)}
  .card__body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card__body h3{font-size:1.16rem}
  .card__dev{font-size:.82rem;color:var(--ink-3);font-weight:600}
  .card__facts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:2px;font-size:.83rem;color:var(--ink-2)}
  .card__facts b{color:var(--ink);font-weight:700}
  .card__facts svg{width:15px;height:15px;flex:none;color:var(--teal-600);vertical-align:-2px}
  .card__facts span{display:inline-flex;align-items:center;gap:5px}
  .card__price{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--teal-800);margin-top:4px}
  .card__price small{font-family:var(--sans);font-size:.72rem;color:var(--ink-3);font-weight:600;display:block}
  .card__foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px}

  /* Area / developer tiles */
  .tile{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:180px;display:flex;
    align-items:flex-end;padding:18px;color:var(--bone);border:1px solid var(--line-2);transition:var(--t);
    background:linear-gradient(160deg,var(--teal-700),var(--teal-900))}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .tile .pat{position:absolute;inset:0;opacity:.2;background:repeating-linear-gradient(135deg,rgba(243,239,230,.16) 0 2px,transparent 2px 18px)}
  .tile h3{position:relative;color:var(--bone);font-size:1.25rem}
  .tile p{position:relative;font-size:.82rem;color:#cfe0e5;margin-top:4px}
  .tile .cnt{position:relative;margin-top:8px;font-size:.76rem;color:#bcd0d6}
  .tile-note{position:relative;margin-top:3px;font-size:.66rem;letter-spacing:.01em;color:#cfe0e5;opacity:.85}

  .dev-card{display:flex;gap:14px;align-items:center;padding:16px;background:var(--paper);
    border:1px solid var(--line-2);border-radius:var(--r);transition:var(--t)}
  .dev-card:hover{border-color:var(--teal-600);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .dev-logo{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none;
    font-family:var(--serif);font-weight:700;font-size:1.1rem;color:var(--bone);background:linear-gradient(150deg,var(--teal-600),var(--teal-900))}
  .dev-card .meta h3{font-size:1.02rem}
  .dev-card .meta p{font-size:.8rem;color:var(--ink-3);margin-top:2px}

  /* ===================================================================
     FILTER BAR / TOOLBAR
     =================================================================== */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);
    border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-sm)}
  .toolbar .field{flex:1 1 160px;margin:0;min-width:0}
  .toolbar .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
  .toolbar select,.toolbar input{min-height:44px;padding:9px 12px}
  .result-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-block:20px 22px}
  .result-bar .count{font-weight:700}
  .active-filters{display:flex;flex-wrap:wrap;gap:6px}
  .filter-tag{display:inline-flex;align-items:center;gap:6px;background:var(--teal-050);color:var(--teal-700);
    border-radius:var(--r-pill);padding:5px 6px 5px 12px;font-size:.8rem;font-weight:600}
  .filter-tag button{border:none;background:rgba(7,61,82,.12);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;line-height:1;font-size:1rem;color:var(--teal-800);cursor:pointer}
  html[dir="rtl"] .filter-tag{padding:5px 12px 5px 6px}

  /* ---- Empty / states ---- */
  .state{text-align:center;padding:48px 20px;border:1px dashed var(--line-cool);border-radius:var(--r-lg);background:var(--paper)}
  .state svg{width:40px;height:40px;color:var(--teal-500);margin-bottom:12px}
  .state h3{font-size:1.2rem;margin-bottom:6px}
  .state p{color:var(--ink-2);max-width:44ch;margin-inline:auto}
  .skeleton{background:linear-gradient(90deg,var(--line-2) 25%,#f4efe4 37%,var(--line-2) 63%);
    background-size:400% 100%;animation:sk 1.3s ease-in-out infinite;border-radius:var(--r-sm)}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

  /* ===================================================================
     DETAIL PAGES
     =================================================================== */
  .breadcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-3);margin-bottom:18px}
  .breadcrumb a:hover{color:var(--teal-700)}
  .breadcrumb .sep{opacity:.5}
  .detail-hero{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:start}
  @media(max-width:820px){.detail-hero{grid-template-columns:1fr}}
  .detail-media{aspect-ratio:16/10;border-radius:var(--r-lg);position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--teal-700),var(--teal-900))}
  .detail-media .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:3rem;color:rgba(243,239,230,.9)}
  .fact-table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
  .fact-table th,.fact-table td{text-align:start;padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:.92rem}
  .fact-table th{color:var(--ink-3);font-weight:600;width:42%}
  .fact-table td{font-weight:600}
  .fact-table tr:last-child th,.fact-table tr:last-child td{border-bottom:none}
  .aside-card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px;position:sticky;top:calc(var(--header-h) + 16px)}
  .price-lg{font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--teal-800)}

  /* Compare table */
  .cmp-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--paper)}
  .cmp{border-collapse:collapse;width:100%;min-width:640px}
  .cmp th,.cmp td{padding:14px 16px;border-bottom:1px solid var(--line-2);text-align:start;font-size:.9rem;vertical-align:top}
  .cmp thead th{background:var(--teal-050);position:sticky;top:0}
  .cmp th[scope=row]{color:var(--ink-3);font-weight:600;background:var(--bone-2)}
  .cmp .diff{box-shadow:inset 3px 0 0 var(--teal-500)}
  html[dir="rtl"] .cmp .diff{box-shadow:inset -3px 0 0 var(--teal-500)}

  /* Accordion (FAQ) */
  .acc{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--paper);margin-bottom:10px}
  .acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:16px 18px;text-align:start;font-weight:600;font-size:1.02rem;background:none;border:none}
  .acc button:hover{background:var(--bone-2)}
  .acc .ico{flex:none;transition:transform var(--t);color:var(--teal-600)}
  .acc button[aria-expanded="true"] .ico{transform:rotate(45deg)}
  .acc .panel{padding:0 18px;max-height:0;overflow:hidden;transition:max-height var(--t);color:var(--ink-2)}
  .acc .panel > div{padding-bottom:18px}

  /* Notice / callout */
  .notice{display:flex;gap:12px;padding:16px 18px;border-radius:var(--r);border:1px solid;font-size:.9rem;align-items:flex-start}
  .notice svg{width:20px;height:20px;flex:none;margin-top:1px}
  .notice--info{background:var(--teal-050);border-color:#bfdae3;color:var(--teal-800)}
  .notice--warn{background:var(--warn-bg);border-color:#e6d4ab;color:var(--warn-ink)}
  .notice--ok{background:var(--ok-bg);border-color:#bfe0cd;color:var(--ok)}

  /* ---- Prose (about/legal/research) ---- */
  .prose{max-width:72ch}
  .prose h2{font-size:clamp(1.4rem,3vw,1.9rem);margin-top:36px;margin-bottom:12px}
  .prose h3{font-size:1.2rem;margin-top:26px;margin-bottom:8px}
  .prose p{margin-bottom:14px;color:var(--ink-2)}
  .prose ul{margin:0 0 16px;padding-inline-start:22px;color:var(--ink-2)}
  .prose li{margin-bottom:7px}
  .prose strong{color:var(--ink)}

  /* ===================================================================
     FOOTER
     =================================================================== */
  footer.site{background:var(--teal-900);color:#cfe0e5;margin-top:auto;padding-block:clamp(40px,6vw,64px) 24px}
  footer.site .cols{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}
  @media(max-width:820px){footer.site .cols{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){footer.site .cols{grid-template-columns:1fr}}
  footer.site img.flogo{height:30px;margin-bottom:14px}
  footer.site h4{color:var(--bone);font-family:var(--sans);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
  footer.site a{display:block;padding:5px 0;color:#b6ccd2;font-size:.9rem;transition:var(--t)}
  footer.site a:hover{color:#fff}
  footer.site .fbtm{margin-top:32px;padding-top:20px;border-top:1px solid rgba(243,239,230,.14);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:.8rem;color:#8fabb3}
  footer.site .disc{font-size:.78rem;color:#8fabb3;max-width:60ch;margin-top:10px}

  /* ---- Mobile action bar (single fixed bottom layer) ---- */
  .mobile-bar{position:fixed;inset-block-end:0;inset-inline:0;z-index:90;display:none;gap:10px;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(250,247,240,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line-2)}
  @media(max-width:640px){.mobile-bar{display:flex}main{padding-bottom:76px}}

  /* ---- Dialog ---- */
  dialog.modal{border:none;border-radius:var(--r-lg);padding:0;max-width:min(94vw,520px);width:100%;
    box-shadow:var(--shadow-lg);color:var(--ink)}
  dialog.modal::backdrop{background:rgba(14,26,31,.55)}
  .modal-in{padding:24px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

  /* ---- Toast (honest, non-deceptive status) ---- */
  .toast-host{position:fixed;inset-block-end:20px;inset-inline:0;display:flex;justify-content:center;z-index:220;pointer-events:none;padding:0 14px}
  .toast{pointer-events:auto;background:var(--ink);color:var(--bone);padding:13px 18px;border-radius:var(--r);
    box-shadow:var(--shadow-lg);font-size:.9rem;max-width:440px;display:flex;gap:10px;align-items:flex-start;
    transform:translateY(20px);opacity:0;transition:var(--t)}
  .toast.show{transform:none;opacity:1}
  .toast svg{width:18px;height:18px;flex:none;margin-top:1px}
  @media(max-width:640px){.toast-host{inset-block-end:86px}}

  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .divider{height:1px;background:var(--line-2);border:none;margin-block:clamp(30px,5vw,52px)}
  .center{text-align:center}
  .mt-24{margin-top:24px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}
  .muted{color:var(--ink-3)}
  .band{background:var(--bone)}
  .band-teal{background:var(--teal-900);color:var(--bone)}
  .band-teal h2{color:var(--bone)}
  .band-teal .lead{color:#cfe0e5}

  /* ---- Illustration covers (original SVG art, not photos) ---- */
  .card__media .artsvg,.detail-media .artsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .card__media .tags,.detail-media .tags{position:absolute;inset-block-end:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
  .card__media .tags .chip,.detail-media .tags .chip{background:rgba(7,61,82,.82);color:var(--bone);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .card__devmark{position:absolute;inset-block-start:10px;inset-inline-start:10px;z-index:2;box-shadow:0 2px 8px rgba(5,36,48,.4);border:1.5px solid rgba(243,239,230,.55)}
  /* ---- Unit-type cards ---- */
  .unit-card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:var(--t)}
  .unit-card:hover{border-color:var(--teal-600);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .unit-media{background:#e7f0f3;padding:12px;display:grid;place-items:center}
  .unit-media .unitsvg{width:100%;max-width:160px;height:auto}
  .unit-body{padding:12px 14px}
  .unit-body h4{font-size:1rem}
  .unit-body p{font-size:.78rem;color:var(--ink-3);margin-top:3px}
  /* ---- Contact quick actions ---- */
  .btn--wa{background:#1f8f4e;color:#fff}
  .btn--wa:hover{background:#187a40;transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .btn--wa svg{fill:none}
  /* ---- Unit specs + type icons ---- */
  .spec-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
  .spec{display:inline-flex;align-items:center;gap:5px;font-size:.86rem;color:var(--ink-2)}
  .spec svg{width:17px;height:17px;color:var(--teal-600);flex:none}
  .spec b{color:var(--ink);font-weight:700}
  .spec-lbl{color:var(--ink-3);font-size:.76rem}
  .chip svg.chip-ico{width:13px;height:13px;color:currentColor}
  .type-row{display:flex;gap:10px;flex-wrap:wrap}
  .type-chip{display:inline-flex;flex-direction:column;align-items:center;gap:7px;min-width:82px;padding:14px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);text-align:center;transition:var(--t)}
  .type-chip:hover{border-color:var(--teal-600);box-shadow:var(--shadow-sm)}
  .type-chip svg{width:28px;height:28px;color:var(--teal-700)}
  .type-chip span{font-size:.82rem;font-weight:600}
  /* ---- Social ---- */
  .social{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .social a,.social span{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(243,239,230,.1);color:#cfe0e5;transition:var(--t)}
  .social a:hover{background:var(--teal-600);color:#fff;transform:translateY(-2px)}
  .social svg{width:19px;height:19px}
  .social .off{opacity:.4;cursor:default}
  /* ---- Guided assistant (chat) ---- */
  .chat-fab{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:95;height:52px;padding:0 18px;border-radius:var(--r-pill);border:none;background:var(--teal-800);color:var(--bone);display:inline-flex;align-items:center;gap:8px;font-weight:600;box-shadow:var(--shadow-lg);transition:var(--t)}
  .chat-fab:hover{background:var(--teal-700);transform:translateY(-2px)}
  .chat-fab svg{width:22px;height:22px}
  @media(max-width:640px){.chat-fab{inset-block-end:84px;padding:0;width:52px;justify-content:center}.chat-fab .lbl{display:none}}
  /* ---- Floating contact rail (phone / email / WhatsApp) + 30s nudge ---- */
  .contact-rail{position:fixed;inset-inline-end:14px;top:50%;transform:translateY(-50%);z-index:92;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);padding:7px 6px;border-radius:36px;box-shadow:0 10px 34px rgba(7,61,82,.20);border:1px solid var(--line-2)}
  .cr-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--teal-800);transition:var(--t)}
  .cr-btn svg{width:24px;height:24px}
  .cr-btn:hover,.cr-btn:focus-visible{background:var(--teal-050);transform:scale(1.08);outline:none}
  .cr-btn--wa{color:var(--teal-800)}
  .cr-btn--wa:hover,.cr-btn--wa:focus-visible{background:var(--teal-050)}
  .rail-nudge{position:fixed;inset-inline-end:82px;top:50%;transform:translateY(-50%) translateX(14px);z-index:91;display:flex;align-items:center;gap:9px;max-width:min(74vw,258px);padding:10px 12px;background:var(--paper);color:var(--ink);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 12px 34px rgba(7,61,82,.24);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,transform .3s,visibility .3s;text-decoration:none;font-size:.85rem;font-weight:600;line-height:1.3}
  .rail-nudge.show{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);pointer-events:auto}
  .rail-nudge__ic{width:30px;height:30px;border-radius:50%;background:#1f8f4e;color:#fff;display:grid;place-items:center;flex:none}
  .rail-nudge__ic svg{width:17px;height:17px}
  .rail-nudge__t{flex:1}
  .rail-nudge__x{flex:none;border:none;background:transparent;color:var(--ink-3);font-size:1.15rem;line-height:1;cursor:pointer;padding:0 2px}
  .rail-nudge__x:hover{color:var(--ink)}
  @media(prefers-reduced-motion:reduce){.rail-nudge{transition:opacity .2s}.rail-nudge.show{transform:translateY(-50%)}.cr-btn{transition:background var(--t)}.cr-btn:hover,.cr-btn:focus-visible{width:44px}}
  @media(max-width:640px){.contact-rail{inset-inline-end:10px}.cr-btn{width:42px;height:42px}.cr-btn svg{width:22px;height:22px}.rail-nudge{inset-inline-end:74px;font-size:.8rem}}
  .chat-panel{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:120;width:min(94vw,380px);height:min(74vh,580px);background:var(--bone-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line-2)}
  .chat-panel.open{display:flex}
  @media(max-width:640px){.chat-panel{inset:auto 8px calc(8px + env(safe-area-inset-bottom)) 8px;width:auto;height:82vh;border-radius:var(--r-lg)}}
  .chat-head{background:linear-gradient(150deg,var(--teal-800),var(--teal-900));color:var(--bone);padding:13px 15px;display:flex;align-items:center;gap:10px}
  .chat-head .av{width:34px;height:34px;border-radius:50%;background:rgba(243,239,230,.16);display:grid;place-items:center;flex:none}
  .chat-head .av svg{width:19px;height:19px}
  .chat-head h3{color:var(--bone);font-size:1rem;line-height:1.1}
  .chat-head p{font-size:.72rem;color:#bcd0d6}
  .chat-head .x{margin-inline-start:auto;background:none;border:none;color:var(--bone);width:32px;height:32px;border-radius:8px;flex:none}
  .chat-head .x:hover{background:rgba(243,239,230,.15)}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.9rem;line-height:1.5}
  .msg.bot{background:var(--paper);border:1px solid var(--line-2);align-self:flex-start;border-end-start-radius:4px}
  .msg.user{background:var(--teal-700);color:var(--bone);align-self:flex-end;border-end-end-radius:4px}
  .msg a{color:var(--teal-700);text-decoration:underline;font-weight:600}
  .msg.user a{color:#bfe3ef}
  .chat-illus{display:inline-block;font-style:normal;font-size:.72rem;color:var(--ink-3);margin-inline-end:4px}
  .msg .unit-mini{display:block;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;margin-top:6px;background:var(--bone-2);color:var(--ink)}
  .chat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
  .chat-chips button{background:var(--teal-050);color:var(--teal-700);border:1px solid #bfdae3;border-radius:var(--r-pill);padding:6px 12px;font-size:.8rem;font-weight:600}
  .chat-chips button:hover{background:var(--teal-600);color:#fff}
  .chat-chips button.chip-key{background:var(--teal-700);color:var(--bone);border-color:var(--teal-700)}
  .chat-chips button.chip-key:hover{background:var(--teal-800)}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line-2);background:var(--paper)}
  .chat-input input{flex:1;min-width:0;padding:10px 14px;border:1.5px solid var(--line-cool);border-radius:var(--r-pill);font:inherit;background:var(--bone-2)}
  .chat-input input:focus{border-color:var(--teal-600);outline:none}
  .chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:var(--teal-800);color:var(--bone);display:grid;place-items:center;flex:none}
  .chat-input button:hover{background:var(--teal-700)}
  .chat-input button svg{width:18px;height:18px}
  html[dir=rtl] .chat-input button svg{transform:scaleX(-1)}
  /* ---- Relational Unit Finder ---- */
  .finder{display:grid;grid-template-columns:296px 1fr;gap:24px;align-items:start}
  @media(max-width:900px){.finder{grid-template-columns:1fr}}
  .finder-panel{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px 18px 6px;position:sticky;top:calc(var(--header-h) + 12px);max-height:calc(100vh - var(--header-h) - 28px);overflow:auto}
  @media(max-width:900px){.finder-panel{position:static;max-height:none}}
  .facet-group{padding:13px 0;border-bottom:1px solid var(--line-2)}
  .facet-group:last-child{border-bottom:none}
  .facet-group h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:10px;font-family:var(--sans);font-weight:700}
  .facet-row{display:flex;flex-wrap:wrap;gap:7px}
  .fchip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border:1.5px solid var(--line-cool);border-radius:var(--r-pill);background:var(--bone-2);font-size:.82rem;font-weight:600;color:var(--ink-2);transition:var(--t);min-height:36px}
  .fchip svg{width:15px;height:15px}
  .fchip small{color:var(--ink-3);font-weight:600;font-size:.72rem}
  .fchip:hover{border-color:var(--teal-600)}
  .fchip.on{background:var(--teal-800);color:var(--bone);border-color:var(--teal-800)}
  .fchip.on small{color:#bcd0d6}
  .budget-inputs{display:flex;gap:8px;margin-top:8px}
  .budget-inputs input{width:100%;min-width:0;padding:9px 10px;border:1.5px solid var(--line-cool);border-radius:var(--r-sm);font:inherit;background:var(--bone-2)}
  .toggle-line{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-2);margin-top:10px;cursor:pointer}
  .results-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
  .results-head .rc{font-weight:700}
  .results-head select{min-height:42px;padding:8px 12px;border:1.5px solid var(--line-cool);border-radius:var(--r-sm);background:var(--paper);font:inherit}
  /* ---- Recommendation engine (Exact / Balanced / Flexible) ---- */
  .mode-seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
  .mode-seg__lbl{font-size:.8rem;font-weight:700;color:var(--ink-3);margin-inline-end:2px}
  .mode-seg__btn{padding:7px 14px;border:1.5px solid var(--line-cool);background:var(--bone-2);border-radius:var(--r-pill);font-size:.83rem;font-weight:600;color:var(--ink-2);min-height:38px;transition:var(--t);cursor:pointer}
  .mode-seg__btn:hover{border-color:var(--teal-600);color:var(--teal-800)}
  .mode-seg__btn.on{background:var(--teal-700);border-color:var(--teal-700);color:var(--bone)}
  .reco-explain{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
  .rx{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:var(--r-pill);line-height:1.2}
  .rx svg{width:12px;height:12px}
  .rx--ok{background:rgba(31,143,78,.12);color:#12703b}
  .rx--no{background:var(--bone);color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
  html[data-theme="dark"] .rx--ok{background:rgba(45,180,100,.16);color:#7fdba2}
  .relax-panel{background:var(--bone-2);border:1.5px solid var(--line-cool);border-radius:var(--r-lg);padding:16px;margin-bottom:18px}
  .relax-h{display:flex;align-items:center;gap:8px;font-size:1rem}
  .relax-h svg{width:19px;height:19px;color:var(--teal-600);flex:none}
  .relax-panel .fchip small{color:var(--teal-700);font-weight:700}
  /* ---- Global search command palette ---- */
  .pal-back{position:fixed;inset:0;background:rgba(14,26,31,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:9vh 16px 16px}
  .pal-back.open{display:flex}
  .pal{background:var(--bone-2);width:min(680px,100%);max-height:78vh;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
  .pal-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);background:var(--paper)}
  .pal-top svg{width:20px;height:20px;color:var(--teal-600);flex:none}
  .pal-top input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:1.05rem;outline:none;color:var(--ink)}
  .pal-top kbd{font-size:.68rem;background:var(--bone);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--ink-3);flex:none}
  .pal-body{overflow-y:auto;padding:6px}
  .pal-group{padding:4px 6px}
  .pal-group h5{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:8px 6px 4px;font-weight:700}
  .pal-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer}
  .pal-item:hover,.pal-item.active{background:var(--teal-050)}
  .pal-item .pi-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--teal-050);color:var(--teal-700);flex:none}
  .pal-item .pi-ic svg{width:18px;height:18px}
  .pal-item .pi-t{font-weight:600;font-size:.93rem}
  .pal-item .pi-s{font-size:.77rem;color:var(--ink-3)}
  .pal-empty{padding:26px 16px;text-align:center;color:var(--ink-2)}
  .pal-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-2)}
  .pal-chips button{background:var(--teal-050);color:var(--teal-700);border:1px solid #bfdae3;border-radius:var(--r-pill);padding:5px 11px;font-size:.8rem;font-weight:600}
  .pal-chips button:hover{background:var(--teal-600);color:#fff}
  .pal-foot{padding:8px 14px;border-top:1px solid var(--line-2);font-size:.74rem;color:var(--ink-3);display:flex;gap:12px;justify-content:space-between}
  .search-btn{gap:8px;color:var(--ink-2)}
  .search-btn .sk{font-size:.68rem;background:var(--bone);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink-3)}
  @media(max-width:520px){.search-btn .sk{display:none}}
  /* ---- Print factsheet ---- */
  #print-sheet{display:none}
  .ps-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #073D52;padding-bottom:12px;margin-bottom:14px}
  .ps-head img{height:34px}
  .ps-title{font-family:var(--serif);font-size:1.6rem;color:#073D52;margin:6px 0}
  .ps-table{width:100%;border-collapse:collapse;margin:12px 0}
  .ps-table th,.ps-table td{text-align:start;padding:7px 10px;border:1px solid #ccc;font-size:.92rem}
  .ps-table th{background:#f0ede6;width:40%}
  .ps-note{font-size:.8rem;color:#555;margin-top:14px;border-top:1px solid #ccc;padding-top:10px}
  @media print{
    header.site,footer.site,.mobile-bar,.chat-fab,.chat-panel,.pal-back,#drawer,.drawer-back,.toast-host{display:none!important}
    body>*:not(#print-sheet){display:none!important}
    body{background:#fff}
    #print-sheet{display:block!important;padding:20px;color:#111}
  }
  </style>
</head>

  var RESEARCH = [
    {slug:'primary-vs-resale', cat:{en:'Buyer guide',ar:'دليل المشتري'}, read:6, title:{en:'Primary sale vs resale in Egypt — what actually changes',ar:'البيع الأولي مقابل إعادة البيع في مصر — ما الذي يتغيّر فعلاً'}, excerpt:{en:'Why buying developer-direct affects price, plan and paperwork.',ar:'لماذا يؤثّر الشراء من المطوّر مباشرة على السعر والخطة والأوراق.'}, body:{en:['Primary sale means buying a unit directly from the developer — typically a new launch or off-plan unit — while resale means buying from a current owner. The distinction changes three things buyers care about most: price, payment plan and paperwork.','On price, primary units are usually released at launch pricing with longer installment plans (often several years) but a delivery date in the future. Resale units may cost more per metre because they are ready, but usually require a much larger cash amount up front.','On paperwork, a primary purchase is a contract with the developer and follows the developer’s reservation, contracting and delivery milestones. The Village works only in primary sale, so an advisor can confirm the current developer price list, plan and availability before you commit.'],ar:['البيع الأولي يعني شراء الوحدة مباشرة من المطوّر — عادةً إطلاق جديد أو وحدة على الخريطة — بينما إعادة البيع تكون من مالك حالي. هذا الفرق يغيّر ثلاثة أمور تهمّ المشتري: السعر وخطة السداد والأوراق.','في السعر، تُطرح الوحدات الأولية بأسعار إطلاق مع خطط تقسيط أطول (سنوات غالباً) لكن بتاريخ تسليم مستقبلي. أمّا وحدات إعادة البيع فقد تكون أعلى للمتر لأنها جاهزة، لكنها تتطلّب مبلغاً نقدياً أكبر مقدماً.','في الأوراق، الشراء الأولي عقد مع المطوّر ويتبع مراحل الحجز والتعاقد والتسليم. تعمل The Village في البيع الأولي فقط، لذا يؤكّد المستشار قائمة أسعار المطوّر الحالية والخطة والإتاحة قبل أي التزام.']}},
    {slug:'newcairo-vs-capital', cat:{en:'Area guide',ar:'دليل المناطق'}, read:8, title:{en:'New Cairo vs the New Capital for primary investment',ar:'القاهرة الجديدة مقابل العاصمة الإدارية للاستثمار الأولي'}, excerpt:{en:'Delivery timelines, pricing and who each area suits.',ar:'مواعيد التسليم والأسعار ولمن تناسب كل منطقة.'}, body:{en:['New Cairo is an established East Cairo hub with mature compounds, schools, retail and business districts. Prices reflect that maturity, and many communities are partly or fully delivered.','The New Administrative Capital is newer and still launching, which can mean lower entry pricing and longer plans, but a longer wait to delivery and a maturing services picture.','Neither is universally “better”. Your timeline, budget and whether you’re buying to live or to hold matter more than the label. An advisor can compare current launches in both against your goal.'],ar:['القاهرة الجديدة مركز شرق القاهرة المكتمل بكمبوندات ومدارس وتجزئة ومناطق أعمال، وتعكس الأسعار هذا النضج مع تسليم جزئي أو كامل لكثير من المجتمعات.','العاصمة الإدارية الجديدة أحدث وما زالت تُطرح، ما قد يعني أسعار دخول أقل وخططاً أطول، مقابل انتظار أطول للتسليم وخدمات في طور الاكتمال.','لا توجد منطقة «أفضل» للجميع؛ فجدولك الزمني وميزانيتك وهدفك (سكن أم احتفاظ) أهم من الاسم. يقارن المستشار الإطلاقات الحالية في الاثنتين وفق هدفك.']}},
    {slug:'gcc-remote-reservation', cat:{en:'GCC guide',ar:'دليل الخليج'}, read:7, title:{en:'How Gulf buyers reserve Egypt property remotely',ar:'كيف يحجز مشترو الخليج عقارات مصر عن بُعد'}, excerpt:{en:'A practical view of reserving from abroad and the documents to prepare.',ar:'نظرة عملية للحجز من الخارج والمستندات المطلوبة.'}, body:{en:['Many Gulf-based buyers shortlist Egypt primary units before travelling. The practical steps are: shortlist projects, ask an advisor for the current developer price list and plan, and confirm reservation terms in writing.','Reserving typically involves a reservation form and a payment to the developer under the developer’s process. Details such as power of attorney and transfers depend on your situation and should be confirmed with the developer and a qualified professional.','The Village supports remote buyers by comparing options in your timezone and confirming figures with the developer — but final legal, transfer and residency questions should be reviewed with a licensed professional.'],ar:['كثير من مشتري الخليج يرشّحون وحدات مصر الأولية قبل السفر. الخطوات العملية: ترشيح المشروعات، وطلب قائمة أسعار المطوّر الحالية والخطة من المستشار، وتأكيد شروط الحجز كتابةً.','يتضمّن الحجز عادةً استمارة حجز ودفعة للمطوّر وفق إجراءاته. أمّا تفاصيل مثل التوكيل والتحويلات فتعتمد على حالتك ويجب تأكيدها مع المطوّر ومختصّ مؤهّل.','تدعم The Village المشترين عن بُعد بمقارنة الخيارات بتوقيتهم وتأكيد الأرقام مع المطوّر — على أن تُراجَع المسائل القانونية والتحويل والإقامة مع مختصّ مرخّص.']}},
    {slug:'reading-payment-plans', cat:{en:'Payment plans',ar:'خطط السداد'}, read:5, title:{en:'Reading an Egyptian payment plan before you sign',ar:'قراءة خطة السداد المصرية قبل التوقيع'}, excerpt:{en:'Down payment, installment years and the fees to ask about.',ar:'المقدم وسنوات التقسيط والرسوم التي يجب السؤال عنها.'}, body:{en:['A typical Egyptian primary plan has a down payment (a percentage of the unit price), equal or stepped installments over several years, and a delivery date. Some plans add maintenance and clubhouse fees.','Ask about the total contract price, whether the down payment includes reservation, the installment frequency, any delivery-linked payments, and the maintenance deposit. These change the real cost more than the headline price.','Every figure shown on this site is illustrative. Before signing, ask an advisor for the current developer plan in writing so you compare like for like.'],ar:['الخطة الأولية المصرية النموذجية تتضمّن دفعة مقدمة (نسبة من سعر الوحدة) وأقساطاً متساوية أو متدرّجة على سنوات وتاريخ تسليم، وقد تُضاف رسوم صيانة ونادٍ.','اسأل عن إجمالي سعر التعاقد، وهل يشمل المقدم الحجز، ودورية الأقساط، وأي دفعات مرتبطة بالتسليم، ووديعة الصيانة؛ فهذه تغيّر التكلفة الحقيقية أكثر من السعر المعلن.','كل رقم على الموقع تقديري. قبل التوقيع اطلب من المستشار خطة المطوّر الحالية كتابةً لتقارن على أساس واحد.']}},
    {slug:'compare-developers', cat:{en:'Developer guide',ar:'دليل المطوّرين'}, read:6, title:{en:'How to compare Egyptian developers fairly',ar:'كيف تقارن المطوّرين المصريين بإنصاف'}, excerpt:{en:'Track record, delivery and finishing — what to weigh.',ar:'السجل والتسليم والتشطيب — ما الذي يجب موازنته.'}, body:{en:['When comparing developers, look at delivery track record (do they hand over on time?), build and finishing quality, the maturity of their existing communities, and after-sales and facility management.','A big brand is not automatically the right fit — a smaller developer with a strong recent delivery record can suit a specific budget or area better.','Use the developer pages on this site as a starting point for names and areas, then ask an advisor for the current project list and terms for each.'],ar:['عند مقارنة المطوّرين انظر إلى سجل التسليم (هل يسلّمون في المواعيد؟)، وجودة البناء والتشطيب، ونضج مجتمعاتهم القائمة، وخدمات ما بعد البيع وإدارة المرافق.','العلامة الكبيرة ليست دائماً الأنسب؛ فقد يناسبك مطوّر أصغر بسجل تسليم قوي حديث في ميزانية أو منطقة محدّدة.','استخدم صفحات المطوّرين هنا كنقطة بداية للأسماء والمناطق، ثم اطلب من المستشار قائمة المشروعات والشروط الحالية لكلٍّ منهم.']}},
    {slug:'egyptians-abroad', cat:{en:'Overseas guide',ar:'دليل الخارج'}, read:7, title:{en:'Egyptians abroad: reserving a unit from overseas',ar:'المصريون بالخارج: حجز وحدة من الخارج'}, excerpt:{en:'Power of attorney, transfers and advisor support.',ar:'التوكيل والتحويلات ودعم المستشار.'}, body:{en:['Egyptians abroad often buy primary units to hold or for family. The workflow is similar to any remote purchase: shortlist, confirm current developer terms, and reserve under the developer’s process.','A power of attorney can let a trusted person or professional complete steps locally on your behalf. The exact wording and transfer method should be confirmed with the developer and a licensed professional for your country.','The Village helps you compare and confirm figures with the developer; it does not provide legal, tax or immigration advice.'],ar:['يشتري المصريون بالخارج غالباً وحدات أولية للاحتفاظ أو للعائلة. الإجراء يشبه أي شراء عن بُعد: ترشيح، وتأكيد شروط المطوّر الحالية، والحجز وفق إجراءاته.','يتيح التوكيل لشخص موثوق أو مختصّ إتمام الخطوات محلياً نيابةً عنك. تُؤكَّد الصياغة الدقيقة وطريقة التحويل مع المطوّر ومختصّ مرخّص في بلدك.','تساعدك The Village على المقارنة وتأكيد الأرقام مع المطوّر، ولا تقدّم استشارة قانونية أو ضريبية أو خاصة بالهجرة.']}}

  var FAQ = [
    {label:{en:'About The Village',ar:'عن The Village'}, items:[
      {q:{en:'Who is The Village?',ar:'من هي The Village؟'}, a:{en:'The Village is a real-estate marketing and brokerage company in Egypt. We help you buy or invest in residential and commercial units across the finest areas of New Cairo and Fifth Settlement, with trusted options, honest advisory and flexible payment plans from your first question to unit handover.',ar:'The Village شركة متخصصة في التسويق والوساطة العقارية في مصر، تساعدك على شراء أو استثمار الوحدات السكنية والتجارية في أرقى مناطق القاهرة الجديدة والتجمع الخامس، مع اختيارات موثوقة واستشارة عقارية وأنظمة سداد مرنة من البداية حتى استلام وحدتك.'}},
      {q:{en:'Which areas do you offer units in?',ar:'ما المناطق التي توفرون فيها وحدات؟'}, a:{en:'The Village offers residential and commercial units across Egypt’s most important areas such as Fifth Settlement, New Cairo and the New Administrative Capital — including apartments, villas, duplexes and townhouses in a range of sizes and prices suited to both living and investment.',ar:'توفّر The Village وحدات سكنية وتجارية في أهم مناطق مصر مثل التجمع الخامس والقاهرة الجديدة والعاصمة الإدارية الجديدة، وتشمل شققاً وفيلات ودوبلكس وتاون هاوس بمساحات وأسعار متنوعة تناسب السكن والاستثمار.'}},
      {q:{en:'Do you offer installment plans, and how long?',ar:'هل تقدّمون أنظمة تقسيط؟ وما مدتها؟'}, a:{en:'Yes. The Village offers flexible payment systems; installment lengths vary by project and developer — currently up to 9 years on selected units. The down payment and plan length differ per project, and every figure shown here is illustrative until an advisor confirms the developer’s current terms with you.',ar:'نعم، توفّر The Village أنظمة سداد مرنة تختلف مدتها حسب المشروع والمطوّر — وتصل حالياً حتى 9 سنوات على وحدات مختارة. تختلف الدفعة المقدمة ومدة التقسيط حسب المشروع، وكل رقم معروض هنا استرشادي حتى يؤكّد المستشار شروط المطوّر الحالية معك.'}},
      {q:{en:'What is the difference between primary units and resale?',ar:'ما الفرق بين الوحدات الأولية وإعادة البيع؟'}, a:{en:'Primary units are bought directly from the developer, usually with longer installment plans and launch prices, while resale is from a current owner and may be ready for immediate handover. The Village works in primary sale and helps you understand both so you choose what fits your needs.',ar:'الوحدات الأولية تُشترى مباشرة من المطوّر عادةً بخطط تقسيط أطول وأسعار إطلاق، بينما إعادة البيع تكون من مالك حالي وقد تكون جاهزة للاستلام الفوري. تعمل The Village في البيع الأولي وتساعدك على فهم الخيارين لاختيار الأنسب لك.'}},
      {q:{en:'How do I book a viewing or reach an advisor?',ar:'كيف أحجز معاينة أو أتواصل مع مستشار؟'}, a:{en:'Leave your details in the contact form on this site, or reach us directly by phone or WhatsApp — a real-estate advisor will follow up to arrange a viewing, answer your questions and suggest suitable units.',ar:'اترك بياناتك في نموذج التواصل بالموقع، أو تواصل معنا مباشرةً عبر الهاتف أو واتساب، وسيتابع معك مستشار عقاري لترتيب معاينة والإجابة عن أسئلتك واقتراح الوحدات المناسبة.'}},
      {q:{en:'Do you offer free real-estate consultations?',ar:'هل تقدّمون استشارات عقارية مجانية؟'}, a:{en:'Yes. The Village offers a free real-estate consultation that helps you understand the market and choose the area, unit and payment plan that fit your goal and budget — with no obligation, before you make any buying decision.',ar:'نعم، تقدّم The Village استشارة عقارية مجانية تساعدك على فهم السوق واختيار المنطقة والوحدة وخطة السداد المناسبة لهدفك وميزانيتك، دون أي التزام، قبل اتخاذ قرار الشراء.'}}
    ]},
    {label:{en:'Buying & figures',ar:'الشراء والأرقام'}, items:[
      {q:{en:'Are the prices on this site final?',ar:'هل الأسعار على الموقع نهائية؟'}, a:{en:'No. Every price, down payment, installment length and delivery date shown here is illustrative and can change. We confirm the current developer price list and plan with you before any commitment. We never present an unverified figure as final.',ar:'لا. كل سعر ودفعة مقدمة ومدة تقسيط وتاريخ تسليم معروض هنا تقديري وقابل للتغيّر، ونؤكّد قائمة أسعار المطوّر الحالية والخطة معك قبل أي التزام. لا نقدّم رقماً غير مؤكّد على أنه نهائي.'}},
      {q:{en:'Do you sell resale or rental units?',ar:'هل تبيعون وحدات إعادة بيع أو إيجار؟'}, a:{en:'No. The Village focuses on primary sale only — new launches, off-plan and developer-direct units. We do not operate as a resale, owner-listing or rental marketplace.',ar:'لا. تركّز The Village على البيع الأولي فقط — الإطلاقات الجديدة والوحدات على الخريطة ومن المطوّر مباشرة. ولا نعمل كسوق لإعادة البيع أو عروض المُلّاك أو الإيجار.'}},
      {q:{en:'Can I buy from outside Egypt?',ar:'هل يمكنني الشراء من خارج مصر؟'}, a:{en:'Yes, many buyers shortlist and reserve remotely. An advisor compares options in your timezone and confirms figures with the developer. Legal, transfer and residency questions should be reviewed with a licensed professional.',ar:'نعم، يرشّح كثير من المشترين ويحجزون عن بُعد. يقارن المستشار الخيارات بتوقيتك ويؤكّد الأرقام مع المطوّر. وتُراجَع المسائل القانونية والتحويل والإقامة مع مختصّ مرخّص.'}}

  function sEl(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); if(a) for(var k in a) e.setAttribute(k,a[k]);

  function shade(hex,f){ hex=(hex||'#0d6e7d').replace('#',''); if(hex.length===3) hex=hex.replace(/(.)/g,'$1$1');
    var n=parseInt(hex,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255, t=f<0?0:255, a=Math.abs(f);
    r=Math.round(r+(t-r)*a); g=Math.round(g+(t-g)*a); b=Math.round(b+(t-b)*a);

      if(rand()<0.62) svg.appendChild(sEl('rect',{x:x,y:y,width:'5',height:'7',rx:'1',fill:'#F3EFE6',opacity:(0.28+rand()*0.5).toFixed(2)})); } } }
  function palm(x,y){ var g=sEl('g',{opacity:'0.92'});

    for(var f=0; f<5; f++){ var a=(-150+f*30)*Math.PI/180, ex=x+Math.cos(a)*24, ey=(y-34)+Math.sin(a)*15;

    lg = lg||lang; params = params||{}; var b='/'+lg+'/';
    switch(name){
      case 'home': return b;

      case 'faqs': return b+'faqs/';
      case 'about': return b+'about/';

      case 'privacy': return b+'privacy/';
      case 'terms': return b+'terms/';

  function parse(pathname){
    var p = pathname;
    if(BASE!=='/' && p.indexOf(BASE)===0) p = '/' + p.slice(BASE.length);
    p = p.replace(/index\.html$/,'');
    if(p==='' || p==='/') return {name:'home', lang:'en', params:{}, redirect:true};
    var m = p.match(/^\/(en|ar)(\/.*)?$/);
    if(!m) return {name:'404', lang:lang, params:{}};
    var lg = m[1], rest = m[2]||'/';
    if(rest.charAt(rest.length-1)!=='/') rest += '/';
    var seg = rest.split('/').filter(Boolean); // e.g. ['projects','villette']
    var params = {}, name;
    if(seg.length===0) name='home';
    else if(seg[0]==='projects') { name = seg[1]?'project':'projects'; if(seg[1]) params.slug=seg[1]; }
    else if(seg[0]==='units') name='units';
    else if(seg[0]==='investors') name='investors';
    else if(seg[0]==='search') name='search';
    else if(seg[0]==='new-launches') name='launches';
    else if(seg[0]==='developers'){ name = seg[1]?'developer':'developers'; if(seg[1]) params.slug=seg[1]; }
    else if(seg[0]==='areas'){ name = seg[1]?'area':'areas'; if(seg[1]) params.slug=seg[1]; }
    else if(seg[0]==='compare') name='compare';
    else if(seg[0]==='insights'){ name = seg[1]?'insight':'insights'; if(seg[1]) params.slug=seg[1]; }
    else if(seg[0]==='faqs') name='faqs';
    else if(seg[0]==='about') name='about';
    else if(seg[0]==='contact') name='contact';
    else if(seg[0]==='privacy') name='privacy';
    else if(seg[0]==='terms') name='terms';
    else name='404';
    // validate entity existence
    if(name==='project' && !projBySlug(params.slug)) name='404';
    if(name==='developer' && !devByKey(params.slug)) name='404';
    if(name==='area' && !areaByKey(params.slug)) name='404';
    if(name==='insight' && !RESEARCH.some(function(r){return r.slug===params.slug;})) name='404';
    return {name:name, lang:lg, params:params};
  }

  /* ==================================================================
     GLOBAL SEARCH (spec §33) — one shared index + ranking, command
     palette (Cmd/Ctrl+K), header entry, and a /search route.
     Arabic-aware normalization; grouped results; keyboard operable.
     ================================================================== */
  function arNorm(s){
    return String(s==null?'':s).toLowerCase()
      .replace(/[ً-ْٰ]/g,'')                 // diacritics
      .replace(/ـ/g,'')                                 // tatweel
      .replace(/[أإآا]/g,'ا')       // alef variants -> ا
      .replace(/ى/g,'ي').replace(/ة/g,'ه') // ى->ي , ة->ه
      .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
      .replace(/[^0-9a-z؀-ۿ\s]/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  var SEARCH_TYPES=['project','unit','developer','area','article','faq','page'];
  var SEARCH_TYPE_LABEL={project:{en:'Projects',ar:'مشروعات'},unit:{en:'Units',ar:'وحدات'},developer:{en:'Developers',ar:'مطوّرون'},area:{en:'Areas',ar:'مناطق'},article:{en:'Guides',ar:'أدلة'},faq:{en:'FAQs',ar:'أسئلة'},page:{en:'Pages',ar:'صفحات'}};
  function buildSearchIndex(){
    var idx=[];
    function add(type,title,subtitle,href,aliases,extra,icon){
      idx.push({type:type,title:title,subtitle:subtitle||'',href:href,aliases:aliases||[],icon:icon,
        norm:arNorm([title,subtitle,(aliases||[]).join(' '),extra||''].join(' '))});
    }
    PROJECTS.forEach(function(p){ var d=devByKey(p.dev),a=areaByKey(p.area);
      add('project',(lang==='ar'?p.name_ar:p.name),L(d.name)+' · '+L(a.name),buildPath('project',{slug:p.slug}),
        [p.name,p.name_ar],L(p.types)+' '+(lang==='ar'?p.tags.ar.join(' '):p.tags.en.join(' '))+' '+a.name.en+' '+a.name.ar+' '+d.name.en+' '+d.name.ar,'build'); });
    UNITS.forEach(function(u){ var p=projBySlug(u.project),a=areaByKey(p.area);
      add('unit',typeLabelC(unitCanon(u))+' — '+(lang==='ar'?p.name_ar:p.name),L(a.name)+' · '+money(u.price),buildPath('project',{slug:p.slug}),
        [u.id,u.type],u.beds+' '+a.name.en+' '+a.name.ar,(TYPE_BY_CANON[unitCanon(u)]||{}).icon||'ty_apartment'); });
    DEVELOPERS.forEach(function(d){ add('developer',L(d.name),L(d.tagline),buildPath('developer',{slug:d.key}),[d.name.en,d.name.ar],L(d.areas)+' '+d.areas.en+' '+d.areas.ar,'shield'); });
    AREAS.forEach(function(a){ add('area',L(a.name),L(a.blurb),buildPath('area',{slug:a.key}),[a.name.en,a.name.ar],'','pin'); });
    RESEARCH.forEach(function(r){ add('article',L(r.title),L(r.cat),buildPath('insight',{slug:r.slug}),[],L(r.excerpt),'doc'); });
    FAQ.forEach(function(g){ g.items.forEach(function(it){ add('faq',L(it.q),L(g.label),buildPath('faqs'),[],L(it.a),'chat'); }); });
    [['units','finder_h'],['compare','cmp_h'],['insights','insights_h'],['faqs','faqs_h'],['about','about_h'],['contact','contact_h'],['launches','nav_launches']]
      .forEach(function(pg){ add('page',t(pg[1]),'',buildPath(pg[0]),[],'','arrow'); });
    return idx;
  }
  function searchAll(q){
    var nq=arNorm(q); if(!nq) return [];
    var toks=nq.split(' ').filter(Boolean), out=[];
    buildSearchIndex().forEach(function(d){
      var title=arNorm(d.title), score=0;
      if(title===nq) score+=100; else if(title.indexOf(nq)===0) score+=60; else if(title.indexOf(nq)>-1) score+=42;
      d.aliases.forEach(function(a){ var na=arNorm(a); if(na===nq) score+=80; else if(na.indexOf(nq)===0) score+=30; });
      var hit=toks.filter(function(tk){ return d.norm.indexOf(tk)>-1; }).length;
      if(hit===toks.length) score+=22; else score+=hit*5;
      if(score>0){ if(d.type==='project'||d.type==='unit') score+=2; out.push({d:d,s:score}); }
    });
    out.sort(function(a,b){ return b.s-a.s; });
    return out.map(function(x){ return x.d; });
  }
  function recentSearches(){ return load('tv_recent', []); }
  function pushRecent(q){ q=(q||'').trim(); if(!q) return; var r=recentSearches().filter(function(x){return x!==q;}); r.unshift(q); store('tv_recent', r.slice(0,6)); }

  /* ---- Command palette ---- */
  var palEls=null, palActive=-1, palItems=[];

  /* ---- Relational Unit Finder (§42) ---- */
  function facetChips(group, opts){

      b.addEventListener('click', function(){ finderToggle(group, o.v); });
      row.appendChild(b);
    });
    if(!row.childNodes.length) row.appendChild(h('span',{class:'muted',style:'font-size:.8rem'}, '—'));
    return row;
  }

  function recoCard(u){
    var card=unitCard(u);
    var sc=scoreUnit(u, FILTER);

  function activeFilterChips(){
    var out=[];
    function push(group, v, label){ var tag=h('span',{class:'filter-tag'}, label, h('button',{type:'button','aria-label':t('cta_reset')+': '+label},'×'));
      tag.querySelector('button').addEventListener('click', function(){ finderToggle(group, v); }); out.push(tag); }
    FILTER.areas.forEach(function(v){ push('areas', v, L(areaByKey(v).name)); });
    FILTER.devs.forEach(function(v){ push('devs', v, L(devByKey(v).name)); });
    FILTER.projects.forEach(function(v){ var p=projBySlug(v); push('projects', v, lang==='ar'?p.name_ar:p.name); });
    FILTER.types.forEach(function(v){ push('types', v, typeLabelC(v)); });
    FILTER.beds.forEach(function(v){ push('beds', v, bedsLabel(v)); });
    FILTER.floors.forEach(function(v){ push('floors', v, lang==='ar'?FLOOR_LABELS[v].ar:FLOOR_LABELS[v].en); });
    FILTER.launch.forEach(function(v){ push('launch', v, lang==='ar'?LAUNCH_LABELS[v].ar:LAUNCH_LABELS[v].en); });
    FILTER.avail.forEach(function(v){ push('avail', v, lang==='ar'?AVAIL_LABELS[v].ar:AVAIL_LABELS[v].en); });
    FILTER.delivery.forEach(function(v){ push('delivery', v, lang==='ar'?DELIVERY_LABELS[v].ar:DELIVERY_LABELS[v].en); });
    if(FILTER.minPrice!=null||FILTER.maxPrice!=null){ var lab=(FILTER.minPrice!=null?moneyM(FILTER.minPrice):'0')+'–'+(FILTER.maxPrice!=null?moneyM(FILTER.maxPrice):'∞');
      var tag=h('span',{class:'filter-tag'}, lab, h('button',{type:'button','aria-label':t('cta_reset')},'×'));
      tag.querySelector('button').addEventListener('click', function(){ FILTER.minPrice=null; FILTER.maxPrice=null; finderApply(); }); out.push(tag); }
    function pushOne(label, onRemove){ var tag=h('span',{class:'filter-tag'}, label, h('button',{type:'button','aria-label':t('cta_reset')+': '+label},'×'));
      tag.querySelector('button').addEventListener('click', onRemove); out.push(tag); }
    if(FILTER.avoidGround) pushOne(t('avoid_ground'), function(){ FILTER.avoidGround=false; finderApply(); });
    if(FILTER.minYears!=null) pushOne(t('years_min_n').replace('{n}', num(FILTER.minYears)), function(){ FILTER.minYears=null; finderApply(); });
    if(FILTER.maxDp!=null) pushOne((lang==='ar'?'مقدم حتى ':'Down ≤ ')+moneyM(FILTER.maxDp), function(){ FILTER.maxDp=null; finderApply(); });
    return out;
  }

  function handleLead(form, fields, summary, submit){
    var errs=[];
    function setErr(f, msg){ if(msg){ f.err.textContent=msg; f.err.style.display='block'; f.input.setAttribute('aria-invalid','true'); errs.push(msg);} else { f.err.style.display='none'; f.input.removeAttribute('aria-invalid'); } }
    setErr(fields.name, fields.name.input.value.trim()?'':t('err_req'));
    var phone=fields.phone.input.value.trim();
    setErr(fields.phone, !phone?t('err_req'):(/^[+]?[\d\s()-]{7,}$/.test(phone)?'':t('err_phone')));
    var email=fields.email.input.value.trim();
    setErr(fields.email, !email?'':(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':t('err_email')));
    var consentInput=form.querySelector('#c-consent'), consentErr=form.querySelector('#err-consent');
    var consent=consentInput.checked, cerr=consentInput.closest('label');
    if(!consent){ errs.push(t('err_consent')); consentInput.setAttribute('aria-invalid','true'); cerr.style.color='var(--danger)';
      if(consentErr){ consentErr.textContent=t('err_consent'); consentErr.style.display='block'; } }
    else { consentInput.removeAttribute('aria-invalid'); cerr.style.color=''; if(consentErr) consentErr.style.display='none'; }
    if(errs.length){
      summary.style.display='flex'; while(summary.firstChild) summary.removeChild(summary.firstChild);
      summary.appendChild(ic('info'));
      if(errs.length===1){ summary.appendChild(document.createTextNode(errs[0])); }
      else { var ul=h('ul',{style:'margin:0;padding-inline-start:18px'}); errs.forEach(function(m){ ul.appendChild(h('li',null,m)); }); summary.appendChild(ul); }

      return;
    }
    summary.style.display='none';
    // Honest submission: only claim success if a real endpoint accepts it.
    if(CONFIG.LEAD_ENDPOINT){
      submit.disabled=true; submit.textContent=t('form_sending');
      var data={name:fields.name.input.value.trim(),phone:phone,email:email,area:form.querySelector('#c-area').value,message:form.querySelector('#c-message').value,locale:lang};
      fetch(CONFIG.LEAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})

        .then(function(){ leadResult(form, true); })
        .catch(function(){ submit.disabled=false; submit.textContent=t('form_send'); leadResult(form, false); });
    } else {
      leadResult(form, null, {name:fields.name.input.value.trim(),phone:phone,email:email,area:form.querySelector('#c-area').value,message:form.querySelector('#c-message').value});

      if(CONFIG.email) row.appendChild(h('a',{class:'btn btn--ghost btn--sm', href:'mailto:'+CONFIG.email+'?subject='+encodeURIComponent(loc?'استفسار عقاري':'Property enquiry')+'&body='+encodeURIComponent(msg)}, ic('doc'), t('send_email')));

    }
    form.appendChild(box); box.scrollIntoView({behavior:'smooth',block:'center'});

      var cur = FILEMODE ? (location.hash?location.hash.slice(1):('/'+canonLg+'/')) : (stripBase(location.pathname)+(location.search||''));
      if(cur.charAt(0)!=='/') cur='/'+cur;
      canonical = CONFIG.origin+cur;
      setAttr('lnk-canonical','href',canonical);
      setAttr('lnk-alt-en','href',canonical); setAttr('lnk-alt-ar','href',canonical); setAttr('lnk-alt-x','href',canonical);
    } else {

    setAttr('meta-robots','content', view.indexable?'index,follow,max-image-preview:large':'noindex,follow');
    setAttr('og-title','content',view.title); setAttr('og-desc','content',view.desc);
    setAttr('og-url','content',canonical);
    setAttr('og-locale','content',lang==='ar'?'ar_EG':'en_US');
    setAttr('og-locale-alt','content',lang==='ar'?'en_US':'ar_EG');
    setAttr('tw-title','content',view.title); setAttr('tw-desc','content',view.desc);
    // JSON-LD: breadcrumb (+ optional page ld)
    var graph=[];
    if(view.crumbs && view.crumbs.length){
      graph.push({'@type':'BreadcrumbList','itemListElement':view.crumbs.map(function(c,i){
        var o={'@type':'ListItem','position':i+1,'name':c.label}; if(c.path) o.item=CONFIG.origin+c.path; return o; })});
    }
    if(view.ld){ var pg=Object.assign({'url':canonical}, view.ld); graph.push(pg); }
    setLD({'@context':'https://schema.org','@graph':graph});
  }
  function setMeta(name,val){ var m=document.querySelector('meta[name="'+name+'"]'); if(m) m.setAttribute('content',val||''); }
  function setAttr(id,attr,val){ var e=document.getElementById(id); if(e) e.setAttribute(attr,val); }
  function setLD(obj){ var s=document.getElementById('ld-page'); if(s) s.textContent=JSON.stringify(obj); }

  function render(r, opts){
    opts=opts||{}; currentRoute=r; lang=r.lang||lang;
    var de=document.documentElement;
    de.setAttribute('lang',lang); de.setAttribute('dir', lang==='ar'?'rtl':'ltr'); de.setAttribute('data-lang',lang);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', r.name==='home'?'#073D52':'#faf7f0');
    var view=viewFor(r);
    var main=document.getElementById('main'); clear(main); main.appendChild(view.node);
    updateChrome(r); setHead(r, view);
    closeDrawer();
    if(view.announce){ var sr=document.getElementById('sr-live'); if(sr) sr.textContent=view.announce; }   // persistent live region (survives view swap)
    if(typeof railRefresh==='function') railRefresh();   // keep the contact rail/nudge localized
    if(pendingFocusId){ var fe=document.getElementById(pendingFocusId); pendingFocusId=null; if(fe){ try{ fe.focus({preventScroll:true}); }catch(e){ fe.focus(); } return; } }
    if(!opts.keep){ window.scrollTo(0,0); try{ main.focus({preventScroll:true}); }catch(e){ main.focus(); } }
  }

  function readLoc(){
    if(FILEMODE){
      var hs=location.hash.slice(1);
      if(!hs) return {path:'/en/', search:''};
      var qi=hs.indexOf('?');
      return qi<0?{path:hs,search:''}:{path:hs.slice(0,qi),search:hs.slice(qi)};
    }
    return {path:location.pathname, search:location.search};
  }
  function route(){
    var loc=readLoc(); CUR.search=loc.search;
    var r=parse(loc.path);
    if(r.redirect){
      if(FILEMODE){ CUR.search=''; if(location.hash!=='#/en/'){ location.hash='#/en/'; return; } }
      else { replaceURL(U('/en/')); }
      r={name:'home',lang:'en',params:{}};
    }
    render(r);
  }
  // dest = locale-absolute path (+optional query), e.g. "/en/projects/?area=x"
  function navigateTo(dest, replace){
    var qi=dest.indexOf('?'); var pathOnly=qi<0?dest:dest.slice(0,qi); var search=qi<0?'':dest.slice(qi);
    var r=parse(pathOnly); var keep=replace===true && r.name===(currentRoute&&currentRoute.name);
    if(FILEMODE){
      CUR.search=search;
      var nh='#'+pathOnly+search;
      if(location.hash===nh){ render(r,{keep:keep}); } else { location.hash=nh; } // hashchange -> route()
      return;
    }
    var url=U(pathOnly)+search;
    if(replace) replaceURL(url); else pushURL(url);
    CUR.search=search; render(r,{keep:keep});
  }

  /* ==================================================================
     GLOBAL INTERACTIONS
     ================================================================== */
  document.addEventListener('click', function(e){
    var a=e.target.closest && e.target.closest('a'); if(!a) return;
    var href=a.getAttribute('href'); if(!href) return;
    if(a.target==='_blank'||a.hasAttribute('download')){
      if(/wa\.me|whatsapp/i.test(href)) track('whatsapp_clicked');
      return;
    }
    if(/^(https?:|mailto:|tel:|#)/.test(href)){
      if(/wa\.me|whatsapp/i.test(href)) track('whatsapp_clicked');
      else if(href.indexOf('tel:')===0) track('phone_clicked');
      else if(href.indexOf('mailto:')===0) track('email_clicked');
      return;
    }
    e.preventDefault(); navigateTo(stripBase(a.pathname) + (a.search||''));
  });
  if(FILEMODE) window.addEventListener('hashchange', route);
  else window.addEventListener('popstate', route);

  // language toggle (preserves the current route)
  function switchLang(){ var r=parse(readLoc().path); var other=lang==='en'?'ar':'en';
    navigateTo(buildPath(r.name==='404'?'home':r.name, r.params, other) + (CUR.search||'')); }
  document.getElementById('lang-toggle').addEventListener('click', switchLang);
  document.getElementById('lang-toggle-2').addEventListener('click', switchLang);

  // drawer
  var drawer=document.getElementById('drawer'), dback=document.getElementById('drawer-back'), burger=document.getElementById('burger');
  function openDrawer(){ drawer.classList.add('open'); dback.classList.add('open'); drawer.setAttribute('aria-hidden','false'); burger.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; document.getElementById('drawer-close').focus(); }
  function closeDrawer(){ var wasOpen=drawer.classList.contains('open'), hadFocus=drawer.contains(document.activeElement); drawer.classList.remove('open'); dback.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); burger.setAttribute('aria-expanded','false'); document.body.style.overflow=''; if(wasOpen && hadFocus){ try{ burger.focus(); }catch(e){} } }
  burger.addEventListener('click', openDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  dback.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && drawer.classList.contains('open')) closeDrawer(); });

  // toast
  var toastTimer=null;
  function toast(msg, icon){
    var host=document.getElementById('toast-host'); clear(host);
    var el=h('div',{class:'toast'}, icon?ic(icon):null, msg); host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ clear(host); },250); }, 3000);
  }

  /* ==================================================================
     BOOT
     ================================================================== */
  route();
  chatBuild();
  searchInit();
  contactRailBuild();
  </script>
</body>
</html>
